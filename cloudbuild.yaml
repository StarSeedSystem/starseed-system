steps:
  # 1. Construir la imagen Docker pasando las variables de entorno como ARGs para Next.js
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/starseed-os:$COMMIT_SHA'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=$_NEXT_PUBLIC_SUPABASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=$_NEXT_PUBLIC_SUPABASE_ANON_KEY'
      - '.'
  
  # 2. Subir la imagen al Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/starseed-os:$COMMIT_SHA']
  
  # 3. Desplegar en Cloud Run (Soberanía de Datos y Costo $0)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'starseed-os'
      - '--image'
      - 'gcr.io/$PROJECT_ID/starseed-os:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Escalar a 0 para mantener el costo en cero cuando no hay tráfico
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--cpu-boost'
      - '--port'
      - '3000'
      # Pasar variables al runtime también por seguridad
      - '--set-env-vars'
      - 'NEXT_PUBLIC_SUPABASE_URL=$_NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY=$_NEXT_PUBLIC_SUPABASE_ANON_KEY'

images:
  - 'gcr.io/$PROJECT_ID/starseed-os:$COMMIT_SHA'
