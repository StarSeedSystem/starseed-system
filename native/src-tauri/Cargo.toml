# ═══════════════════════════════════════════════════════════════════════════
# StarSeed Native — Manifiesto Cargo (Tauri 2)
# ---------------------------------------------------------------------------
# Este crate NO contiene la web: envuelve la web desplegada (StarSeed OS /
# Nexus / Café) en una app nativa por sistema operativo. La web se carga en
# remoto (ver tauri.conf.json → app.windows[].url), así que aquí no hay
# frontend embebido: solo el "cuerpo" nativo con integración real de sistema.
#
# Un solo binario `starseed-native` sirve a los tres sistemas: se compila el OS
# por defecto y Nexus/Café con `-c tauri.nexus.conf.json` / `-c tauri.cafe.conf.json`.
# ═══════════════════════════════════════════════════════════════════════════

[package]
name = "starseed-native"
version = "0.5.0"
description = "Empaquetado nativo (Tauri 2) de los sistemas StarSeed: OS, Nexus y Café. Envuelve la web desplegada en una app nativa por SO con actualización in-app y control profundo del dispositivo."
authors = ["Alex Bordón Garrigós <alexbordongarrigos@gmail.com>", "StarSeedSystem"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/StarSeedSystem/starseed-system"
edition = "2021"
# El plugin updater/shell exige Rust >= 1.77.2.
rust-version = "1.77.2"
# El binario producido se llama `starseed-native`.
default-run = "starseed-native"

# Target de LIBRERÍA — OBLIGATORIO para Android/iOS: el proyecto que genera
# `cargo tauri android|ios init` compila este crate como librería (cdylib en
# Android vía JNI, staticlib en iOS) y entra por `tauri::mobile_entry_point`
# (ver src/lib.rs). Sin esta sección, cargo falla con
# "no library targets found in package" (fallo del run de CI del 2026-07-05).
[lib]
name = "starseed_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# El binario de escritorio: un main fino que llama a la librería (src/lib.rs).
[[bin]]
name = "starseed-native"
path = "src/main.rs"

[build-dependencies]
# Genera el contexto de Tauri (embebe tauri.conf.json, iconos y capabilities).
tauri-build = { version = "2", features = [] }

[dependencies]
# Núcleo de Tauri 2. El feature `tray-icon` deja un icono en la bandeja del
# sistema (compañero siempre presente). No fijamos features de protocolo aquí:
# el CLI las gestiona según tauri.conf.json.
# (MIC1108A) ≥ 2.12: `Builder::on_permission_request` decide micrófono/cámara/pantalla por origen
# (src/permisos_medios.rs). El CI ya resolvía 2.12.x; aquí queda escrito.
tauri = { version = "2.12", features = ["tray-icon"] }

# ─── Plugins oficiales de Tauri 2 (todos en su major 2) ───
# Terminal / procesos: el puente de "control por terminal" para Aurora.
tauri-plugin-shell = "2"
# Notificaciones nativas del sistema.
# (NOT1108A) ≥ 2.8: `on_action` avisa al pulsar una notificación (escritorio y Android) y el canal de
# Android de los mensajes (`create_channel`). El CI ya resolvía 2.8.x; aquí queda escrito.
tauri-plugin-notification = "2.8"
# Diálogos nativos (abrir/guardar/confirmar) — consentimiento del usuario.
tauri-plugin-dialog = "2"
# Sistema de archivos con scope (lectura/escritura de rutas del usuario).
tauri-plugin-fs = "2"
# Información del sistema operativo (plataforma, arquitectura, versión…).
tauri-plugin-os = "2"
# Control del proceso (reiniciar/salir) — necesario tras instalar update.
tauri-plugin-process = "2"
# Enlaces profundos starseed:// (abrir el sistema desde la web / otras apps).
tauri-plugin-deep-link = "2"

# ─── Serialización ───
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# El updater usa thiserror para el error del comando fetch/install (patrón oficial).
thiserror = "2"

# (ACT1108A) Comparar versiones del canal de pruebas con las MISMAS reglas que tauri-plugin-updater
# (0.5.0 < 0.5.1-prueba.23 < 0.5.1). Ya estaba en el árbol (tauri-utils): no baja ni compila nada nuevo.
semver = "1"

# ─── Plugins SOLO ESCRITORIO (no compilan / no aplican en Android · iOS) ───
# Patrón oficial de la doc de Tauri 2: van bajo un target cfg que excluye móvil,
# y en el código se registran dentro de #[cfg(desktop)] (ver src/lib.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Actualización incremental DENTRO de la app (sin reinstalar).
tauri-plugin-updater = "2"
# (ACT1108B) Ruta alternativa de la actualización por la API de GitHub (src/canal_actualizacion.rs): hay que
# listar los archivos del Release (`releases/tags/<etiqueta>`) para saber el id del asset. Son LAS MISMAS
# crates y versiones que ya trae tauri-plugin-updater (se unifican: no baja ni compila nada nuevo).
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Arranque automático con el sistema (el compañero se levanta solo).
tauri-plugin-autostart = "2"
# ─── Dependencias de `ventana_remota` (APR1019A/B, 2026-11-02) ───
# Versión real 0.9: únicamente los features «image» y «wgc» existen (ninguno va por
# defecto; «wgc» solo afecta a Windows). `xcap::Window::all()` sustituye al par
# Monitor/windows() que ya no existe en esta versión.
# (2026-11-09) xcap 0.9.9 no compila en Linux (el CI): wayland_video_recorder.rs usa
# `SourceType::Monitor/Window`, que no existen. Se fija 0.9.8 (último verde) hasta que xcap lo arregle;
# entonces se puede levantar el fijado.
xcap = { version = "=0.9.8", features = ["image", "wgc"] }
# Redimensiona la captura (`image::imageops::resize`) y da el `RgbaImage` que
# devuelve `capture_image()` en xcap 0.9.
image = "0.25"
# Codifica la captura como PNG en base64 (API 0.22 de engines:
# `base64::engine::general_purpose::STANDARD.encode`).
base64 = "0.22"
# Entrada remota: teclado y ratón con enigo 0.6. Sin features keyboard/mouse;
# los traits `Keyboard` y `Mouse` están disponibles por defecto.
enigo = "0.6"
# ─── Capas del servidor local (CAP1107A · T1, 2026-11-07) ───
# Verificar el manifiesto de cada capa con la MISMA clave minisign del updater. Es la crate que
# tauri-plugin-updater ya usa para lo mismo (0.3, sin dependencias): no baja ni compila nada nuevo.
minisign-verify = "0.3"
# Descomprimir el .tar.gz de la capa (el tar lo lee servidor_capas_logica.rs, estricto). Ya está en
# el árbol por `png` (image/xcap) y tauri-plugin-updater: no baja ni compila nada nuevo.
flate2 = "1"

# (2026-10-19) tauri-plugin-deep-link 2.6.2 construye `ini::ParseOption` con 2 campos y rust-ini
# 0.21.3 añadió dos más: en Linux (el CI) no compila. Se fija 0.21.1 hasta que deep-link lo arregle.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"
# (TAM1107A · T4b) Migración del origen web SIN internet (src/migracion_origen_local.rs): la ventana oculta
# carga un HTML del binario con la dirección de la web publicada. Son las MISMAS crates y versiones que ya
# trae tauri para cada motor (se unifican; no se descarga nada nuevo): WebKitGTK `load_html`.
# (MIC1108A) `v2_38` para `set_enable_webrtc` (MediaStream y WebRTC vienen apagados en WebKitGTK):
# es el mismo feature que ya pide tauri-runtime-wry, no compila nada nuevo.
webkit2gtk = { version = "2", features = ["v2_38"] }
# (LNX1109B) Bluetooth directo (BlueZ) y Wi-Fi Direct (wpa_supplicant P2P + NetworkManager) por D-Bus, sin privilegios.
# zbus 5.19 y libc ya están en el árbol (notify-rust/xcap/tauri): se unifican, no baja ni compila nada nuevo. `bluer`
# se descartó: exige libdbus-1-dev del sistema (libdbus-sys) y tokio entero; con zbus (Rust puro) el CI de Linux no
# necesita ningún paquete más. Los sockets L2CAP LE CoC se abren con libc (AF_BLUETOOTH/BTPROTO_L2CAP).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
libc = "0.2"

# WKWebView `loadHTMLString:baseURL:` (objc2 y objc2-foundation de tauri/wry).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# (WFA1109A) Bloques de Objective-C para los callbacks de Network.framework (AWDL). Ya está en el árbol (objc2/wry): no baja nada nuevo.
block2 = "0.6"
# (BLE1108A) + NSArray, NSData, NSDictionary, NSError, NSUUID, NSValue y NSObject para CoreBluetooth (ble_macos.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSData", "NSDictionary", "NSError", "NSUUID", "NSValue", "NSObject", "NSProcessInfo", "NSStream", "NSRunLoop", "NSDate", "NSObjCRuntime"] }
# (BLE1108A) Bluetooth directo en macOS: CoreBluetooth (central y periférico) del mismo proyecto objc2 que ya
# usan tauri/wry (solo enlaces generados de los encabezados de Apple, sin código C ni build script). Fijada:
# su API se comprobó con `cargo check --target aarch64-apple-darwin` (contrato bluetooth-directo.md §8).
objc2-core-bluetooth = { version = "=0.3.2", default-features = false, features = ["std", "dispatch2", "CBManager", "CBCentralManager", "CBCentralManagerConstants", "CBPeripheralManager", "CBPeripheralManagerConstants", "CBPeripheral", "CBCentral", "CBPeer", "CBService", "CBCharacteristic", "CBDescriptor", "CBUUID", "CBATTRequest", "CBAdvertisementData", "CBAttribute", "CBError", "CBL2CAPChannel"] }
# (BLE1109A) + NSStream, NSRunLoop, NSDate y NSObjCRuntime (flujos del canal L2CAP) y CBL2CAPChannel: mismas crates, solo más enlaces generados.
# (BLE1108A) La cola de despacho propia de CoreBluetooth; ya está en el árbol (objc2/wry): no baja nada nuevo.
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }

# WebView2 `WebResourceRequested` + `SHCreateMemStream` (webview2-com y windows de tauri/wry).
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_UI_Shell", "Win32_System_Com",
    # <WIN1109B> WinRT del P2P directo de Windows: Bluetooth LE (central y periférico), radios, Wi-Fi y Wi-Fi Direct,
    # direcciones de red, credenciales del grupo y bytes aleatorios. Son las mismas crates `windows` que ya trae
    # tauri/wry: solo más enlaces generados (no baja nada nuevo). Se comprobó con `cargo check --target x86_64-pc-windows-msvc`.
    "Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration",
    "Devices_Radios", "Devices_WiFi", "Devices_WiFiDirect", "Foundation", "Foundation_Collections", "Networking",
    "Networking_Connectivity", "Security_Credentials", "Security_Cryptography", "Storage_Streams",
] }

# ═══════════════════════════════════════════════════════════════════════════
# Notas de compilación (NO se compila aquí; lo hace el CI o el dueño en local):
#   · Requiere la Tauri CLI 2.x:  cargo install tauri-cli --version "^2"
#   · Compilar OS:     cargo tauri build              (usa tauri.conf.json)
#   · Compilar Nexus:  cargo tauri build -c tauri.nexus.conf.json
#   · Compilar Café:   cargo tauri build -c tauri.cafe.conf.json
#   · Android:         cargo tauri android init  &&  cargo tauri android build
# ═══════════════════════════════════════════════════════════════════════════

[profile.release]
# Binarios más pequeños y rápidos para distribución.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
