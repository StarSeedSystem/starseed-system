<!doctype html>
<!--
  Página de arranque de la app nativa de StarSeed OS (APP1107A, 2026-11-07).
  Va DENTRO de la app (frontendDist de tauri.conf.json): se ve sin red mientras el servidor local
  arranca. La app le cuenta lo que pasa con window.__starseedArranque(fase, mensaje) (eval desde
  Rust, native/src-tauri/src/servidor_local.rs). Sin recursos externos: todo en este archivo.
  Contrato: architecture/apps-autonomas-sin-internet.md
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>StarSeed OS</title>
<style>
  :root { color-scheme: dark; --fondo: #0A0712; --texto: #ECE8F5; --suave: #A79FBF; --azur: #007FFF; --lima: #39FF14; --ambar: #FFBF00; --carmesi: #DC143C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  .halo { position: fixed; inset: -20%; pointer-events: none;
    background: radial-gradient(40% 35% at 50% 18%, rgba(0,127,255,.22), transparent 70%),
                radial-gradient(30% 30% at 18% 60%, rgba(57,255,20,.10), transparent 70%),
                radial-gradient(30% 30% at 82% 60%, rgba(255,191,0,.10), transparent 70%),
                radial-gradient(35% 30% at 50% 95%, rgba(220,20,60,.14), transparent 70%); }
  main { position: relative; width: min(30rem, 88vw); text-align: center; padding: 2.4rem 2rem;
    border-radius: 1.6rem; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter: blur(14px); }
  .semilla { width: 4.2rem; height: 4.2rem; margin: 0 auto 1.4rem; position: relative; }
  .semilla::before, .semilla::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid transparent; border-top-color: var(--azur); border-right-color: var(--lima);
    animation: girar 1.6s linear infinite; }
  .semilla::after { inset: .7rem; border-top-color: var(--ambar); border-right-color: var(--carmesi);
    animation-duration: 2.4s; animation-direction: reverse; }
  .listo .semilla::before, .listo .semilla::after { animation-play-state: paused; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .semilla::before, .semilla::after { animation: none; } }
  h1 { margin: 0 0 .5rem; font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
  p { margin: 0; line-height: 1.5; color: var(--suave); font-size: .95rem; }
  .fase { margin-top: 1.2rem; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--azur); }
  .aviso .fase { color: var(--ambar); }
</style>
</head>
<body>
<div class="halo" aria-hidden="true"></div>
<main id="caja">
  <div class="semilla" aria-hidden="true"></div>
  <h1>StarSeed OS</h1>
  <p id="mensaje" role="status" aria-live="polite">Preparando StarSeed OS en esta neurona…</p>
  <div class="fase" id="fase">arrancando</div>
</main>
<script>
  (function () {
    var NOMBRES = {
      "arrancando": "arrancando en local",
      "local": "en local · sin depender de internet",
      "reiniciando": "reiniciando el servidor local",
      "web-publicada": "abriendo la web publicada",
      "sin-internet": "sin servidor local y sin internet"
    };
    window.__starseedArranque = function (fase, mensaje) {
      var caja = document.getElementById("caja");
      document.getElementById("mensaje").textContent = String(mensaje || "");
      document.getElementById("fase").textContent = NOMBRES[fase] || String(fase || "");
      caja.className = (fase === "local" ? "listo" : "") + (fase === "sin-internet" || fase === "web-publicada" ? " aviso" : "");
    };
    if (window.__starseedUltimo) window.__starseedArranque(window.__starseedUltimo[0], window.__starseedUltimo[1]);
  })();
</script>
</body>
</html>
