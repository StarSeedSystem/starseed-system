name: Instaladores StarSeed OS (Tauri)

# ═══════════════════════════════════════════════════════════════════════════
# RETIRADO 2026-09-24: el proyecto Tauri OFICIAL es `native/` (workflow
# `native-build.yml`, identifier `app.starseed.os`, tags `v*`). Este workflow
# compilaba el `src-tauri/` de la RAÍZ (identifier `org.starseed.os`), que
# quedó como duplicado sin mantener — su pubkey del updater ni siquiera
# coincidía ya con la clave de firma real (ver claude/relevo-actual.md).
# Nunca se descargó ningún instalador generado por este workflow (0 descargas
# registradas), así que no hay usuarios a los que migrar.
#
# Se quita el disparo automático por tag `desktop-v*` para que un tag antiguo
# o por error NUNCA vuelva a publicar un Release desde el proyecto retirado.
# Se deja `workflow_dispatch` únicamente por si alguna vez hace falta revivir
# o consultar este scaffold; no lo dispara nada automático.
# ═══════════════════════════════════════════════════════════════════════════

# Compila el shell nativo para macOS (Apple Silicon + Intel), Linux (x64 + ARM64)
# y Windows, publica los instaladores en GitHub Releases y genera latest.json
# para que las apps ya instaladas se auto-actualicen conservando sus datos.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Dependencias Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Compilar y publicar instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "StarSeed OS v__VERSION__"
          releaseBody: "Instaladores multiplataforma de StarSeed OS. El modelo de Astraura (Needle 2 → Ternary Bonsai 8B) y el tamaño de conciencia colectiva se eligen dentro de la app y son reconfigurables en Ajustes. El contenido (red, publicaciones, Astraura servidor) se actualiza al instante sin reinstalar; el shell se auto-actualiza desde estas Releases conservando los datos."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
