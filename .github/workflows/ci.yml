# ════════════════════════════════════════════════════════════════════════════
# CI · Verificación web (Adenda 124 · mejora de proceso; + Vitest en Adenda 148)
# ----------------------------------------------------------------------------
# Puerta de calidad en CADA push/PR a `main`: typecheck + tests unitarios
# (Vitest: gobernanza/seguridad) + tests del núcleo mesh/cripto + build de
# producción. Evita que un push roto llegue a Vercel.
# (Complementa a native-build.yml, que solo corre en etiquetas v* para releases.)
# ════════════════════════════════════════════════════════════════════════════
name: CI · verificación web

on:
  push:
    # `main` + ramas `produccion/**`: el director de producción empuja el lote a
    # `produccion/candidato` (§3.4 de architecture/director-produccion.md) y esta
    # puerta corre tsc, tests y build ahí antes de promover a producción.
    branches: [main, "produccion/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# (1104 · AG) OpenUI (@openuidev/lang-core) avisa por telemetría al instalarse: apagada en cada npm ci.
env:
  OPENUI_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  verify:
    name: Typecheck · Unit · Mesh · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: alineado con el runtime de desarrollo y de despliegue. El
          # harness de test-mesh-core corre SIN empaquetar vía tsx; en Node 20 tsx
          # puede instanciar dos veces un módulo (cachés en memoria desincronizadas)
          # y romper una prueba de aislamiento del cifrado por-destinatario que en
          # la app EMPAQUETADA (instancia única) no ocurre. Node 22 = mismo runtime real.
          node-version: '22'
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
        env:
          # (2026-10-26) Con el montón por defecto (~4 GB) tsc ya muere por memoria («JavaScript heap out of
          # memory», exit 134: runs 40265392894, 40267313842, 40269427314) y la autopublicación se frena con
          # «CI en rojo». La máquina tiene 16 GB, como para el build de abajo.
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Tests unitarios (Vitest · gobernanza + seguridad)
        run: npm test
      - name: Tests del núcleo mesh/cripto
        run: npx --yes tsx scripts/test-mesh-core.ts
      - name: Build de producción (next build)
        # (2026-10-08) NO `npm run build`: el script de package.json fija NODE_OPTIONS=4096 en la
        # propia orden y pisaba el 8192 de aquí abajo, así que el build seguía muriendo por memoria
        # (runs 37709017023 y anteriores). Mismo prebuild (version.json) y el mismo next build.
        run: npm run prebuild && npx next build
        env:
          # (2026-10-07) Con 4096 el build moría por memoria («JavaScript heap out of memory»,
          # exit 134) desde hace días: CI en rojo en todos los push a main. La máquina de
          # GitHub tiene 16 GB; la autopublicación usa este CI como puerta de build.
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_TELEMETRY_DISABLED: "1"
          # (2026-10-29, IND1029) Variables del repo para el build: el .next se sube como artefacto
          # y el reconstructor de la Mac lo descarga cuando Genesis no puede compilar.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      - name: Manifiesto de precarga sin conexión (postbuild)
        # (SW1107A) Lo mismo que hace `npm run build` en Vercel tras el build: public/precarga.json para el
        # service worker. Aquí se comprueba con el build real; nunca falla el CI (avisa en amarillo).
        run: npm run postbuild
        # (2026-10-29, IND1029) Artefacto del build: el reconstructor de la Mac lo descarga cuando
        # Genesis no puede compilar. El .next se sube sin caché (NEXT_PUBLIC_* de variables del repo,
        # no secretos: son públicos por diseño). El artifact name usa el sha para identificar el
        # build exacto que sirve.
      - name: Subir artefacto de build (genesis-next-<sha>)
        uses: actions/upload-artifact@v4
        with:
          name: genesis-next-${{ github.sha }}
          path: .next
          retention-days: 3

  tauri-check:
    name: Tauri · cargo check
    runs-on: ubuntu-latest
    # continue-on-error: la verificación de la app nativa (Tauri) es informativa
    # por ahora; no debe bloquear la puerta web de `verify` ante un fallo propio.
    continue-on-error: true
    # (SUP1111A) Tope del job: normalmente tarda 2-3 min (apt ~1 min y cargo check con caché <1 min). Sin tope, un
    # apt colgado en un espejo lo dejó 46-55 min en «Dependencias de sistema de Tauri v2» (runs 43046445511 y
    # 43055580534, 11-11): el run no terminaba y la autopublicación vetaba el candidato con «CI sin terminar en
    # 50 min» aunque `verify` ya tuviera veredicto. Con tope, el job se corta y no retiene la puerta.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Mismas dependencias de sistema que usa native-build.yml para su job de
      # Linux (ver .github/workflows/native-build.yml → "Dependencias de Linux
      # (Tauri)"), más libayatana-appindicator3-dev (equivalente moderno de
      # libappindicator3-dev en runners recientes de Ubuntu) para que `cargo
      # check` resuelva el feature `tray-icon` de Cargo.toml sin fallar.
      - name: Dependencias de sistema de Tauri v2
        # (SUP1111A) El mismo remedio que CI1111M en native-build.yml: cada intento con su tope (`timeout`), apt
        # reintenta y se rinde solo (Acquire::Retries/Timeout) y el paso entero tiene `timeout-minutes`. Si no hay
        # manera, el job sale en rojo en minutos (es informativo: no tumba la puerta web).
        timeout-minutes: 14
        shell: bash
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Lock::Timeout=60"
          for INTENTO in 1 2 3; do
            echo "apt · intento $INTENTO de 3"
            if sudo timeout 80 apt-get $APT update && sudo timeout 140 apt-get $APT install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              build-essential \
              libpipewire-0.3-dev \
              libspa-0.2-dev \
              libclang-dev \
              libxcb1-dev \
              libxrandr-dev \
              libdbus-1-dev \
              libegl-dev \
              libwayland-dev \
              libxdo-dev \
              file; then
              exit 0
            fi
            echo "::warning::apt falló o se quedó sin respuesta (intento $INTENTO de 3)"
            sudo dpkg --configure -a || true
            sleep $((INTENTO * 10))
          done
          echo "::error::No se pudieron instalar las dependencias de sistema de Tauri tras 3 intentos."
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri
      # Proyecto Tauri OFICIAL desde 2026-09-24: native/src-tauri (identifier
      # app.starseed.os). El root src-tauri/ quedó retirado (ver
      # .github/workflows/desktop-release.yml) y ya no se comprueba aquí.
      # Los iconos no viven en el repo: native-build.yml los genera antes de cada build
      # y `generate_context!` los necesita también para compilar. Sin este paso el check
      # moría con «failed to open icon …/icons/32x32.png» (2026-09-25).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Caché npm también aquí: el paso de iconos usa npx y así reutiliza
          # el almacén del job `verify` en vez de reinstalar (revisión X5c · pto. 3).
          cache: npm
      - name: Generar iconos (OS)
        working-directory: native/src-tauri
        run: npx --yes @tauri-apps/cli@latest icon "../icons-src/os.json"
      - name: Cargo check (native/src-tauri)
        run: cargo check --manifest-path native/src-tauri/Cargo.toml
