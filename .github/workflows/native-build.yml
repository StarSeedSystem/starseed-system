# ═══════════════════════════════════════════════════════════════════════════
# StarSeed Native — Build & Release (Tauri 2)
# ---------------------------------------------------------------------------
# Compila los TRES sistemas StarSeed (OS · Nexus · Café) como apps NATIVAS por
# sistema operativo y sube los instaladores a un GitHub Release, generando el
# `latest.json` que consume el updater incremental in-app.
#
# Dispara en:
#   · push de una etiqueta v*   (p.ej. v0.2.0)   → release
#   · ejecución manual (workflow_dispatch)        → elige qué sistema(s) construir
#
# El latest.json que consume el updater in-app SOLO lo sube el sistema OS
# (`includeUpdaterJson` condicionado a `matrix.system == 'os'`): antes los tres
# sistemas lo subían a la MISMA release y se pisaban entre sí. Nexus y Café
# tienen desde la 0.3.0 su propio canal (latest-nexus.json / latest-cafe.json),
# que genera el job `canales-updater` a partir de sus .sig reales.
#
# Produce por SO:
#   · macOS   → .dmg + .app  (+ .app.tar.gz para el updater)
#   · Windows → .msi + .exe (NSIS)  (+ .zip/.sig para el updater)
#   · Linux   → .deb + .AppImage + .rpm  (+ .sig para el updater)
#   · Android → .apk / .aab   (job separado, comentado abajo)
#
# SERVIDOR LOCAL (APP1107A, 2026-11-07): la app de escritorio de StarSeed OS lleva DENTRO el build
# `standalone` de Next y un Node oficial verificado por SHA-256 (native/servidor-local/), y abre
# http://127.0.0.1:<puerto> en vez de la web publicada: funciona sin internet. Next se compila UNA
# vez (job `servidor-local-next`, Linux) y cada build de escritorio del OS le añade su Node. Si eso
# falla, el instalador sale igual SIN servidor local (abre la web publicada, como antes).
# Contrato: architecture/apps-autonomas-sin-internet.md.
#
# CAPAS DEL SERVIDOR (CAP1107A · T1, 2026-11-07): con ese mismo build, el job `servidor-capa` arma una
# CAPA (`servidor-capa-<build>.tar.gz` + su manifiesto FIRMADO con la clave del updater) y la adjunta al
# release; con la variable del repo SERVIDOR_CAPAS_CANAL=1 la publica además en el canal fijo
# (Release `servidor-local`, `latest-servidor.json`) que miran las apps instaladas: lo nuevo llega sin
# reinstalar. Lo mismo en cada publicación de la web: .github/workflows/servidor-capa.yml.
# SERVIDOR LOCAL EN ANDROID (AND1107A): el mismo servidor DENTRO de la APK de StarSeed OS (nodejs-mobile), detrás
# de un interruptor APAGADO por defecto (input `servidor_local_android` o variable del repo
# STARSEED_SERVIDOR_LOCAL_ANDROID=1). Sin él, el job de Android es exactamente el de antes. Contrato §9.1.
# CANAL DE PRUEBAS (ACT1108A, 2026-11-08): con el input `canal=pruebas`, StarSeed OS (escritorio y Android)
# sale como <oficial + 1 parche>-prueba.<n.º de ejecución> en la prerelease FIJA `canal-pruebas` (nunca
# «Latest»), con latest-prueba.json (updater, firmado) y latest-prueba-android.json (APK + sha256): las
# apps instaladas de pruebas se actualizan solas desde dentro. El canal oficial no cambia, salvo el
# versionCode de sus APK (semver × 1000) para que una oficial se instale encima de una de pruebas.
# Contrato: architecture/centro-versiones-1105.md §9.
# (INT1108C) En pruebas, Linux sale sin .rpm (RPM no admite el «-» de 0.5.1-prueba.N; .deb y .AppImage sí,
# y el updater de Linux usa el AppImage) y el sellado falla en alto si la versión no quedó escrita.
#
# Todo vive en `native/` del repo del OS. Como los tres sistemas comparten el
# mismo binario `starseed-native`, cada uno se construye con su `-c ...conf.json`
# y su icono, regenerando `native/src-tauri/icons/` antes de cada build.
#
# ── FIRMA (honestidad) ──────────────────────────────────────────────────────
# Los binarios SIN FIRMAR sirven para probar (macOS pedirá "clic derecho → Abrir";
# Windows mostrará SmartScreen). Para DISTRIBUIR sin fricción hay que añadir los
# secretos de firma (opcionales; el build funciona sin ellos):
#   · TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       → clave del UPDATER (genérala con `cargo tauri signer generate`). Firma
#         los artefactos de actualización; su clave PÚBLICA va en tauri.conf.json.
#   · APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
#     APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#       → firma Developer ID + NOTARIZACIÓN de Apple para el .dmg/.app.
#   · WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#       → code-signing de Windows (Authenticode) para el .exe/.msi.
# Sin estos secretos, los pasos de firma se omiten y se generan binarios de prueba.
# ═══════════════════════════════════════════════════════════════════════════

name: StarSeed Native · Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      systems:
        description: "Sistemas a construir (coma-separados): os,nexus,cafe"
        required: false
        default: "os,nexus,cafe"
      etiqueta:
        description: "Release donde subir (p. ej. v0.2.0). Vacío = native-<n.º de ejecución>"
        required: false
        default: ""
      plataformas:
        description: "Qué compilar (coma-separados): escritorio,android,ios"
        required: false
        default: "escritorio,android,ios"
      # (AND1107A) Interruptor APAGADO por defecto: solo para probar en un aparato real. También se
      # enciende con la variable del repo STARSEED_SERVIDOR_LOCAL_ANDROID=1 (p. ej. en las etiquetas).
      servidor_local_android:
        description: "(Pruebas · AND1107A) Meter el servidor local DENTRO de la APK de StarSeed OS (nodejs-mobile). Apagado = la APK de siempre"
        type: boolean
        required: false
        default: false
      # (ACT1108A) Canal. «oficial» = lo de siempre (borrador por etiqueta + latest.json). «pruebas» = la
      # prerelease FIJA `canal-pruebas` (nunca «Latest»), versión <oficial + 1 parche>-prueba.<n.º de
      # ejecución>, latest-prueba.json (escritorio, firmado) y latest-prueba-android.json (APK): las apps
      # instaladas de pruebas se actualizan solas desde dentro. Solo StarSeed OS, escritorio y Android.
      # Contrato: architecture/centro-versiones-1105.md §9.
      canal:
        description: "Canal: oficial (lo de siempre) · pruebas (prerelease fija canal-pruebas que las apps de pruebas instalan solas; solo StarSeed OS, escritorio y Android)"
        type: choice
        options:
          - oficial
          - pruebas
        required: false
        default: oficial

# Permiso para crear/actualizar el Release con los instaladores.
permissions:
  contents: write

# (ACT1108A) Dos pruebas a la vez se pisarían la prerelease `canal-pruebas`: van en fila. El canal
# oficial (y las etiquetas v*) no comparten grupo con nadie: nada cambia para ellos.
concurrency:
  group: ${{ inputs.canal == 'pruebas' && 'native-canal-pruebas' || format('native-build-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # CANAL DE PRUEBAS · plan (ACT1108A). Solo con `canal=pruebas`. Calcula la versión de esta prueba
  # (0.5.0 → 0.5.1-prueba.<n.º de ejecución>), su versionCode de Android (siempre mayor que la prueba
  # anterior y que el oficial de la base, y menor que el oficial siguiente) y la versión del MSI, y deja
  # lista la prerelease FIJA `canal-pruebas`: la crea si no existe, nunca «Latest», con la etiqueta en
  # este commit (no es una etiqueta v*: no dispara nada). Los manifiestos vivos (latest-prueba*.json) no
  # se tocan hasta que haya otros mejores. native/scripts/canal-pruebas.mjs
  # ═══════════════════════════════════════════════════════════════════════════
  canal-pruebas-plan:
    name: canal de pruebas · versión y prerelease
    if: github.event_name == 'workflow_dispatch' && inputs.canal == 'pruebas'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      base: ${{ steps.plan.outputs.base }}
      codigo: ${{ steps.plan.outputs.codigo }}
      wix: ${{ steps.plan.outputs.wix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versión de prueba y versionCode (siempre creciente)
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # El versionCode de la prueba anterior (si la hay): el de esta tiene que ser mayor.
          ANTERIOR=$(gh release download canal-pruebas -R "$GITHUB_REPOSITORY" -p latest-prueba-android.json -O - 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).versionCode||""))}catch{}})' || true)
          echo "versionCode anterior: ${ANTERIOR:-ninguno}"
          node native/scripts/canal-pruebas.mjs plan --conf native/src-tauri/tauri.conf.json --ejecucion "$GITHUB_RUN_NUMBER" ${ANTERIOR:+--anterior "$ANTERIOR"} | tee -a "$GITHUB_OUTPUT"
      - name: Notas de esta prueba
        shell: bash
        run: |
          {
            echo "Canal de pruebas · ${{ steps.plan.outputs.version }}"
            echo ""
            echo "Commit ${GITHUB_SHA::7} · ${GITHUB_REF_NAME} · ejecución ${GITHUB_RUN_NUMBER}."
            echo ""
            echo "Últimos cambios:"
            git log -8 --format='- %s'
          } > notas-prueba.md
          cat notas-prueba.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: canal-pruebas-notas
          path: notas-prueba.md
          retention-days: 3
      - name: Prerelease fija «canal-pruebas» (nunca «Latest»)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "Canal de pruebas · ${{ steps.plan.outputs.version }}"
        run: |
          if gh release view canal-pruebas -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit canal-pruebas -R "$GITHUB_REPOSITORY" --prerelease --latest=false --draft=false --title "$TITULO" --notes-file notas-prueba.md
            # La etiqueta sigue al commit que se prueba.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/canal-pruebas" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create canal-pruebas -R "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" --title "$TITULO" --notes-file notas-prueba.md
          fi
          # El latest.json que deja tauri-action es un intermedio (se convierte en latest-prueba.json al
          # final): cada prueba empieza sin él, para no heredar plataformas de una prueba anterior.
          gh release delete-asset canal-pruebas latest.json -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          gh release view canal-pruebas -R "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,tagName

  # ═══════════════════════════════════════════════════════════════════════════
  # SERVIDOR LOCAL · next build una sola vez (APP1107A). Linux con 16 GB, como ci.yml. Con
  # STARSEED_APP_NATIVA=1 las imágenes no se optimizan (no hace falta sharp, que es nativo por
  # plataforma) y la caché de ISR no se escribe en disco (la app está en una carpeta de solo
  # lectura). Lo que sale (.next/standalone + .next/static + public) es JS puro: vale para macOS,
  # Windows y Linux; cada uno le pone su Node. `continue-on-error`: si falla, los instaladores
  # salen igual, sin servidor local.
  # ═══════════════════════════════════════════════════════════════════════════
  servidor-local-next:
    name: servidor local · next build (standalone)
    # (AND1107A) También cuando el interruptor de Android lo pide (su APK usa este mismo build).
    if: github.event_name != 'workflow_dispatch' || contains(inputs.plataformas, 'escritorio') || inputs.servidor_local_android
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    env:
      OPENUI_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Sin las variables públicas de Supabase del repo, la app local no sabría a qué cuenta
      # hablar: mejor ningún servidor local que uno con un Supabase de mentira.
      - name: Comprobar variables públicas del build
        env:
          URL_SUPABASE: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          ANON_SUPABASE: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL_SUPABASE" ] || [ -z "$ANON_SUPABASE" ]; then
            echo "::error::Faltan las variables del repo NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY: la app sale sin servidor local."
            exit 1
          fi
      - name: Instalar dependencias
        run: npm ci
      # (APP1107B · T8) La app no lleva lo que solo vive en la Mac de desarrollo: /api/mando/** (73
      # rutas del motor de la consola de MetaGenesis, −62,6 MB de .next/server; en 127.0.0.1 su puerta
      # `guardianMando` lo abriría sin sesión). /genesis, /metagenesis y /poligenesis SÍ van: se usan
      # desde cualquier neurona. Solo en este job: la web publicada y ci.yml no cambian. Si algo de
      # fuera lo importara, no quita nada (aviso) y el build sigue como antes. native/servidor-local/solo-mac.mjs
      - name: Quitar del build nativo lo que solo vive en la Mac
        run: node native/servidor-local/solo-mac.mjs
      - name: next build (standalone, para la app)
        run: npm run prebuild && npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_TELEMETRY_DISABLED: "1"
          STARSEED_APP_NATIVA: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # (TAM1107A · T13) Los *_client-reference-manifest.js sin repeticiones dentro de cada archivo (≈ 192 → 20 MB;
      # Next los lee igual). Aquí, para que el tar, los instaladores y las capas salgan ya ligeros; preparar.mjs lo
      # repite (si ya está hecho no gana nada). Si falla, el build sigue con los de Next. compactar-manifiestos.mjs
      - name: Compactar los manifiestos de cliente (T13)
        continue-on-error: true
        run: node native/servidor-local/compactar-manifiestos.mjs .next/standalone/.next/server | tee -a "$GITHUB_STEP_SUMMARY"
      # Un .tar (y no la carpeta): upload-artifact v4 deja fuera lo que empieza por «.» y aquí
      # TODO cuelga de `.next`.
      - name: Empaquetar standalone + static + public
        run: |
          test -f .next/standalone/server.js
          rm -f .next/standalone/.env .next/standalone/.env.*
          tar -cf servidor-next.tar .next/standalone .next/static public
          du -sh .next/standalone .next/static public servidor-next.tar
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-local-next
          path: servidor-next.tar
          retention-days: 3

  build-desktop:
    name: ${{ matrix.system }} · ${{ matrix.platform }}
    # Espera al build de Next (lo necesita el OS), pero corre aunque ese job falle.
    # (ACT1108A) En el canal de pruebas, además, solo si su plan salió bien.
    needs: [servidor-local-next, canal-pruebas-plan]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || contains(inputs.plataformas, 'escritorio')) && (inputs.canal != 'pruebas' || needs.canal-pruebas-plan.result == 'success') }}
    strategy:
      # No cancelar el resto de la matriz si un target falla.
      fail-fast: false
      matrix:
        # 3 sistemas × 3 plataformas = 9 jobs. El `include` añade `args` a cada
        # combinación según su plataforma (patrón estándar de tauri-action).
        # (ACT1108A) El canal de pruebas solo construye StarSeed OS.
        system: ${{ fromJSON(inputs.canal == 'pruebas' && '["os"]' || '["os","nexus","cafe"]') }}
        platform: [macos-latest, ubuntu-24.04, windows-latest]
        include:
          # macOS → binario universal (Apple Silicon + Intel).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Linux → .deb, .AppImage y .rpm. (06-11, LZ040A) En 24.04, como el «Tauri · cargo check» del CI:
          # las cabeceras de PipeWire de 22.04 (0.3.48) son viejas para libspa/pipewire-rs de xcap 0.9 y
          # v0.4.0 falló («cannot find function spa_meta_region_is_valid»). Precio: los binarios de Linux
          # piden glibc ≥ 2.39 (Ubuntu 24.04, Debian 13, Fedora 40 o más nuevos).
          - platform: ubuntu-24.04
            args: ""
          # Windows → .msi y .exe (NSIS).
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ── Toolchains ──
      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Objetivos extra de macOS para la matriz aarch64/x86_64.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "native/src-tauri -> target"

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Dependencias de sistema de Tauri en Linux ──
      - name: Dependencias de Linux (Tauri)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libegl-dev \
            libwayland-dev \
            libxdo-dev \
            libgbm-dev \
            libfuse2t64 \
            file

      # ── Iconos del sistema que toca (regenera native/src-tauri/icons/) ──
      - name: Generar iconos para «${{ matrix.system }}»
        working-directory: native/src-tauri
        run: npx --yes @tauri-apps/cli@latest icon "../icons-src/${{ matrix.system }}.json"

      # ── Selección del fichero de config por sistema ──
      #   OS   → tauri.conf.json (base, sin -c)
      #   otros → -c tauri.<sistema>.conf.json
      - name: Resolver flag de config
        id: cfg
        shell: bash
        run: |
          if [ "${{ matrix.system }}" = "os" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.system }}" = "cafe" ] && [ "${{ runner.os }}" = "Linux" ]; then
            # (LZ042A) El .rpm solo admite ASCII en el nombre del paquete («star-seed-café» falla): en Linux,
            # Café se compila como «StarSeed Cafe». Mismo identificador (sus datos no cambian) y mismos nombres
            # de archivo que v0.3.0 («StarSeed.Cafe_…»).
            python3 -c 'import json; r="native/src-tauri/tauri.cafe.conf.json"; d=json.load(open(r, encoding="utf-8")); d["productName"]="StarSeed Cafe"; json.dump(d, open("native/src-tauri/tauri.cafe-linux.conf.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)'
            echo "flag=-c src-tauri/tauri.cafe-linux.conf.json" >> "$GITHUB_OUTPUT"
          else
            # tauri-action corre desde `native/`; los overrides viven en src-tauri/.
            echo "flag=-c src-tauri/tauri.${{ matrix.system }}.conf.json" >> "$GITHUB_OUTPUT"
          fi
          # (INT1108C) Canal de pruebas en Linux: sin .rpm. RPM rechaza «0.5.1-prueba.N» (el «-» no vale en
          # su Version: run 42452615312); .deb y .AppImage la aceptan y el updater de Linux usa el AppImage.
          # El canal oficial sigue con los tres.
          if [ "${{ inputs.canal }}" = "pruebas" ] && [ "${{ runner.os }}" = "Linux" ]; then
            echo "bundles=--bundles deb,appimage" >> "$GITHUB_OUTPUT"
          fi

      # ── (ACT1108A) Canal de pruebas: la versión de esta prueba ──
      # 0.5.1-prueba.<n> en tauri.conf.json y Cargo.toml, el MSI como 0.5.1.<n> (WiX solo admite números)
      # y el updater mirando primero latest-prueba.json y después el oficial. Mismo identificador
      # (app.starseed.os): misma carpeta de datos, se instala encima. Antes del servidor local, que
      # reescribe tauri.conf.json conservando lo demás.
      - name: Canal de pruebas · sellar la versión
        if: inputs.canal == 'pruebas'
        shell: bash
        run: |
          node native/scripts/canal-pruebas.mjs sellar --conf native/src-tauri/tauri.conf.json --cargo native/src-tauri/Cargo.toml \
            --version "${{ needs.canal-pruebas-plan.outputs.version }}" --codigo "${{ needs.canal-pruebas-plan.outputs.codigo }}" \
            --wix "${{ needs.canal-pruebas-plan.outputs.wix }}"
          # (INT1108C) Falla en alto si no quedó sellada (en Windows el script salía sin hacer nada y los
          # instaladores de pruebas se llamaban 0.5.0: run 42452615312).
          SELLADA=$(node -p "require('./native/src-tauri/tauri.conf.json').version")
          if [ "$SELLADA" != "${{ needs.canal-pruebas-plan.outputs.version }}" ]; then
            echo "::error::tauri.conf.json dice «$SELLADA» y el plan «${{ needs.canal-pruebas-plan.outputs.version }}»: la versión de pruebas no se selló."
            exit 1
          fi

      # ── Servidor local dentro de la app (solo StarSeed OS · APP1107A) ──
      # Descarga el build de Next del job `servidor-local-next`, baja el Node oficial de nodejs.org
      # (versión y SHA-256 fijados en native/servidor-local/node.json; en macOS arm64 + x64 unidos
      # con lipo y firmados ad-hoc) y añade resources + externalBin a tauri.conf.json. Cualquier
      # fallo: el instalador sale igual, sin servidor local, y el paso siguiente lo avisa.
      - name: Servidor local · descargar el build de Next
        id: servidor_next
        if: matrix.system == 'os'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: servidor-local-next
          path: .servidor-local
      - name: Servidor local · armar (Node oficial verificado + standalone)
        id: servidor
        if: matrix.system == 'os' && steps.servidor_next.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) PLAT=darwin-universal ;;
            Windows) PLAT=win32-x64 ;;
            *) PLAT=linux-x64 ;;
          esac
          node native/servidor-local/preparar.mjs --tar .servidor-local/servidor-next.tar --plataforma "$PLAT" --conf native/src-tauri/tauri.conf.json
      - name: Servidor local · aviso si este instalador no lo lleva
        if: matrix.system == 'os' && steps.servidor.outputs.servidor_local != 'si'
        shell: bash
        run: |
          echo "::warning::Este instalador de StarSeed OS sale SIN servidor local: abrirá la web publicada (necesita internet), como antes. Mira los pasos «Servidor local» de este job y el job servidor-local-next."

      # ── Build + Release con la acción oficial de Tauri ──
      # (CI1108N) GitHub y los CDN de herramientas dan 5xx/timeouts sueltos (run 42465968141: el bundler no pudo
      # bajar linuxdeploy/WiX/NSIS: «failed to bundle project: http status: 504»). Reintento: UN segundo intento,
      # idéntico, tras una pausa. Lo ya compilado está en caché (target/) y las herramientas ya bajadas en la
      # caché del bundler, así que el segundo intento es corto. Un error real de compilación falla igual en el
      # segundo intento y el job sale en rojo. SUBIDA: tauri-action solo sube DESPUÉS de empaquetar, así que un
      # fallo de bundle no sube nada; si el fallo llegara a ocurrir durante la subida, el segundo intento reutiliza
      # el mismo Release (por tagName) y reemplaza los assets del mismo nombre: sin duplicados ni Release nuevo.
      # OJO: el paso «(reintento)» de abajo debe ser idéntico a este; lo comprueba canal-pruebas-flujo.test.ts.
      - name: Build (tauri-action) y subir al Release
        id: tauri1
        # (CI1108N) Un fallo se reintenta UNA vez en el paso siguiente; si el segundo también falla, el job sale
        # en rojo con el error de ese segundo intento (no se esconde nada).
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma del UPDATER (opcional): si están, firma los artefactos de update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── Firma + notarización de Apple (macOS) ──────────────────────────────
          # IMPORTANTE: si defines APPLE_CERTIFICATE (aunque sea VACÍO), tauri-action
          # intenta `security import` y FALLA el bundle en macOS. Por eso NO pasamos
          # estas variables mientras no haya certificado real. Cuando el dueño tenga
          # su Apple Developer ID, añade aquí (con los secretos correspondientes):
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # y macOS saldrá firmado + notarizado. Sin ellas, el .dmg/.app sale sin
          # firmar (funciona; macOS pedirá clic derecho → Abrir la primera vez).
          #
          # Code-signing de Windows (opcional): tauri-action SÍ tolera el valor
          # vacío, así que lo dejamos referenciado (se activa al añadir el secreto).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # La raíz del proyecto Tauri (donde está src-tauri/).
          projectPath: native
          # Un Release por etiqueta; la acción sube los instaladores y el latest.json.
          # (ACT1108A) Canal de pruebas: la prerelease fija `canal-pruebas` (publicada, nunca «Latest»);
          # su latest.json es un intermedio que el job canal-pruebas-publicar convierte en latest-prueba.json.
          tagName: ${{ inputs.canal == 'pruebas' && 'canal-pruebas' || inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || format('native-{0}', github.run_number) }}
          releaseName: ${{ inputs.canal == 'pruebas' && format('Canal de pruebas · {0}', needs.canal-pruebas-plan.outputs.version) || format('StarSeed Native {0}', inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || github.run_number) }}
          releaseBody: ${{ inputs.canal == 'pruebas' && format('Canal de pruebas · {0} (StarSeed OS). Las apps instaladas de pruebas se actualizan solas desde latest-prueba.json (escritorio) y latest-prueba-android.json (Android).', needs.canal-pruebas-plan.outputs.version) || format('Instaladores nativos de StarSeed — versión {0} (OS · Nexus · Café), generados desde native/ por CI. Cada app de escritorio instalada se actualiza sola desde su canal{1} StarSeed OS con latest.json, Nexus con latest-nexus.json y Café con latest-cafe.json.', inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || format('native-{0}', github.run_number), ':') }}
          releaseDraft: ${{ inputs.canal != 'pruebas' }}
          prerelease: ${{ inputs.canal == 'pruebas' }}
          # SOLO el sistema OS sube/actualiza latest.json. Antes, los TRES
          # sistemas subían un latest.json a la MISMA release y se pisaban entre
          # sí (el latest.json de v0.1.0 llegó a apuntar Linux a StarSeed.Nexus).
          # Nexus y Café tienen su canal propio: lo escribe `canales-updater`.
          includeUpdaterJson: ${{ matrix.system == 'os' }}
          # Config extra por sistema + args de target de la matriz (+ en pruebas, Linux sin .rpm · INT1108C).
          args: ${{ steps.cfg.outputs.flag }} ${{ matrix.args }} ${{ steps.cfg.outputs.bundles }}

      - name: Reintento de red · aviso y pausa
        if: steps.tauri1.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::El build de tauri-action falló (¿red de GitHub?). Se reintenta una vez; si vuelve a fallar, el error real está en el paso «(reintento)»."
          sleep 60
      - name: Build (tauri-action) y subir al Release (reintento)
        if: steps.tauri1.outcome == 'failure'
        id: tauri2
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma del UPDATER (opcional): si están, firma los artefactos de update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── Firma + notarización de Apple (macOS) ──────────────────────────────
          # IMPORTANTE: si defines APPLE_CERTIFICATE (aunque sea VACÍO), tauri-action
          # intenta `security import` y FALLA el bundle en macOS. Por eso NO pasamos
          # estas variables mientras no haya certificado real. Cuando el dueño tenga
          # su Apple Developer ID, añade aquí (con los secretos correspondientes):
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # y macOS saldrá firmado + notarizado. Sin ellas, el .dmg/.app sale sin
          # firmar (funciona; macOS pedirá clic derecho → Abrir la primera vez).
          #
          # Code-signing de Windows (opcional): tauri-action SÍ tolera el valor
          # vacío, así que lo dejamos referenciado (se activa al añadir el secreto).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # La raíz del proyecto Tauri (donde está src-tauri/).
          projectPath: native
          # Un Release por etiqueta; la acción sube los instaladores y el latest.json.
          # (ACT1108A) Canal de pruebas: la prerelease fija `canal-pruebas` (publicada, nunca «Latest»);
          # su latest.json es un intermedio que el job canal-pruebas-publicar convierte en latest-prueba.json.
          tagName: ${{ inputs.canal == 'pruebas' && 'canal-pruebas' || inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || format('native-{0}', github.run_number) }}
          releaseName: ${{ inputs.canal == 'pruebas' && format('Canal de pruebas · {0}', needs.canal-pruebas-plan.outputs.version) || format('StarSeed Native {0}', inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || github.run_number) }}
          releaseBody: ${{ inputs.canal == 'pruebas' && format('Canal de pruebas · {0} (StarSeed OS). Las apps instaladas de pruebas se actualizan solas desde latest-prueba.json (escritorio) y latest-prueba-android.json (Android).', needs.canal-pruebas-plan.outputs.version) || format('Instaladores nativos de StarSeed — versión {0} (OS · Nexus · Café), generados desde native/ por CI. Cada app de escritorio instalada se actualiza sola desde su canal{1} StarSeed OS con latest.json, Nexus con latest-nexus.json y Café con latest-cafe.json.', inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || format('native-{0}', github.run_number), ':') }}
          releaseDraft: ${{ inputs.canal != 'pruebas' }}
          prerelease: ${{ inputs.canal == 'pruebas' }}
          # SOLO el sistema OS sube/actualiza latest.json. Antes, los TRES
          # sistemas subían un latest.json a la MISMA release y se pisaban entre
          # sí (el latest.json de v0.1.0 llegó a apuntar Linux a StarSeed.Nexus).
          # Nexus y Café tienen su canal propio: lo escribe `canales-updater`.
          includeUpdaterJson: ${{ matrix.system == 'os' }}
          # Config extra por sistema + args de target de la matriz (+ en pruebas, Linux sin .rpm · INT1108C).
          args: ${{ steps.cfg.outputs.flag }} ${{ matrix.args }} ${{ steps.cfg.outputs.bundles }}

      # Tamaño real de cada instalador en el resumen del job (contrato APP1107A §tamaños).
      - name: Tamaños de los instaladores
        if: always()
        shell: bash
        run: |
          {
            echo "### Instaladores · ${{ matrix.system }} · ${{ runner.os }} · servidor local: ${{ steps.servidor.outputs.servidor_local || 'no' }}"
            echo ""
            echo "| Archivo | Tamaño |"
            echo "|---|---:|"
            find native/src-tauri/target -path '*/bundle/*' -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) 2>/dev/null | while read -r f; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # CAPA DEL SERVIDOR LOCAL (CAP1107A · T1). El mismo build de Next que llevan los instaladores, como
  # capa firmada: se adjunta al release (borrador) y, con vars.SERVIDOR_CAPAS_CANAL == '1', va también
  # al canal fijo `servidor-local` que miran las apps ya instaladas (≥ APP_MINIMA de capa.mjs). Espera a
  # los instaladores (el release ya existe) y no los frena: `continue-on-error`. Sin el secreto
  # TAURI_SIGNING_PRIVATE_KEY no firma ni publica nada. native/servidor-local/publicar-capa.sh
  # ═══════════════════════════════════════════════════════════════════════════
  servidor-capa:
    name: servidor local · capa firmada (sin reinstalar)
    needs: [servidor-local-next, build-desktop]
    # (ACT1108A) No en el canal de pruebas: su capa iría al canal fijo `servidor-local` de las apps oficiales.
    if: ${{ !cancelled() && needs.servidor-local-next.result == 'success' && inputs.canal != 'pruebas' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Descargar el build de Next
        uses: actions/download-artifact@v4
        with:
          name: servidor-local-next
          path: .servidor-local
      - name: Armar, firmar y publicar la capa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLICAR_CANAL: ${{ vars.SERVIDOR_CAPAS_CANAL }}
        run: bash native/servidor-local/publicar-capa.sh .servidor-local/servidor-next.tar "${{ inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || format('native-{0}', github.run_number) }}"

  # ═══════════════════════════════════════════════════════════════════════════
  # CANALES DE ACTUALIZACIÓN por sistema (2026-10-09). tauri-action solo sabe
  # escribir `latest.json` (el del OS); este job crea `latest-nexus.json` y
  # `latest-cafe.json` en el mismo Release con las URLs y firmas (.sig) reales de
  # Nexus y Café, para que cada app instalada se actualice con SU instalador (ver
  # native/scripts/canales-updater.mjs). Corre aunque algún build haya fallado:
  # entonces el script dice qué plataforma falta y sale en rojo.
  # ═══════════════════════════════════════════════════════════════════════════
  canales-updater:
    name: canales de actualización (nexus · cafe)
    needs: build-desktop
    # (ACT1108A) El canal de pruebas solo construye StarSeed OS: sin Nexus ni Café que publicar.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || contains(inputs.plataformas, 'escritorio')) && inputs.canal != 'pruebas' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar y subir latest-nexus.json y latest-cafe.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || format('native-{0}', github.run_number) }}
        run: node native/scripts/canales-updater.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  # ANDROID (.apk sideload) — APK firmado con un keystore self-signed (gratis).
  # Instalable directamente desde el archivo con "orígenes desconocidos" activado.
  # NO es Play Store; no requiere cuenta de pago. Secretos: ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
  # ═══════════════════════════════════════════════════════════════════════════
  build-android:
    name: ${{ matrix.system }} · android
    # (ACT1108A) En el canal de pruebas, solo StarSeed OS y solo si su plan salió bien.
    needs: canal-pruebas-plan
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || contains(inputs.plataformas, 'android')) && (inputs.canal != 'pruebas' || needs.canal-pruebas-plan.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.canal == 'pruebas' && '["os"]' || '["os","nexus","cafe"]') }}
    runs-on: ubuntu-22.04
    # (AND1107A) `actions: read` solo para esperar el artefacto `servidor-local-next` cuando el
    # interruptor del servidor local está encendido; `contents: write` es el de siempre (Release).
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Rust + targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK/NDK
        uses: android-actions/setup-android@v3
        # (2026-09-25) Por defecto instala «tools platform-tools», y el paquete «tools»
        # ya no existe en el repositorio del SDK: sdkmanager salía con código 1 y los tres
        # APK morían en este paso. Solo hace falta platform-tools.
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar NDK + plataformas
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
      - name: Localizar NDK y exportar NDK_HOME
        shell: bash
        run: |
          # Preferimos el NDK 27 que instalamos (recomendado por Tauri 2 y
          # determinista); el runner trae preinstalados NDKs más nuevos (29)
          # que `sort -V | tail -1` elegía y no están probados con cargo-mobile2.
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          [ -d "$NDK_DIR" ] || NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          echo "NDK encontrado: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Resolver flag de config
        id: cfg
        shell: bash
        run: |
          if [ "${{ matrix.system }}" = "os" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=-c src-tauri/tauri.${{ matrix.system }}.conf.json" >> "$GITHUB_OUTPUT"
          fi
      # (ACT1108A) versionName y versionCode. Android solo instala ENCIMA un versionCode mayor o igual:
      #   · pruebas → 0.5.1-prueba.<n> con el versionCode del plan (5 000 001…5 000 999 para la base 0.5.1:
      #     mayor que el oficial 0.5.0 —5000 hasta hoy— y que la prueba anterior);
      #   · oficial → la versión de siempre y versionCode = semver × 1000 (0.5.1 → 5 001 000), por encima
      #     de todas las pruebas de esa base: la oficial se instala encima de una de pruebas SIN perder datos.
      # Mismo keystore (secretos ANDROID_*) en los dos canales: misma firma, mismos datos.
      - name: Versión y versionCode (canal ${{ inputs.canal || 'oficial' }})
        shell: bash
        run: |
          if [ "${{ inputs.canal }}" = "pruebas" ]; then
            node native/scripts/canal-pruebas.mjs sellar --conf native/src-tauri/tauri.conf.json --cargo native/src-tauri/Cargo.toml \
              --version "${{ needs.canal-pruebas-plan.outputs.version }}" --codigo "${{ needs.canal-pruebas-plan.outputs.codigo }}"
          else
            node native/scripts/canal-pruebas.mjs sellar --conf native/src-tauri/tauri.conf.json --oficial
          fi
      # Versión REAL desde tauri.conf.json (nunca hardcodeada): nexus/cafe no
      # sobreescriben "version" en su tauri.<sistema>.conf.json, así que
      # heredan la del base — la misma lectura vale para los tres sistemas.
      - name: Leer versión (tauri.conf.json)
        id: ver
        working-directory: native/src-tauri
        shell: bash
        run: echo "version=$(node -p "require('./tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Inicializar Android
        working-directory: native
        run: cargo tauri android init ${{ steps.cfg.outputs.flag }}
      # (2026-09-25) Los iconos van DESPUÉS de `android init`: `tauri icon` escribe los de
      # Android dentro de gen/android, y antes de init esa carpeta no existe. Por eso los APK
      # de v0.2.0 salieron con el icono por defecto de Tauri en vez del logo de StarSeed.
      - name: Iconos (${{ matrix.system }})
        working-directory: native/src-tauri
        run: npx --yes @tauri-apps/cli@latest icon "../icons-src/${{ matrix.system }}.json"
      # ── (AND1107A) Servidor local DENTRO de la APK (nodejs-mobile) · interruptor APAGADO por defecto ──
      # Solo StarSeed OS y solo con el input `servidor_local_android` o la variable del repo
      # STARSEED_SERVIDOR_LOCAL_ANDROID=1. Sin él, ninguno de estos pasos corre y la APK sale exactamente
      # como antes. Encendido: espera el build de Next del job `servidor-local-next` (el mismo que
      # escritorio), baja nodejs-mobile y lo verifica por SHA-256 (native/servidor-local/nodejs-mobile.json)
      # y prepara el proyecto Android (preparar-android.mjs). Si algo falla, el script lo deshace todo y la
      # APK sale como siempre (sin servidor local); un aviso lo dice. Contrato:
      # architecture/apps-autonomas-sin-internet.md §9.1.
      - name: Servidor local Android · interruptor
        id: sl_android
        if: matrix.system == 'os' && (inputs.servidor_local_android == true || vars.STARSEED_SERVIDOR_LOCAL_ANDROID == '1')
        shell: bash
        run: echo "encendido=si" >> "$GITHUB_OUTPUT"
      - name: Servidor local Android · esperar el build de Next
        id: sl_android_espera
        if: steps.sl_android.outputs.encendido == 'si'
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUTA="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          hay() { [ "$(gh api "$RUTA/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "servidor-local-next")] | length')" -gt 0 ]; }
          for i in $(seq 1 110); do
            if hay; then echo "build de Next listo"; exit 0; fi
            E=$(gh api "$RUTA/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("servidor local · next build"))][0] | (.status // "") + ":" + (.conclusion // "")')
            case "$E" in
              completed:*) sleep 5; hay && exit 0; echo "::warning::El job servidor-local-next terminó ($E) sin artefacto."; exit 1 ;;
              ":") echo "::warning::Este run no tiene job servidor-local-next."; exit 1 ;;
            esac
            sleep 30
          done
          echo "::warning::El build de Next no llegó a tiempo."; exit 1
      - name: Servidor local Android · descargar el build de Next
        id: sl_android_next
        if: steps.sl_android_espera.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: servidor-local-next
          path: .servidor-local
      - name: Servidor local Android · armar (nodejs-mobile verificado + standalone)
        id: sl_android_armado
        if: steps.sl_android_next.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node native/servidor-local/preparar-android.mjs --tar .servidor-local/servidor-next.tar \
            --proyecto native/src-tauri/gen/android --conf native/src-tauri/tauri.android.conf.json
          # build.rs compila el código Rust del servidor local solo con esto (y comprueba el proyecto).
          echo "STARSEED_SERVIDOR_LOCAL_ANDROID=1" >> "$GITHUB_ENV"
      - name: Servidor local Android · aviso si esta APK no lo lleva
        if: steps.sl_android.outputs.encendido == 'si' && steps.sl_android_armado.outcome != 'success'
        shell: bash
        run: echo "::warning::El interruptor del servidor local de Android estaba encendido, pero esta APK sale SIN él (abre la web publicada, como siempre). Mira los pasos «Servidor local Android» de este job."
      # (CI1108N) Gradle por red inestable (run 42465968141: «Downloading …gradle-9.6.1-bin.zip failed: timeout
      # (10000ms)» y luego «HTTP response code: 504»). 1) networkTimeout del wrapper de 10 s a 120 s; 2) la
      # distribución se baja ANTES con curl y reintentos, y el wrapper la toma de un file:// (si curl no
      # lo logra, se deja la URL original: el wrapper lo intenta él con el timeout mayor). gen/android lo genera
      # `tauri android init` en cada ejecución (no está en git): se parchea aquí, después de init.
      - name: Gradle · más paciencia con la red
        shell: bash
        run: |
          P=native/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f "$P" ]; then echo "::warning::No hay $P: se sigue sin tocar el wrapper de Gradle."; exit 0; fi
          if grep -q '^networkTimeout=' "$P"; then sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$P"; else echo "networkTimeout=120000" >> "$P"; fi
          URL=$(sed -n 's/^distributionUrl=//p' "$P" | tr -d '\\')
          echo "Distribución de Gradle: $URL"
          ZIP="$RUNNER_TEMP/gradle-dist.zip"
          if curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 300 -o "$ZIP" "$URL" && unzip -tq "$ZIP" >/dev/null; then
            grep -v '^distributionUrl=' "$P" > "$P.tmp"
            printf 'distributionUrl=file\\://%s\n' "$ZIP" >> "$P.tmp"
            mv "$P.tmp" "$P"
            echo "Gradle precargado en $ZIP"
          else
            rm -f "$ZIP" "$P.tmp"
            echo "::warning::No se pudo precargar Gradle; el wrapper lo bajará él (networkTimeout 120 s)."
          fi
          grep -E '^(distributionUrl|networkTimeout)=' "$P"
      # (CI1108N) Se reintenta UNA vez SOLO si el log del primer intento trae firma de red (timeout, 5xx,
      # «Could not resolve/GET», reset de conexión). Un error de compilación (Rust, Kotlin, manifiesto…) no
      # coincide y falla a la primera, con su log intacto.
      - name: Build APK (release)
        working-directory: native
        shell: bash
        env:
          FLAG: ${{ steps.cfg.outputs.flag }}
        run: |
          LOG="$RUNNER_TEMP/apk-build.log"
          FIRMA='failed: timeout|timed out|Could not (resolve|GET|HEAD|download)|Connection reset|Connection refused|Remote host terminated|Premature end of Content-Length|Unable to tunnel|Temporary failure in name resolution|HTTP response code: 5[0-9][0-9]|status code: 5[0-9][0-9]|HTTP/[12.]+ 5[0-9][0-9]|http status: 5[0-9][0-9]'
          for INTENTO in 1 2; do
            set +e
            # shellcheck disable=SC2086
            cargo tauri android build --apk $FLAG 2>&1 | tee "$LOG"
            RC=${PIPESTATUS[0]}
            set -e
            [ "$RC" -eq 0 ] && exit 0
            if [ "$INTENTO" -eq 1 ] && grep -Eqi "$FIRMA" "$LOG"; then
              echo "::warning::El build del APK falló con firma de red (intento 1/2). Se reintenta tras una pausa."
              grep -Ei "$FIRMA" "$LOG" | head -3
              sleep 45
              continue
            fi
            exit "$RC"
          done
      - name: Firmar APK con keystore self-signed
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/ks.jks
          APK=$(find native -path '*outputs/apk/*' -name '*release*unsigned*.apk' | head -1)
          [ -z "$APK" ] && APK=$(find native -path '*outputs/apk/*' -name '*release*.apk' | head -1)
          echo "APK sin firmar: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT="StarSeed-${{ matrix.system }}-${VERSION}.apk"
          "$BT/zipalign" -f 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/ks.jks \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out "$OUT" /tmp/aligned.apk
          "$BT/apksigner" verify "$OUT" && echo "APK firmado OK: $OUT"
          # (ACT1108A) La huella del certificado (pública): la MISMA en pruebas y en oficial = Android instala
          # una encima de otra conservando los datos. Si cambia, Android se niega a instalar encima.
          echo "### APK ${{ matrix.system }} · ${VERSION} · firma: $("$BT/apksigner" verify --print-certs "$OUT" | grep -m1 -i 'SHA-256 digest' | sed 's/.*: //')" >> "$GITHUB_STEP_SUMMARY"
      # (AND1107A) Solo con el interruptor: el tamaño REAL de la APK firmada y su desglose.
      - name: Servidor local Android · tamaño de la APK
        if: always() && steps.sl_android.outputs.encendido == 'si'
        shell: bash
        run: |
          F="StarSeed-${{ matrix.system }}-${{ steps.ver.outputs.version }}.apk"
          {
            echo "### APK · ${{ matrix.system }} · servidor local dentro: ${{ steps.sl_android_armado.outcome == 'success' && 'sí' || 'no' }}"
            echo ""
            if [ -f "$F" ]; then
              echo "**$F: $(du -h "$F" | cut -f1) ($(stat -c %s "$F") bytes)**"
              echo ""
              echo '```'
              unzip -v "$F" | grep -E ' lib/|assets/servidor-local/' | awk '{printf "%12s %12s  %s\n", $1, $3, $8}'
              echo '```'
            else
              echo "No hay APK firmada."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Subir APK al Release
        if: inputs.canal != 'pruebas'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || format('native-{0}', github.run_number) }}
          draft: true
          files: StarSeed-${{ matrix.system }}-${{ steps.ver.outputs.version }}.apk
      # (ACT1108A) Canal de pruebas: el APK a la prerelease fija y DESPUÉS su manifiesto (versión,
      # versionCode, url, sha256, notas), así el manifiesto nunca apunta a un APK que aún no está.
      - name: Canal de pruebas · notas
        if: inputs.canal == 'pruebas'
        uses: actions/download-artifact@v4
        with:
          name: canal-pruebas-notas
      - name: Canal de pruebas · subir el APK y latest-prueba-android.json
        if: inputs.canal == 'pruebas'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APK="StarSeed-${{ matrix.system }}-${VERSION}.apk"
          node native/scripts/canal-pruebas.mjs android --apk "$APK" --version "$VERSION" \
            --codigo "${{ needs.canal-pruebas-plan.outputs.codigo }}" --repo "$GITHUB_REPOSITORY" \
            --notas-archivo notas-prueba.md --salida latest-prueba-android.json | tee -a "$GITHUB_STEP_SUMMARY"
          gh release upload canal-pruebas "$APK" -R "$GITHUB_REPOSITORY" --clobber
          gh release upload canal-pruebas latest-prueba-android.json -R "$GITHUB_REPOSITORY" --clobber

  # ═══════════════════════════════════════════════════════════════════════════
  # iOS (.ipa sin firmar) — HONESTIDAD: iOS NO permite instalar un .ipa desde el
  # archivo directamente como Android. Este .ipa SIN FIRMAR está pensado para
  # re-firmarlo con AltStore/Sideloadly usando TU Apple ID gratuita (renueva cada
  # 7 días) en tu ordenador. Con una cuenta Apple Developer de pago se podría
  # firmar aquí y distribuir ad-hoc. Job "best-effort": si xcodebuild sin firma
  # falla, no bloquea el resto del release.
  # ═══════════════════════════════════════════════════════════════════════════
  build-ios:
    name: ${{ matrix.system }} · ios
    # (ACT1108A) El canal de pruebas no construye iOS (un .ipa sin firmar no se actualiza solo).
    if: (github.event_name != 'workflow_dispatch' || contains(inputs.plataformas, 'ios')) && inputs.canal != 'pruebas'
    strategy:
      fail-fast: false
      matrix:
        system: [os, nexus, cafe]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Rust + targets iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Resolver flag de config
        id: cfg
        shell: bash
        run: |
          if [ "${{ matrix.system }}" = "os" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=-c src-tauri/tauri.${{ matrix.system }}.conf.json" >> "$GITHUB_OUTPUT"
          fi
      # Versión REAL desde tauri.conf.json (nunca hardcodeada); ver el mismo
      # paso en el job build-android para por qué vale para los tres sistemas.
      - name: Leer versión (tauri.conf.json)
        id: ver
        working-directory: native/src-tauri
        shell: bash
        run: echo "version=$(node -p "require('./tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Inicializar iOS
        working-directory: native
        run: cargo tauri ios init ${{ steps.cfg.outputs.flag }}
      # Igual que en Android: los iconos de iOS se escriben dentro de gen/apple tras `ios init`.
      - name: Iconos (${{ matrix.system }})
        working-directory: native/src-tauri
        run: npx --yes @tauri-apps/cli@latest icon "../icons-src/${{ matrix.system }}.json"
      - name: Compilar .app sin firma y empaquetar .ipa
        working-directory: native
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -x
          PROJ=$(find src-tauri/gen/apple -name '*.xcodeproj' -maxdepth 2 | head -1)
          echo "Proyecto: $PROJ"
          SCHEME=$(xcodebuild -project "$PROJ" -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{gsub(/^ +/,"");print;exit}')
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO || true
          APP=$(find build -name '*.app' -path '*iphoneos*' | head -1)
          echo "App: $APP"
          # (2026-09-25) xcodebuild puede fallar (|| true) y dejar un .app sin ejecutable:
          # v0.2.0 subió .ipa de 348 bytes. Solo vale si el binario de la app existe.
          EXE=""
          [ -n "$APP" ] && EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null || true)
          if [ -n "$APP" ] && [ -n "$EXE" ] && [ -s "$APP/$EXE" ]; then
            rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
            zip -qr "StarSeed-${{ matrix.system }}-${VERSION}-unsigned.ipa" Payload
            echo "IPA generado."
          else
            echo "No se generó una .app con ejecutable (iOS sin firma es limitado); se omite el IPA."
          fi
      - name: Subir IPA al Release (si se generó)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name) || format('native-{0}', github.run_number) }}
          draft: true
          files: native/StarSeed-${{ matrix.system }}-${{ steps.ver.outputs.version }}-unsigned.ipa

  # ═══════════════════════════════════════════════════════════════════════════
  # CANAL DE PRUEBAS · publicar (ACT1108A). Al final de una prueba: el latest.json que dejó tauri-action
  # (firmado con la clave del updater) pasa a `latest-prueba.json` con las notas de la prueba; se
  # comprueba que `latest-prueba-android.json` es de esta versión; y se quita de la prerelease todo lo que
  # ya no apunta ningún manifiesto vigente (así solo queda la última prueba que funciona, aunque una
  # plataforma falle). Si una plataforma falló, su manifiesto sigue en la prueba anterior.
  # native/scripts/canal-pruebas.mjs publicar
  # ═══════════════════════════════════════════════════════════════════════════
  canal-pruebas-publicar:
    name: canal de pruebas · latest-prueba.json y limpieza
    needs: [canal-pruebas-plan, build-desktop, build-android]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.canal == 'pruebas' && needs.canal-pruebas-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: canal-pruebas-notas
      - name: Publicar latest-prueba.json y quitar lo de pruebas anteriores
        # bash explícito = pipefail: si el script falla, el paso sale en rojo aunque pase por tee.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.canal-pruebas-plan.outputs.version }}
          ESCRITORIO: ${{ needs.build-desktop.result }}
          ANDROID: ${{ needs.build-android.result }}
        run: node native/scripts/canal-pruebas.mjs publicar --notas-archivo notas-prueba.md | tee -a "$GITHUB_STEP_SUMMARY"
