# Medio «nube-gh»: el enjambre económico de StarSeed OS en GitHub Actions (2026-09-21).
#
# Alex: «se puede más con más medios… algún servicio gratuito para alojar más agentes».
# Este repositorio es PÚBLICO, así que los runners hospedados son gratuitos y sin tope
# de minutos: cada job es una máquina de 4 vCPU / 16 GB durante hasta 6 h, y caben
# varios jobs a la vez (uno por cola-nube). Hugging Face ya no sirve: hospedar un
# Space Docker en CPU gratuita exige suscripción PRO (comprobado: HTTP 402).
#
# Cómo se usa (desde la Mac): `python3 scripts/puente/nube-gh.py lanzar --tope 6`
# reparte tareas a `enjambre/colas/cola-nube-<fecha>.json`, la publica y dispara
# este workflow; `nube-gh.py traer` trae la rama `nube/<run>` a main (ff) y
# `publicar.py` la publica con las cuatro puertas. La nube NUNCA toca main:
# solo empuja su rama `nube/<run-id>`.
#
# Claves: secretos del repositorio (Settings → Secrets → Actions), que Alex pone
# con `python3 scripts/puente/nube-gh.py secretos` (lee ~/.starseed/env y usa `gh`;
# aquí solo aparecen NOMBRES). Un secreto ausente simplemente deja fuera esa pasarela.
name: enjambre-nube

on:
  workflow_dispatch:
    inputs:
      cola:
        description: "Ruta de la cola dentro del repo (enjambre/colas/cola-nube-*.json)"
        required: true
        type: string
      trabajadores:
        description: "Agentes en paralelo (4 vCPU → 3)"
        required: false
        default: "3"
        type: string
      minutos:
        description: "Tope de minutos del enjambre (máx. 340: el job muere a las 6 h)"
        required: false
        # (2026-09-20) Estaba en 300. Un job se quedó colgado con UNA sola tarea y tuvimos
        # que esperar DOS HORAS para poder leer su log, porque los logs de un job en marcha
        # no se pueden descargar. Un medio nuevo se depura con ciclos cortos: 45 minutos
        # bastan de sobra para una tanda y convierten un cuelgue de dos horas en uno de
        # tres cuartos. Quien necesite más, lo pide explícitamente.
        default: "45"
        type: string

permissions:
  contents: write

# (2026-09-20) DOS cosas tumbaban este archivo en el arranque, y las dos daban el mismo
# síntoma mudo: un run de 0 s, cero jobs, y el workflow apareciendo en `gh workflow list`
# con su RUTA en vez de con su nombre (señal de que GitHub no pudo parsearlo nunca).
# La segunda era `${ runner.temp }` en el `env:` del job — arreglada arriba. La primera:
# `inputs.cola` aquí tumbaba el workflow en el arranque: GitHub valida el
# archivo en CADA push y el contexto `inputs` no existe fuera de un workflow_dispatch →
# «This run likely failed because of a workflow file issue» (run 35497365350, 0 s, 0 jobs).
# `github.event.inputs.*` sí resuelve a vacío en los demás eventos.
concurrency:
  group: enjambre-nube-${{ github.event.inputs.cola || github.ref }}
  cancel-in-progress: false

jobs:
  enjambre:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      STARSEED_MEDIO: nube-gh
      STARSEED_ROOT: ${{ github.workspace }}
      NEEDLE_TELEMETRY: "0"
      # (2026-09-20) EN LA NUBE NO HAY NADIE QUE APRUEBE. El run 35554919550 escribio su
      # tarea, paso las puertas, levanto la puerta de aprobacion... y se quedo 99 MINUTOS
      # repitiendo «AX2 esperando aprobación · 0 integradas» hasta que el tope lo mato. En
      # la Mac esa puerta la resuelve el director en 6-8 min; aqui no hay director ni Alex.
      # Con 10 minutos, la tarea queda «pendiente_aprobacion» con su rama conservada, el
      # job termina y la Mac la recoge. Esperar dos horas a un humano que no existe no es
      # prudencia: es tirar el medio entero.
      STARSEED_ESPERA_APROBACION_S: "600"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias y orquestador
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          # (2026-09-30) Versión FIJA, no @latest: con latest un build deja de ser
          # reproducible y una release rota del orquestador tumba la nube entera sin
          # cambio propio. 1.18.33 fue la última `@latest` instalada con run en verde
          # (run 36687585277, 2026-09-30). Para subirla: probar la nueva versión UN día
          # con un run manual corto; si queda en verde, subir el número aquí y anotar
          # el run que la validó. Para darla de baja ante una release rota, basta
          # volver al número anterior.
          npm install -g opencode-ai@1.18.33 --no-audit --no-fund --loglevel=error
          # El contexto `runner` no existe en el `env:` de un job (GitHub tumba el archivo
          # entero al validarlo: run 35547727552, 0 s, 0 jobs). $RUNNER_TEMP sí existe aquí.
          export STARSEED_WT="$RUNNER_TEMP/starseed-wt"
          echo "STARSEED_WT=$STARSEED_WT" >> "$GITHUB_ENV"
          mkdir -p ~/.starseed ~/.config/opencode "$STARSEED_WT"
          cp deploy/nube/opencode.json ~/.config/opencode/opencode.json
          bash scripts/enjambre/instalar.sh
          git config user.email "enjambre-nube-gh@starseed.local"
          git config user.name "Enjambre StarSeed (nube-gh)"
          # (2026-10-04, NUB1004A) En el runner NO existe la rama local `main`: el checkout
          # es de la ref `colas/nube-*` y `origin/main` no satisface «main», así que los
          # `git diff main...HEAD` del orquestador fallaban en silencio y la puerta «no tocó
          # ninguno de los archivos declarados» veía CERO archivos aunque el agente hubiera
          # escrito (run 37244680264: OPT1004D registró «escritura · archivos_cambiados=2»
          # y «alcance · tocados=1», y acabó «no toco ninguno»). Causa, no el cwd: el agente
          # sí escribió en SU worktree ($STARSEED_WT), lo que no existía era la referencia
          # contra la que se mide el trabajo. Se crea aquí la rama local.
          git fetch -q origin "+refs/heads/main:refs/heads/main" \
            || git branch -f main origin/main
          git rev-parse --verify main

      - name: Estado de la Mac que viajó con la cola
        run: |
          base="$(basename "${{ inputs.cola }}" .json)"
          src="enjambre/colas/estado-$base"
          mkdir -p ~/.starseed
          # (2026-10-04, NUB1004A) Copia rotación y salud de modelos que `nube-gh.py lanzar`
          # subió saneadas con la cola. Sin ellas la nube probaba la rotación entera por
          # orden y perdía cada run con modelos sin cuota (gemini) o colgados (glm-5.3).
          if [ -d "$src" ]; then
            cp "$src"/*.json ~/.starseed/
            echo "estado copiado a ~/.starseed:"
            ls -1 ~/.starseed/*.json | xargs -n1 basename
          else
            echo "esta cola no trae estado ($src): rotación por defecto"
          fi

      - name: Claves (solo las presentes; nunca se imprimen)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_SHARED_KEY: ${{ secrets.NVIDIA_SHARED_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STARSEED_PASARELA_GROQ_KEY: ${{ secrets.STARSEED_PASARELA_GROQ_KEY }}
          STARSEED_PASARELA_GROQ_URL: ${{ vars.STARSEED_PASARELA_GROQ_URL }}
          STARSEED_PASARELA_GROQ_MODELOS: ${{ vars.STARSEED_PASARELA_GROQ_MODELOS }}
          STARSEED_PASARELA_GROQ_RPM: ${{ vars.STARSEED_PASARELA_GROQ_RPM }}
        run: |
          : > ~/.starseed/env; chmod 600 ~/.starseed/env
          n=0
          for v in GEMINI_API_KEY GOOGLE_GENERATIVE_AI_API_KEY NVIDIA_API_KEY NVIDIA_SHARED_KEY OPENROUTER_API_KEY \
                   XKIRO_API_KEY AIHUBMIX_API_KEY TOKENROUTER_API_KEY GROQ_API_KEY STARSEED_PASARELA_GROQ_KEY \
                   STARSEED_PASARELA_GROQ_URL STARSEED_PASARELA_GROQ_MODELOS STARSEED_PASARELA_GROQ_RPM; do
            if [ -n "${!v:-}" ]; then printf '%s=%q\n' "$v" "${!v}" >> ~/.starseed/env; n=$((n+1)); fi
          done
          echo "variables presentes: $n"
          if [ "$n" = 0 ]; then echo "::error::sin secretos: pon las claves con scripts/puente/nube-gh.py secretos"; exit 1; fi

      - name: Enjambre
        run: |
          set -a; . ~/.starseed/env; set +a
          test -f "${{ inputs.cola }}" || { echo "::error::no existe la cola ${{ inputs.cola }}"; exit 1; }
          # (2026-09-20) `instalar.sh` pone el orquestador en $HOME/bin en Linux y en
          # $HOME/.local/bin en macOS. Aquí estaba escrita a mano la ruta de macOS, así que
          # python3 no encontraba el archivo... y como la orden acababa en `|| true`, el job
          # terminaba EN VERDE habiendo hecho cero trabajo. Un job verde que no hizo nada es
          # peor que uno rojo: nadie va a mirarlo. Ahora se resuelve la ruta y, si no está,
          # el paso FALLA antes de intentar nada.
          ORQ="$HOME/bin/starseed-enjambre.py"
          [ -f "$ORQ" ] || ORQ="$HOME/.local/bin/starseed-enjambre.py"
          test -f "$ORQ" || { echo "::error::no se instaló el orquestador (ni ~/bin ni ~/.local/bin)"; exit 1; }
          echo "orquestador: $ORQ"
          # (2026-09-20) El log NO puede vivir dentro del repo: `tee enjambre-nube-gh.log`
          # ensuciaba el arbol de trabajo y el orquestador se niega a arrancar con el arbol
          # sucio — «no arranco · ajeno: enjambre-nube-gh.log». El propio archivo que el paso
          # creaba impedia arrancar el proceso que ese paso iba a lanzar.
          LOG="$RUNNER_TEMP/enjambre-nube-gh.log"
          mkdir -p starseed_memory_root/olas
          # `timeout` a secas manda SIGTERM y se queda esperando: el orquestador lanza agentes
          # (opencode) que no siempre se mueren con eso, y el run 35554919550 seguia vivo
          # DIEZ MINUTOS despues de su tope de 120. Con `-k 60` se manda SIGKILL un minuto
          # despues, que es lo unico que no se puede ignorar.
          timeout -k 60 "${{ inputs.minutos }}m" python3 -u "$ORQ" "${{ inputs.cola }}" --workers "${{ inputs.trabajadores }}" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          # (2026-09-21) Aquí había un `|| true` y costó SEIS HORAS de nube. p316Gb añadió
          # `puerta_degenerados.py` a las 00:05; `instalar.sh` no lo copiaba al lado del
          # orquestador, así que cada run moría en 0,2 s con ModuleNotFoundError… y
          # terminaba EN VERDE. Un job verde que no hizo nada es peor que uno rojo: nadie
          # lo mira. El orquestador gestiona por dentro los fallos de sus tareas y sale 0;
          # si sale distinto de 0 es que él no pudo trabajar. 124 es el tope de `timeout`,
          # que es un final legítimo.
          if [ "$rc" != "0" ] && [ "$rc" != "124" ]; then
            echo "::error::el orquestador no pudo trabajar (rc=$rc). Últimas líneas:"
            tail -25 "$LOG" || true
            exit 1
          fi
          # (2026-09-24) Se cuenta desde el commit que lanzó el run (la cola), NO desde
          # origin/main: ese rango incluía todo lo que la Mac aún no había publicado, así
          # que cada run «entregaba» aunque sus agentes no hubieran hecho nada. Resultado:
          # ~170 ramas nube/<run> sin un solo commit propio.
          n=$(git log --oneline "${{ github.sha }}..HEAD" | wc -l)
          echo "commits por entregar: $n"
          if [ "$n" = "0" ]; then
            # (2026-09-30, SP09293) Antes esto era solo un ::warning y el job terminaba en
            # verde sin haber hecho nada: el patrón «verde que no hizo nada», peor que un
            # rojo porque nadie investiga. Ahora el paso FALLA; el warning queda de contexto.
            echo "::warning::el enjambre no dejó ningún commit; mira enjambre-nube-gh.log en los artefactos"
            echo "::error::cero commits: job que termina en verde sin trabajo"
            exit 1
          fi

      - name: Entregar (rama nube/<run>, nunca main)
        if: always()
        run: |
          # Solo lo que hicieron los agentes de este run (ver el paso anterior).
          n=$(git log --oneline "${{ github.sha }}..HEAD" | wc -l)
          if [ "$n" -gt 0 ]; then
            git push origin "HEAD:refs/heads/nube/${{ github.run_id }}"
            echo "rama nube/${{ github.run_id }} con $n commit(s)"
          else
            echo "nada que entregar en main"
          fi
          # (2026-09-20) Las ramas `ola/<id>` de las tareas que NO pasaron sus puertas se
          # conservan... DENTRO del runner, que se borra. CU3r escribio 998 segundos, fallo
          # tsc por un error, y todo ese trabajo se iba a la basura: en la Mac esa rama se
          # conserva y se repara, aqui moria con la maquina. Se empujan tambien, con su
          # nombre bajo el run, para que la Mac pueda recogerlas y arreglarlas.
          # (2026-09-30) El push puede fallar (red, carrera con otro run); con `|| continue`
          # el trabajo del agente se perdia en silencio con el runner efimero. Se reintenta
          # hasta 3 veces con fetch previo; si agota, el paso falla y la rama perdida queda
          # registrada en el resumen del job.
          PERDIDAS=""
          for rama in $(git for-each-ref --format='%(refname:short)' 'refs/heads/ola/*'); do
            c=$(git log --oneline "${{ github.sha }}..$rama" | wc -l)
            [ "$c" -gt 0 ] || continue
            ok=0
            for intento in 1 2 3; do
              git fetch -q origin || true
              if git push -q origin "$rama:refs/heads/nube/${{ github.run_id }}/$rama"; then
                ok=1
                break
              fi
              echo "::warning::push de $rama fallo (intento $intento/3)"
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "rama conservada: nube/${{ github.run_id }}/$rama ($c commit(s))"
            else
              echo "::error::rama perdida: $rama ($c commit(s)) no se pudo empujar tras 3 intentos"
              PERDIDAS="$PERDIDAS $rama"
            fi
          done
          if [ -n "$PERDIDAS" ]; then
            echo "### Ramas ola perdidas (push agotado)" >> "$GITHUB_STEP_SUMMARY"
            for r in $PERDIDAS; do echo "- \`$r\`" >> "$GITHUB_STEP_SUMMARY"; done
            exit 1
          fi

      # (2026-10-03, SP09294) GitHub enmascara los secretos en el registro del JOB, pero NO en
      # los artefactos: el log de `tee` y los JSON de olas se suben tal cual y quedan 7 días
      # descargables. Los agentes (opencode) necesitan las claves de proveedor en su entorno
      # —las lee `{env:…}` de opencode.json—, así que exportar menos no cierra nada; lo que
      # se cierra es la salida: cualquier valor de clave que un agente haya escrito se tacha
      # aquí, antes de subir el rastro. Solo se tachan valores; nunca se imprimen.
      - name: Tachar claves del rastro
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/enjambre-nube-gh.log" <<'PY'
          import glob, os, shlex, sys
          valores = []
          try:
              with open(os.path.expanduser("~/.starseed/env"), encoding="utf-8") as f:
                  for linea in f:
                      nombre, _, crudo = linea.strip().partition("=")
                      if not nombre.endswith("_KEY") or not crudo:
                          continue
                      try:
                          valor = shlex.split(crudo)[0]
                      except (ValueError, IndexError):
                          continue
                      if len(valor) >= 8:
                          valores.append(valor.encode())
          except OSError:
              pass
          rutas = sys.argv[1:] + glob.glob("starseed_memory_root/olas/*.json") + glob.glob("starseed_memory_root/olas/*.jsonl")
          tachados = 0
          for ruta in rutas:
              try:
                  with open(ruta, "rb") as f:
                      datos = f.read()
              except OSError:
                  continue
              nuevo = datos
              for v in valores:
                  nuevo = nuevo.replace(v, b"***")
              if nuevo != datos:
                  tachados += 1
                  with open(ruta, "wb") as f:
                      f.write(nuevo)
          print("archivos del rastro con alguna clave tachada: %d" % tachados)
          PY

      - name: Rastro (log, latidos, progreso)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enjambre-nube-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/enjambre-nube-gh.log
            starseed_memory_root/olas/latidos-*.json
            starseed_memory_root/olas/progreso.json
            starseed_memory_root/olas/eventos.jsonl
          if-no-files-found: ignore
          retention-days: 7
