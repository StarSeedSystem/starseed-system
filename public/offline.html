<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StarSeed OS · Sin conexión</title>
  <link rel="icon" href="/favicon-48.png" />
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0A0712;
      color: #E8E6F0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      box-sizing: border-box;
    }
    img { width: 96px; height: 96px; margin-bottom: 1.5rem; opacity: 0.92; }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { font-size: 0.95rem; line-height: 1.5; color: #A8A4C0; max-width: 28rem; margin: 0 0 1.75rem; }
    button {
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #E8E6F0;
      font-size: 0.95rem;
      padding: 0.65rem 1.4rem;
      border-radius: 0.75rem;
      transition: background 200ms ease, border-color 200ms ease;
    }
    button:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.28); }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/starseed-symbol-192.png" alt="StarSeed" />
    <h1>Sin conexión</h1>
    <p>No hay conexión a la red en este momento. StarSeed OS volverá a cargar automáticamente cuando recuperes el acceso a internet.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
