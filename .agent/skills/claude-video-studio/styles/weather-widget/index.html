<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;600&display=swap" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #8fc3f2; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #ui {
        position: absolute; left: 0; top: 0; width: 100px; height: 100px;
        font-family: "Inter", sans-serif;
        color: #fff; pointer-events: none;
      }
      .lab {
        position: absolute; left: 0; top: 0; white-space: nowrap;
        font-size: 70px; font-weight: 600; letter-spacing: -0.012em; line-height: 1;
        text-shadow: 0 2px 24px rgba(0, 20, 50, 0.16);
        opacity: 0; will-change: transform, opacity, filter;
      }
      #temp {
        position: absolute; left: 0; bottom: 0; white-space: nowrap;
        font-size: 300px; font-weight: 200; letter-spacing: -0.045em; line-height: 0.84;
        font-variant-numeric: tabular-nums; text-shadow: 0 4px 40px rgba(0, 20, 50, 0.14);
        will-change: transform, opacity;
      }
      #temp .deg { font-weight: 200; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <canvas id="cv" width="1920" height="1080" class="clip" data-start="0" data-duration="12" data-track-index="0"></canvas>
      <div id="ui" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div class="lab" id="w0"></div>
        <div class="lab" id="w1"></div>
        <div class="lab" id="w2"></div>
        <div class="lab" id="w3"></div>
        <div class="lab" id="w4"></div>
        <div class="lab" id="w5"></div>
        <div id="temp"><span id="tnum"></span><span class="deg" id="tunit"></span></div>
      </div>
    </div>
    <script>
      /*
       * One widget, every sky. 12 s, 1920x1080, one canvas + DOM text, drawn as a pure function of time.
       * One weather widget lives through a whole day and never cuts away; it spring-morphs shape on every state change.
       * Beat map (120 BPM):
       *   0.0 to 2.0   widget lands (expo.out), sun rises inside it, label 1, numeral counts up
       *   2.5          square springs to a wide pill, clouds roll in, label 2
       *   4.5 / 6.5    pill springs to a tall card, rain (label 3); lightning flash + widget jolt (label 4)
       *   7.5 to 10.0  card springs to a wide pill, navy night, moon, stars, shooting star at 9.3 (label 5)
       *   10.0 to 12   pill springs back to the rounded square, dawn, sun rises again (label 6), hold
       * Words and numbers: LABELS, TEMPS, UNIT below (SAMPLE DATA). Colours: SUN (the one warm accent) and the six
       * sky palettes PM / PC / PR / PS / PN / PD under "palettes" (sky top, sky bottom, widget top, widget bottom, shadow).
       */
      (function () {
        // SAMPLE DATA: change these
        const LABELS = ['Sunny', 'Cloudy', 'Rain', 'Storm', 'Clear night', 'Sunrise'];  // one per state, max 3 words each
        const TEMPS = [12, 18, 15, 11, 9, 6, 12];   // start value, then the value each state counts to
        const UNIT = '\u00B0';                      // degree sign
        const W = 1920, H = 1080, DUR = 12;
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const ui = document.getElementById('ui');
        const tempEl = document.getElementById('temp');
        const tnum = document.getElementById('tnum');
        const labs = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('w' + i));
        labs.forEach((el, i) => { el.textContent = LABELS[i]; });
        document.getElementById('tunit').textContent = UNIT;
        tnum.textContent = String(TEMPS[0]);

        // ---------- helpers ----------
        const E = n => gsap.parseEase(n);
        const eOut3 = E('power3.out'), eExpo = E('expo.out'), eIO = E('power2.inOut'), eIn = E('power2.in'),
              eSine = E('sine.inOut'), eIO3 = E('power3.inOut');
        const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
        const pr = (t, a, b) => cl((t - a) / (b - a));
        const lerp = (a, b, k) => a + (b - a) * k;
        const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
        const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
        const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
        function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        const R = mulberry(20261020);
        // underdamped spring from rest, ~7% overshoot
        const spring = p => { if (p <= 0) return 0; if (p >= 1) return 1; const z = 6.5, wd = 8.2; return 1 - Math.exp(-z * p) * (Math.cos(wd * p) + (z / wd) * Math.sin(wd * p)); };
        const SUN = [255, 201, 74];

        // ---------- palettes ----------
        const P = (st, sb, wt, wb, sh) => ({ st: hex(st), sb: hex(sb), wt: hex(wt), wb: hex(wb), sh });
        const PM = P('#86BDF0', '#E8F3FC', '#2A78E2', '#73B8F7', [24, 78, 150, 0.34]);
        const PC = P('#8799AE', '#CED7E1', '#566D86', '#8A9EB3', [40, 56, 76, 0.36]);
        const PR = P('#334254', '#5B6B7F', '#1D2939', '#3A4A5F', [6, 10, 18, 0.5]);
        const PS = P('#222D3B', '#3E4B5D', '#121A25', '#2A3748', [4, 8, 14, 0.58]);
        const PN = P('#0E1A33', '#1E3263', '#1A2D5A', '#0B1530', [2, 5, 14, 0.62]);
        const PD = P('#3A5FA6', '#F7E6BC', '#3468C2', '#C9DCF2', [30, 62, 120, 0.34]);
        const palSteps = [[2.35, 3.55, PC], [4.35, 5.35, PR], [5.6, 6.45, PS], [7.35, 8.6, PN], [9.9, 11.1, PD]];
        function palette(t) {
          let p = PM;
          for (const [a, b, q] of palSteps) {
            const k = eIO(pr(t, a, b));
            if (k <= 0) break;
            p = { st: mix(p.st, q.st, k), sb: mix(p.sb, q.sb, k), wt: mix(p.wt, q.wt, k), wb: mix(p.wb, q.wb, k), sh: mix(p.sh, q.sh, k) };
          }
          return p;
        }

        // ---------- widget shape ----------
        const SQ = { w: 880, h: 880, r: 140 }, PL = { w: 1680, h: 620, r: 310 }, TC = { w: 720, h: 940, r: 96 }, NP = { w: 1720, h: 600, r: 300 };
        const morphs = [[2.5, PL], [4.5, TC], [7.5, NP], [10.0, SQ]];
        const MD = 1.25;
        function box(t) {
          let b = { ...SQ };
          for (const [t0, q] of morphs) {
            const kw = spring((t - t0) / MD), kh = spring((t - t0 - 0.06) / MD), kr = spring((t - t0 - 0.03) / MD);
            b = { w: lerp(b.w, q.w, kw), h: lerp(b.h, q.h, kh), r: lerp(b.r, q.r, kr) };
          }
          const ent = eExpo(pr(t, 0, 1.1));
          const s = 0.9 + 0.1 * ent;
          let cx = W / 2, cy = H / 2 + 60 * (1 - ent) + Math.sin(t * 1.3) * 4 * ent;
          // lightning jolt
          if (t > 6.5) { const a = t - 6.5; cx += 9 * Math.exp(-a * 9) * Math.sin(a * 70); cy += 5 * Math.exp(-a * 9) * Math.sin(a * 55 + 1); }
          const w = b.w * s, h = b.h * s, r = Math.min(b.r * s, w / 2, h / 2);
          return { x0: cx - w / 2, y0: cy - h / 2, x1: cx + w / 2, y1: cy + h / 2, w, h, r, cx, cy, alpha: eOut3(pr(t, 0, 0.45)), base: b };
        }

        // ---------- seeded scene data ----------
        const bgBlobs = Array.from({ length: 11 }, () => ({ x: R() * 2600 - 300, y: 80 + R() * 920, r: 260 + R() * 360, sp: 14 + R() * 26, k: R() }));
        const puffBase = [[-0.95, 0.12, 0.46], [-0.42, -0.12, 0.62], [0.18, -0.34, 0.78], [0.82, -0.06, 0.6], [1.22, 0.16, 0.42]];
        const clouds = [
          { u: 0.86, v: 0.17, s: 0.7, d: 0.35, delay: 0.0, far: 1 },
          { u: 0.50, v: 0.14, s: 0.62, d: 0.3, delay: 0.5, far: 1 },
          { u: 0.70, v: 0.30, s: 1.0, d: 0.6, delay: 0.2 },
          { u: 0.95, v: 0.40, s: 1.15, d: 0.85, delay: 0.1 },
          { u: 0.56, v: 0.44, s: 0.9, d: 0.75, delay: 0.75 },
          { u: 0.20, v: 0.30, s: 0.95, d: 0.7, delay: 2.4, storm: 1 },
          { u: 0.80, v: 0.50, s: 0.8, d: 0.5, delay: 1.6, low: 1 },
          { u: 0.36, v: 0.10, s: 0.85, d: 0.5, delay: 2.6, storm: 1 },
        ].map(c => ({ ...c, puffs: puffBase.map(p => [p[0] + (R() - 0.5) * 0.16, p[1] + (R() - 0.5) * 0.1, p[2] * (0.88 + R() * 0.24)]) }));
        const wisps = Array.from({ length: 4 }, (_, i) => ({ u: [0.12, 0.42, 0.7, 0.28][i], v: [0.18, 0.1, 0.24, 0.32][i], l: 160 + R() * 160, sp: 10 + R() * 14 }));
        const ridgeDef = [
          { base: 236, amp: 62, f: [1 / 760, 1 / 340, 1 / 150], ph: [R() * 6, R() * 6, R() * 6], drift: 4, tone: 0.1 },
          { base: 150, amp: 50, f: [1 / 620, 1 / 290, 1 / 130], ph: [R() * 6, R() * 6, R() * 6], drift: 9, tone: 0.4 },
          { base: 70, amp: 40, f: [1 / 540, 1 / 250, 1 / 110], ph: [R() * 6, R() * 6, R() * 6], drift: 16, tone: 0.75 },
        ];
        const drops = Array.from({ length: 190 }, () => ({ a: R(), v: 1700 + R() * 900, len: 46 + R() * 70, off: R(), on: R(), w: 1.4 + R() * 1.4 }));
        const bgDrops = Array.from({ length: 300 }, () => ({ x: R() * 2200 - 140, v: 2400 + R() * 1200, len: 70 + R() * 90, off: R(), on: R() }));
        const beads = Array.from({ length: 46 }, () => ({ u: 0.04 + R() * 0.92, v: 0.05 + R() * 0.9, r: 3 + R() * 8, t: 4.9 + R() * 1.8, slide: R() < 0.18, sv: 30 + R() * 70 }));
        const stars = Array.from({ length: 110 }, () => ({ u: R(), v: R() * 0.8, r: 0.7 + Math.pow(R(), 3) * 2.4, t: 8.0 + R() * 1.7, f: 1.5 + R() * 4, ph: R() * 6.28 }));
        const bgStars = Array.from({ length: 240 }, () => ({ x: R() * W, y: R() * H * 0.95, r: 0.5 + Math.pow(R(), 4) * 1.8, t: 7.9 + R() * 1.6, f: 1 + R() * 3, ph: R() * 6.28 }));
        const maria = Array.from({ length: 6 }, () => ({ x: (R() - 0.5) * 1.0, y: (R() - 0.5) * 1.0, r: 0.22 + R() * 0.3 }));
        // lightning bolt (unit space: x across, y 0..1 down)
        function bolt(seed) {
          const r = mulberry(seed);
          let pts = [[0, 0], [0.08, 1]];
          let disp = 0.22;
          for (let lvl = 0; lvl < 6; lvl++) {
            const np = [pts[0]];
            for (let i = 1; i < pts.length; i++) {
              const a = pts[i - 1], b = pts[i];
              np.push([(a[0] + b[0]) / 2 + (r() - 0.5) * disp, (a[1] + b[1]) / 2 + (r() - 0.5) * disp * 0.15]);
              np.push(b);
            }
            pts = np; disp *= 0.55;
          }
          const branches = [];
          for (let k = 0; k < 3; k++) {
            const i0 = 12 + Math.floor(r() * 36), s = pts[i0], dir = r() < 0.5 ? -1 : 1;
            const br = [s]; let x = s[0], y = s[1];
            for (let j = 0; j < 9; j++) { x += dir * (0.02 + r() * 0.03); y += 0.02 + r() * 0.025; br.push([x + (r() - 0.5) * 0.02, y]); }
            branches.push(br);
          }
          return { pts, branches };
        }
        const B1 = bolt(77), B2 = bolt(1312);

        // film grain tile
        const grain = document.createElement('canvas'); grain.width = grain.height = 256;
        { const g = grain.getContext('2d'), id = g.createImageData(256, 256), gr = mulberry(9);
          for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (gr() - 0.5) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
          g.putImageData(id, 0, 0); }
        const grainPat = ctx.createPattern(grain, 'repeat');

        // ---------- timing curves ----------
        const sunRise = t => eOut3(pr(t, 0.15, 1.9));
        const dawnRise = t => eOut3(pr(t, 10.15, 12.2));
        const cloudIn = t => pr(t, 1.9, 3.9);
        const cloudOut = t => eIO(pr(t, 7.3, 8.3));
        const rainW = t => eIO(pr(t, 4.55, 5.2)) * (1 - eIO(pr(t, 7.15, 7.9)));
        const darkW = t => eIO(pr(t, 4.2, 5.2)) * (1 - 0.5 * eIO(pr(t, 7.4, 8.4)));
        const nightW = t => eIO(pr(t, 7.6, 8.7)) * (1 - eIO(pr(t, 9.95, 10.9)));
        function flash(t) {
          let f = 0;
          if (t >= 6.5) f += Math.exp(-(t - 6.5) * 16);
          if (t >= 6.66) f += 0.75 * Math.exp(-(t - 6.66) * 18);
          if (t >= 6.9) f += 0.25 * Math.exp(-(t - 6.9) * 22);
          return Math.min(1, f);
        }

        // ---------- drawing ----------
        function sunPos(b, t) {
          const ax = b.x1 - Math.min(240, b.w * 0.28), ay = b.y0 + Math.min(236, b.h * 0.37);
          const morning = sunRise(t), dawn = dawnRise(t);
          let y = ay + (1 - morning) * b.h * 0.95, vis = 1;
          const dim = eIO(pr(t, 2.9, 4.9));
          vis = 1 - dim;
          if (t > 9.8) { y = ay + b.h * 0.14 + (1 - dawn) * b.h * 0.8; vis = pr(t, 10.1, 10.3); }
          return { x: ax, y, vis, cover: dim };
        }
        function moonPos(b, t) {
          const ax = b.x1 - Math.min(340, b.w * 0.22), ay = b.y0 + b.h * 0.33;
          const k = eExpo(pr(t, 7.9, 9.4)), set = eIn(pr(t, 9.55, 10.3));
          return { x: ax - set * 60, y: ay + (1 - k) * b.h * 0.9 + set * b.h * 0.9, vis: pr(t, 7.85, 8.1) * (1 - pr(t, 10.1, 10.3)) };
        }

        function drawSky(t, pal, b, sun, moon) {
          const fl = flash(t);
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, rgb(pal.st)); g.addColorStop(1, rgb(pal.sb));
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          // dawn horizon warmth
          const dawnK = eIO(pr(t, 9.9, 11.2));
          if (dawnK > 0) {
            const hg = ctx.createRadialGradient(W * 0.62, H * 1.15, 0, W * 0.62, H * 1.15, 1300);
            hg.addColorStop(0, `rgba(255,214,120,${0.5 * dawnK})`); hg.addColorStop(0.5, `rgba(255,226,170,${0.18 * dawnK})`); hg.addColorStop(1, 'rgba(255,230,180,0)');
            ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
          }
          // sun light spilling past the widget
          const sl = sun.vis * (t < 9.8 ? sunRise(t) : dawnRise(t));
          if (sl > 0.01) {
            const r = 1100, sg = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, r);
            sg.addColorStop(0, `rgba(255,236,170,${0.55 * sl})`); sg.addColorStop(0.35, `rgba(255,240,200,${0.2 * sl})`); sg.addColorStop(1, 'rgba(255,240,200,0)');
            ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
          }
          if (moon.vis > 0.01) {
            const mg = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, 900);
            mg.addColorStop(0, `rgba(150,175,235,${0.22 * moon.vis})`); mg.addColorStop(1, 'rgba(150,175,235,0)');
            ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
          }
          // background stars
          const nw = nightW(t);
          if (nw > 0.01) {
            for (const s of bgStars) {
              const a = eOut3(pr(t, s.t, s.t + 0.5)) * nw * (0.55 + 0.45 * Math.sin(t * s.f + s.ph));
              if (a <= 0.01) continue;
              ctx.fillStyle = `rgba(235,240,255,${a * 0.8})`;
              ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
            }
          }
          // soft background clouds (out of focus)
          const ci = eIO(cloudIn(t)), co = cloudOut(t), dk = darkW(t);
          const morningWisp = 0.35 * (1 - ci) * (1 - nightW(t)) * (1 - pr(t, 9.5, 10)) + 0.35 * eIO(pr(t, 10.3, 11.5));
          const cloudA = Math.max(morningWisp, ci * (1 - co) * 0.75);
          if (cloudA > 0.01) {
            for (const c of bgBlobs) {
              let x = ((c.x - t * c.sp - co * 900) % 2600 + 2600) % 2600 - 300;
              const col = mix([255, 255, 255], [52, 64, 80], dk);
              const lit = mix(col, [235, 240, 255], fl * 0.6);
              for (let k = 0; k < 3; k++) {
                const ox = x + (k - 1) * c.r * 0.7, oy = c.y + (k === 1 ? -c.r * 0.18 : 0), rr = c.r * (k === 1 ? 1 : 0.75);
                const g2 = ctx.createRadialGradient(ox, oy, 0, ox, oy, rr);
                const a = cloudA * (0.30 + 0.25 * c.k) * (dk > 0 ? lerp(1, 1.5, dk) : 1);
                g2.addColorStop(0, rgb(lit, Math.min(0.75, a))); g2.addColorStop(1, rgb(lit, 0));
                ctx.fillStyle = g2; ctx.fillRect(ox - rr, oy - rr, rr * 2, rr * 2);
              }
            }
          }
          // distant rain
          const rw = rainW(t);
          if (rw > 0.01) {
            ctx.lineCap = 'round'; ctx.lineWidth = 1.2; ctx.strokeStyle = `rgba(200,212,230,${0.22 * rw})`;
            ctx.beginPath();
            for (const d of bgDrops) {
              if (d.on > rw) continue;
              const Hc = H + 300, s = ((t * d.v + d.off * Hc) % Hc), y = s - 200, x = d.x + y * 0.16;
              ctx.moveTo(x - d.len * 0.16, y - d.len); ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
          // distant bolt
          if (t > 6.64 && t < 6.78) {
            const k = 1 - pr(t, 6.64, 6.78);
            drawBolt(B2, 230, -20, 520, 0.35 * k, 0.6);
          }
        }

        function drawBolt(Bt, ox, oy, len, a, sc) {
          ctx.save();
          ctx.lineJoin = 'round'; ctx.lineCap = 'round';
          const path = pts => { ctx.beginPath(); pts.forEach((p, i) => { const x = ox + p[0] * len, y = oy + p[1] * len; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); };
          ctx.shadowColor = `rgba(190,215,255,${a})`; ctx.shadowBlur = 40 * sc;
          ctx.strokeStyle = `rgba(190,210,255,${0.35 * a})`; ctx.lineWidth = 16 * sc; path(Bt.pts); ctx.stroke();
          ctx.shadowBlur = 16 * sc;
          ctx.strokeStyle = `rgba(200,220,255,${0.6 * a})`; ctx.lineWidth = 7 * sc; path(Bt.pts); ctx.stroke();
          ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 3.2 * sc; path(Bt.pts); ctx.stroke();
          ctx.lineWidth = 1.8 * sc; for (const br of Bt.branches) { path(br); ctx.stroke(); }
          ctx.restore();
        }

        function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

        function cloudPath(x, y, size, ps, grow = 0) {
          ctx.beginPath();
          for (const p of ps) { const r = p[2] * size + grow; ctx.moveTo(x + p[0] * size + r, y + p[1] * size); ctx.arc(x + p[0] * size, y + p[1] * size, r, 0, 6.283); }
          ctx.roundRect(x - 1.25 * size - grow, y + 0.02 * size - grow, 2.6 * size + grow * 2, 0.56 * size + grow * 2, 0.28 * size + grow);
        }
        function drawCloud(x, y, size, light, shade, alpha, shadowA) {
          const ps = this_puffs;
          ctx.save();
          ctx.globalAlpha *= alpha;
          // soft cast shadow
          ctx.shadowColor = `rgba(8,20,45,${shadowA})`; ctx.shadowBlur = size * 0.6; ctx.shadowOffsetY = size * 0.3;
          cloudPath(x, y, size, ps);
          const g = ctx.createLinearGradient(0, y - size * 1.1, 0, y + size * 0.6);
          g.addColorStop(0, rgb(light)); g.addColorStop(0.55, rgb(mix(light, shade, 0.45))); g.addColorStop(1, rgb(shade));
          ctx.fillStyle = g; ctx.fill();
          ctx.shadowColor = 'transparent';
          // inner volume: soft lit domes, no hard seams
          ctx.save(); cloudPath(x, y, size, ps); ctx.clip();
          for (const p of ps) {
            const px = x + p[0] * size + p[2] * size * 0.18, py = y + p[1] * size - p[2] * size * 0.32, r = p[2] * size * 1.0;
            const hg = ctx.createRadialGradient(px, py, 0, px, py, r);
            hg.addColorStop(0, rgb(light, 0.75)); hg.addColorStop(1, rgb(light, 0));
            ctx.fillStyle = hg; ctx.fillRect(px - r, py - r, r * 2, r * 2);
            // underside occlusion of each puff

            warm.addColorStop(0.55, `rgba(255,232,180,${0.08 * sunA})`); warm.addColorStop(1, 'rgba(255,232,180,0)');

          }
          const n = Math.round(v);

          tempEl.style.opacity = intro;
          tempEl.style.transform = `translate(${padX - 14 * s}px, ${-(52 * s) + 30 * (1 - intro)}px)`;
        }

        function draw(t) {
          const b = box(t), pal = palette(t);
          const sun = sunPos(b, t), moon = moonPos(b, t);

          if (fl > 0.01) {
            const fg = ctx.createRadialGradient(W * 0.55, H * 0.3, 0, W * 0.55, H * 0.3, 1400);
            fg.addColorStop(0, `rgba(225,235,255,${0.3 * fl})`); fg.addColorStop(1, `rgba(200,215,245,${0.05 * fl})`);
            ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
          }

          const vg2 = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.15);
          vg2.addColorStop(0, 'rgba(0,8,24,0)'); vg2.addColorStop(1, 'rgba(0,8,24,0.22)');
          ctx.fillStyle = vg2; ctx.fillRect(0, 0, W, H);

          const fr = Math.floor(t * 30);
          ctx.save();
          ctx.globalAlpha = 0.045; ctx.globalCompositeOperation = 'overlay';
          ctx.translate(-((fr * 97) % 256), -((fr * 61) % 256));
          ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 256, H + 256);
          ctx.restore();
          drawText(t, b);
        }

        const tl = gsap.timeline({ paused: true });
        const p = { t: 0 };
        tl.to(p, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => draw(p.t) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['main'] = tl;
        draw(0);
      })();
    </script>
  </body>
</html>
