<script>
/*
  30,000 years in 15 seconds. 17 s, 1920x1080, does not loop.
  One camera rides one endless timeline. Every era is drawn by code in its own period style,
  and one runner (one skeleton, one phase clock) is the hero of every era. Only its rendering changes.
  Beat map (each era cut lands on a 0.5 s beat and is matched on shape):
    0.0 cave wall, hand stencils, bison  |  2.5 black-figure vase  |  4.5 zoetrope drum
    6.5 film strip, then projected screen  |  8.5 CRT test card  |  10.5 8-bit world
    12.5 cursor types draw(frame + 1); 13.4 the code draws the runner as one ivory line
    13.7 - 16.0 the line runner turns to camera and runs full frame
    16.0 - 17.0 pull back: all seven runners line up on the tilted timeline, running in step
  Change the words: ERAS (year labels, fonts, start times) and CODE (the typed line).
  Change the colours: INK and IVORY below, PAL (8-bit world), and the per-era colours inside each scene function.
  Deterministic: seeded rng() and hash2() noise; every frame is a pure function of time.
*/
(() => {
const W = 1920, H = 1080, DUR = 17;
const TAU = Math.PI * 2;
const INK = [21, 18, 15], IVORY = [243, 238, 228];
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const BG = ctx, FG = document.getElementById('fg').getContext('2d');

// walnut grain for the 1951 cabinet
const WOOD = (() => {

// ---------------------------------------------------------------- the one motif: a run cycle
const PHI = t => 1.5 * t;  // cycles

    const knee = [hip[0] + 0.245 * Math.sin(th), hip[1] + 0.245 * Math.cos(th)];
    const sa = th - kn;

    const ua = -0.05 + 0.85 * Math.sin(qa);

const GROUND = 0.475; // hip-to-ground in body heights

function bones(P) {

// solid silhouette. X,Y = hip position, h = body height, sx = horizontal squash

// black-figure incisions

function strokePartial(c, pts, frac) {
  if (frac <= 0) return;
  const cum = polyCum(pts), tgt = cum[cum.length - 1] * frac;
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (cum[i] <= tgt) c.lineTo(pts[i][0], pts[i][1]);
    else { const k = (tgt - cum[i - 1]) / (cum[i] - cum[i - 1]); c.lineTo(lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)); break; }
  }
  c.stroke();
}
function charcoal(c, pts, frac, w, col, seed) {
  for (let p = 0; p < 3; p++) {
    const jit = pts.map((q, i) => [q[0] + (hash2(i, p, seed) - 0.5) * w * 0.5, q[1] + (hash2(i, p + 7, seed) - 0.5) * w * 0.5]);
    c.lineWidth = w * [1, 0.6, 0.35][p]; c.globalAlpha = [0.55, 0.45, 0.6][p]; c.strokeStyle = col;
    strokePartial(c, jit, frac);
  }
  c.globalAlpha = 1;
}
function bisonPath(BX, BY, L, bob) { const p = new Path2D(); BISON_OUT.forEach((q, i) => { const x = BX + q[0] * L, y = BY + q[1] * L + bob; i ? p.lineTo(x, y) : p.moveTo(x, y); }); p.closePath(); return p; }

// cave style bison; mode 'cave' (multiply on rock) or 'ink' (on dark, finale)
function drawBison(c, BX, BY, L, ph, run, rv, mode) {
  const bob = -0.018 * L * Math.sin(2 * ph * TAU) * run;
  const T = q => [BX + q[0] * L, BY + q[1] * L + bob];
  const pOut = rv.out, pLeg = rv.leg, pFill = rv.fill, pDet = rv.det;
  const cave = mode === 'cave';
  const charc = cave ? '#140c07' : '#5a2a17';
  c.save();
  if (cave) c.globalCompositeOperation = 'multiply';
  // legs (with ghost legs: the painters' eight-legged motion)
  const legSet = (phase, alpha) => {
    bisonLegs(phase).forEach(l => {
      const A = T([l.h[0], l.h[1] + 0.03]), K = T(l.k), F = T(l.f);
      c.globalAlpha = alpha * pLeg; c.fillStyle = cave ? '#1a110b' : '#c46a3c';
      capsule(c, A, K, 0.06 * L, 0.03 * L);
      capsule(c, K, F, 0.03 * L, 0.018 * L);
      c.beginPath(); c.moveTo(F[0] - 0.018 * L, F[1] - 0.02 * L); c.lineTo(F[0] + 0.03 * L, F[1] + 0.012 * L); c.lineTo(F[0] - 0.022 * L, F[1] + 0.014 * L); c.closePath(); c.fill();
    });
  };
  const path0 = bisonPath(BX, BY, L, bob);
  if (run > 0) { c.save(); const o = new Path2D(); o.rect(BX - 2 * L, BY - 2 * L, 4 * L, 4 * L); o.addPath(path0); c.clip(o, 'evenodd'); legSet(ph - 0.1, 0.22 * run); legSet(ph - 0.2, 0.1 * run); c.restore(); }
  c.globalAlpha = 1;
  // fill
  const path = bisonPath(BX, BY, L, bob);
  if (pFill > 0) {
    c.save(); c.clip(path); if (cave) { c.globalCompositeOperation = 'source-over'; c.globalAlpha = 0.82; }
    const g = c.createLinearGradient(BX - 0.5 * L, BY - 0.38 * L, BX + 0.3 * L, BY + 0.2 * L);
    if (cave) { g.addColorStop(0, `rgba(176,76,40,${pFill})`); g.addColorStop(0.45, `rgba(214,142,70,${pFill})`); g.addColorStop(1, `rgba(146,48,28,${pFill})`); }
    else { g.addColorStop(0, `rgba(198,104,58,${pFill})`); g.addColorStop(0.5, `rgba(214,140,74,${pFill})`); g.addColorStop(1, `rgba(160,62,36,${pFill})`); }
    c.fillStyle = g; c.fillRect(BX - 0.7 * L, BY - 0.6 * L, 1.4 * L, 1.1 * L);
    // charcoal head + belly shading
    const hg = c.createRadialGradient(BX + 0.5 * L, BY + 0.05 * L + bob, 0, BX + 0.5 * L, BY + 0.05 * L + bob, 0.28 * L);
    hg.addColorStop(0, `rgba(20,12,8,${0.7 * pFill})`); hg.addColorStop(1, 'rgba(20,12,8,0)');
    c.fillStyle = hg; c.fillRect(BX + 0.1 * L, BY - 0.4 * L, 0.6 * L, 0.8 * L);
    const fq = c.createLinearGradient(BX + 0.05 * L, 0, BX + 0.5 * L, 0);
    fq.addColorStop(0, 'rgba(20,12,8,0)'); fq.addColorStop(1, `rgba(20,12,8,${0.55 * pFill})`);
    c.fillStyle = fq; c.fillRect(BX, BY - 0.5 * L, 0.7 * L, 1.0 * L);
    const bg = c.createLinearGradient(0, BY + 0.05 * L, 0, BY + 0.22 * L);
    bg.addColorStop(0, 'rgba(30,16,10,0)'); bg.addColorStop(1, `rgba(30,16,10,${0.55 * pFill})`);
    c.fillStyle = bg; c.fillRect(BX - 0.6 * L, BY, 1.2 * L, 0.3 * L);
    if (cave) {
      c.globalAlpha = 0.5 * pFill; c.globalCompositeOperation = 'multiply'; c.drawImage(ROCK, BX - 1.1 * L, BY - 0.9 * L, 2.6 * L, 1.5 * L);
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 0.35 * pFill; c.strokeStyle = '#2a140a'; c.lineWidth = 0.09 * L; c.filter = `blur(${0.03 * L}px)`; c.stroke(path); c.filter = 'none';
    }
    c.restore();
  }
  if (cave) c.globalCompositeOperation = 'multiply';
  { c.save(); const outside = new Path2D(); outside.rect(BX - 2 * L, BY - 2 * L, 4 * L, 4 * L); outside.addPath(path); c.clip(outside, 'evenodd'); legSet(ph, 1); c.restore(); }
  c.globalAlpha = 1;
  // outline
  const outPts = BISON_OUT.map(T);
  charcoal(c, outPts, pOut, 0.026 * L, charc, 5);
  // details
  if (pDet > 0) {
    charcoal(c, BISON_HORN.map(T), pDet, 0.03 * L, charc, 9);
    charcoal(c, crSample([[-0.44, 0.04], [-0.3, 0.07], [-0.12, 0.05], [0.05, 0.09], [0.22, 0.1]], false, 6).map(T), pDet, 0.012 * L, charc, 13);
    // tail
    const sw = Math.sin(ph * TAU * 2) * 0.03 * run;
    const tail = crSample([BISON_TAILBASE, [-0.55, 0.0 + sw], [-0.58, 0.1 + sw * 1.5], [-0.56, 0.17 + sw]], false, 6).map(T);
    charcoal(c, tail, pDet, 0.016 * L, charc, 11);
    // hump hair
    c.globalAlpha = pDet * 0.8; c.strokeStyle = charc; c.lineWidth = 0.009 * L;
    for (let i = 0; i < 9; i++) { const a = T([0.0 + i * 0.035, -0.29 - 0.08 * Math.sin(i / 8 * Math.PI)]); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(a[0] + 0.015 * L, a[1] - 0.05 * L); c.stroke(); }
    const E = T([0.47, -0.03]); c.fillStyle = cave ? '#0d0805' : '#2a120a'; c.beginPath(); c.arc(E[0], E[1], 0.012 * L, 0, TAU); c.fill();
    c.globalAlpha = 1;
  }
  c.restore();
}

// ---------------------------------------------------------------- rotation clock (vase -> zoetrope -> film)
const OMEGA = t => 0.55 + 6.95 * sstep(4.0, 4.8, t) - 6.9 * sstep(5.85, 6.6, t);
const ROT = (() => { const dt = 1 / 480, arr = new Float32Array(Math.ceil(DUR * 480) + 2); let r = 0; for (let i = 0; i < arr.length; i++) { arr[i] = r; const t = 2.5 + i * dt; r += OMEGA(t) * dt; } return arr; })();
const rot = t => { if (t <= 2.5) return 0; const f = (t - 2.5) * 480, i = Math.floor(f); return lerp(ROT[i], ROT[i + 1], f - i); };

// ---------------------------------------------------------------- vessel (amphora -> zoetrope drum)
const VCX = 960, VCY = 490, VH = 820, TILT = 0.13;
const VASE_K = crSample([[-0.5, 0.165], [-0.475, 0.16], [-0.445, 0.122], [-0.3, 0.118], [-0.21, 0.22], [-0.11, 0.335], [0.0, 0.375], [0.12, 0.35], [0.24, 0.27], [0.34, 0.17], [0.405, 0.105], [0.445, 0.11], [0.468, 0.17], [0.5, 0.17]], false, 8);
function tableInterp(tab, y) { if (y <= tab[0][0]) return tab[0][1]; for (let i = 1; i < tab.length; i++) if (tab[i][0] >= y) { const a = tab[i - 1], b = tab[i]; return lerp(a[1], b[1], (y - a[0]) / ((b[0] - a[0]) || 1)); } return tab[tab.length - 1][1]; }
const DRUM_K = [[-0.5, 0.4], [-0.3, 0.4], [0.08, 0.4], [0.0802, 0.03], [0.19, 0.03], [0.2, 0.2], [0.26, 0.2], [0.2601, 0.0], [0.5, 0.0]];
const rVase = y => tableInterp(VASE_K, y), rDrum = y => tableInterp(DRUM_K, y);

function cyl(R, a, y) { return [VCX + R * Math.sin(a), y + R * TILT * Math.cos(a), Math.cos(a)]; }

function drawRunnerOnCyl(c, R, ang, gy, h, ph, col, inc) {
  const ca = Math.cos(ang); if (ca < 0.06) return;
  const x = VCX + R * Math.sin(ang), y = gy + R * TILT * ca;
  const P = runPose(ph);
  drawSil(c, P, x, y - GROUND * h, h, ca, col);
  if (inc) drawIncise(c, P, x, y - GROUND * h, h, ca, inc);
}

function bandPath(R1, R2, y1, y2) {
  const p = new Path2D(); const n = 36;
  for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + Math.PI * i / n; const q = cyl(R1 * 1.04, a, y1); i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1]); }
  for (let i = n; i >= 0; i--) { const a = -Math.PI / 2 + Math.PI * i / n; const q = cyl(R2 * 1.04, a, y2); p.lineTo(q[0], q[1]); }
  p.closePath(); return p;
}
function ringLine(c, R, y, w, col) { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); for (let i = 0; i <= 40; i++) { const a = -Math.PI / 2 + Math.PI * i / 40; const q = cyl(R, a, y); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); } c.stroke(); }

const TERRA = hex('#B95F35'), TERRA_HI = hex('#D88B5C'), GLAZE = hex('#17110E'), WALNUT = hex('#4A2B18'), BRASS = hex('#C9A15A');

function drawVessel(c, t, u, R0) {
  const ytop = lerp(-0.5, -0.3, u), ybot = lerp(0.5, 0.26, u);
  const rr = y => lerp(rVase(y), rDrum(y), u) * VH;
  const Y = yn => VCY + yn * VH;
  // silhouette = union of discs
  const sil = new Path2D(); const N = 120;
  for (let i = 0; i <= N; i++) { const yn = lerp(ytop, ybot, i / N); const r = rr(yn); if (r < 0.5) continue; sil.moveTo(VCX + r, Y(yn)); sil.ellipse(VCX, Y(yn), r, r * TILT + 0.5, 0, 0, TAU); sil.closePath(); }
  // floor shadow
  c.save(); const fs = c.createRadialGradient(VCX, Y(ybot) + 6, 10, VCX, Y(ybot) + 6, 380);
  fs.addColorStop(0, 'rgba(0,0,0,0.6)'); fs.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = fs; c.beginPath(); c.ellipse(VCX, Y(ybot) + 8, 380, 60, 0, 0, TAU); c.fill(); c.restore();

  c.save(); c.clip(sil);
  const base = mixc(GLAZE, WALNUT, u);
  c.fillStyle = rgba(base); c.fillRect(0, 0, W, H);
  const decoA = 1 - u;
  const RB = rr(0.03); // frieze radius
  if (decoA > 0.01) {
    c.globalAlpha = decoA;
    const terra = rgba(TERRA);
    c.fillStyle = terra;
    c.fill(bandPath(rr(-0.24), rr(-0.105), Y(-0.24), Y(-0.105)));
    c.fill(bandPath(rr(-0.085), rr(0.155), Y(-0.085), Y(0.155)));
    c.fill(bandPath(rr(0.175), rr(0.345), Y(0.175), Y(0.345)));
    const rot0 = R0;
    // tongues on shoulder
    c.fillStyle = rgba(GLAZE);
    for (let k = 0; k < 36; k++) {
      const a = k / 36 * TAU - rot0; if (Math.cos(a) < 0.03) continue;
      const yA = -0.235, yB = -0.135; const R = rr(-0.19);
      const p1 = cyl(rr(yA), a, Y(yA)), p2 = cyl(R, a, Y(yB));
      c.beginPath(); c.ellipse((p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2, Math.max(0.5, 0.055 * R * Math.cos(a)), (p2[1] - p1[1]) / 2, 0, 0, TAU); c.fill();
    }
    ringLine(c, rr(-0.12), Y(-0.12), 4, rgba(GLAZE));
    // meander band
    const yM = 0.19, hM = 0.05, Rm = rr(0.21), unit = 0.075;
    c.strokeStyle = rgba(GLAZE); c.lineWidth = 4.5; c.lineJoin = 'miter';
    const key = [[0, 1], [0, 0], [0.8, 0], [0.8, 0.75], [0.3, 0.75], [0.3, 0.3], [0.55, 0.3], [0.55, 0.52]];
    const nU = Math.round(TAU / unit);
    for (let k = 0; k < nU; k++) {
      const a0 = k * TAU / nU - rot0;
      if (Math.cos(a0) < -0.05) continue;
      c.beginPath();
      key.forEach((q, i) => { const a = a0 + q[0] * TAU / nU; const p = cyl(Rm, a, Y(yM + q[1] * hM)); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); });
      c.stroke();
      c.beginPath(); { const p = cyl(Rm, a0, Y(yM + hM)), p2 = cyl(Rm, a0 + TAU / nU, Y(yM + hM)); c.moveTo(p[0], p[1]); c.lineTo(p2[0], p2[1]); } c.stroke();
    }
    // rays
    c.fillStyle = rgba(GLAZE);
    for (let k = 0; k < 28; k++) {
      const a = k / 28 * TAU - rot0; if (Math.cos(a) < 0.0) continue;
      const w = 0.09; const yb = 0.34, ya = 0.255;
      const b1 = cyl(rr(yb), a - w, Y(yb)), b2 = cyl(rr(yb), a + w, Y(yb)), ap = cyl(rr(ya), a, Y(ya));
      c.beginPath(); c.moveTo(b1[0], b1[1]); c.lineTo(ap[0], ap[1]); c.lineTo(b2[0], b2[1]); c.closePath(); c.fill();
    }
    ringLine(c, rr(-0.085), Y(-0.08), 4, rgba(GLAZE));
    ringLine(c, rr(0.155), Y(0.152), 5, rgba(GLAZE));
    // frieze runners
    for (let k = 0; k < 6; k++) drawRunnerOnCyl(c, RB, k * TAU / 6 - rot0, Y(0.148), 0.205 * VH, PHI(t) + k * 0.19, rgba(GLAZE), rgba(TERRA));
    c.globalAlpha = 1;
  }
  // drum furniture: brass rims
  if (u > 0.01) {
    c.globalAlpha = u;
    const Rd = rr(-0.1);
    c.fillStyle = rgba(BRASS);
    c.fill(bandPath(Rd, Rd, Y(-0.3), Y(-0.284)));
    c.fill(bandPath(Rd, Rd, Y(0.062), Y(0.082)));
    c.globalAlpha = 1;
  }
  // per-row cylindrical shading
  {
    const yA = Math.floor(Y(ytop) - 0.5 * VH * TILT), yB = Math.ceil(Y(ybot) + 0.45 * VH * TILT);
    shx.setTransform(1, 0, 0, 1, 0, 0); shx.clearRect(0, 0, W, H);
    for (let y = yA; y < yB; y += 2) {
      // radius of the widest disc whose front arc covers this row
      let yn = (y - VCY) / VH; let r = 0;
      for (let d = 0; d <= 0.06; d += 0.006) { const yy = yn - d; if (yy < ytop || yy > ybot) continue; r = Math.max(r, rr(yy)); }
      if (r < 2) continue;
      shx.drawImage(SHADE, VCX - r - 1, y, 2 * r + 2, 2);
    }
    c.drawImage(SHC, 0, 0);
  }
  c.restore();
  // lip / opening
  const rt = rr(ytop);
  c.fillStyle = rgba(mixc([12, 8, 6], [18, 11, 7], u)); c.beginPath(); c.ellipse(VCX, Y(ytop), rt * 0.93, rt * TILT * 0.93, 0, 0, TAU); c.fill();
  c.strokeStyle = rgba(mixc([60, 40, 30], BRASS, u), 0.9); c.lineWidth = lerp(3, 7, u); c.beginPath(); c.ellipse(VCX, Y(ytop), rt * 0.965, rt * TILT * 0.965, 0, 0, TAU); c.stroke();
  // handles (vase only)
  if (u < 0.99) {
    c.globalAlpha = 1 - u; c.strokeStyle = rgba(GLAZE); c.lineCap = 'round'; c.lineWidth = 20;
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(VCX + s * rr(-0.4) * 0.95, Y(-0.4)); c.bezierCurveTo(VCX + s * 0.27 * VH, Y(-0.44), VCX + s * 0.31 * VH, Y(-0.32), VCX + s * rr(-0.2) * 0.98, Y(-0.2)); c.stroke(); }
    c.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- slits -> film strip
const NS = 14, SLIT_W = 0.15, BAND_A = -0.282, BAND_B = 0.058;
function filmFrame(c, x, y, w, h, ph, look, seed) {
  // look 0 = zoetrope interior (cream paper, sepia figure); 1 = film positive (Muybridge grid)
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
  const bg = mixc([234, 218, 186], [34, 33, 31], look);
  c.fillStyle = rgba(bg); c.fillRect(x, y, w, h);
  if (look > 0.01) {
    c.globalAlpha = look * 0.5; c.strokeStyle = '#d8d4c8'; c.lineWidth = Math.max(1, w / 260);
    const step = w / 9; for (let i = 1; i < 9; i++) { c.beginPath(); c.moveTo(x + i * step, y); c.lineTo(x + i * step, y + h * 0.78); c.stroke(); }
    c.beginPath(); c.moveTo(x, y + h * 0.4); c.lineTo(x + w, y + h * 0.4); c.stroke();
    c.globalAlpha = look; c.fillStyle = '#4d4a45'; c.fillRect(x, y + h * 0.8, w, h * 0.2);
    c.globalAlpha = 1;
  }
  const fh = h * 0.78, P = runPose(ph);
  if (!STATE.noFig) drawSil(c, P, x + w * 0.5, y + h * 0.8 - GROUND * fh, fh, 1, rgba(mixc([54, 33, 20], [228, 224, 214], look)));
  c.restore();
}

// ---------------------------------------------------------------- scenes
function camera(c, F, z) { c.translate(960, 540); c.scale(z, z); c.translate(-F[0], -F[1]); }

function sceneCave(t) {
  const light = lerp(0.45, 1, sstep(0, 0.5, t));
  const push = i3(seg(t, 2.0, 2.5));
  const drift = -64 * t;
  const L = 830, BX = 1000 + drift, BY = 470;
  const legF = [BX - 0.02 * L, BY + 0.36 * L];
  const z = (1.0 + 0.03 * t) * lerp(1, 1.9, push);
  const F = [lerp(960, legF[0], push), lerp(540, legF[1], push)];
  ctx.save(); camera(ctx, F, z);
  ctx.drawImage(ROCK, -80 + drift, -90, 2200, 1240);
  // hand stencils
  const hands = [[400, 310, -0.35, 1.25, -1], [1540, 270, 0.3, 1.1, 0.5], [1600, 760, -0.1, 1.0, 1.0]];
  ctx.save();
  hands.forEach(([hx, hy, a, s, ts], i) => {
    const p = seg(t, ts, ts + 0.22); if (p <= 0) return;
    const e = o3(p); ctx.save(); ctx.globalAlpha = e * 0.88; ctx.translate(hx + drift, hy); ctx.rotate(a); const sc = s * lerp(1.12, 1, e); ctx.scale(sc, sc); ctx.drawImage(HANDS[i], -190, -190); ctx.restore();
  });
  ctx.restore();
  // bison
  const g = t < 1.35 ? 0 : t < 1.65 ? (t - 1.35) ** 2 / 0.6 : (t - 1.65) + 0.15;
  const ph = 0.15 + 1.5 * g;
  const rv = { out: o3(seg(t, 0.72, 1.4)), leg: o3(seg(t, 1.05, 1.4)), fill: o3(seg(t, 1.25, 1.7)), det: o3(seg(t, 1.2, 1.5)) };
  drawBison(ctx, BX, BY, L, ph, sstep(1.35, 1.7, t), rv, 'cave');
  ctx.restore();
  // firelight
  const fl = 0.86 + 0.07 * Math.sin(t * 13.1) + 0.05 * Math.sin(t * 23.7 + 1) + 0.04 * Math.sin(t * 7.3 + 2);
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  const lg = ctx.createRadialGradient(820, 1060, 60, 900, 760, 1450 * fl);
  lg.addColorStop(0, 'rgb(255,230,190)'); lg.addColorStop(0.45, 'rgb(236,184,132)'); lg.addColorStop(0.78, 'rgb(130,84,54)'); lg.addColorStop(1, 'rgb(40,26,18)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'screen';
  const sg = ctx.createRadialGradient(480, 1100, 0, 480, 1100, 700);
  sg.addColorStop(0, `rgba(255,150,60,${0.22 * fl})`); sg.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  // terracotta warming before the cut
  if (push > 0) { ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(214,120,72,${0.6 * push})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  if (light < 1) { ctx.fillStyle = rgba(INK, 1 - light); ctx.fillRect(0, 0, W, H); }
}

function museumBg(c, warm, cool) {
  c.fillStyle = rgba(INK); c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(900, 420, 40, 960, 520, 1100);
  g.addColorStop(0, rgba(warm)); g.addColorStop(0.55, rgba(mixc(warm, INK, 0.65))); g.addColorStop(1, rgba(cool));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

function sceneVessel(t) {
  // 2.5 .. 7.6 : amphora -> zoetrope -> film strip
  const u = io3(seg(t, 4.35, 4.75));           // vase -> drum
  const v = io3(seg(t, 6.05, 6.65));         // drum -> flat film
  const R0 = rot(t);
  const reveal = oExpo(seg(t, 2.5, 3.35));

      const k = oExpo(seg(t, 16.08 + (5 - i) * 0.035, 16.48 + (5 - i) * 0.035));
      const [sx, sh] = SLOTS[i];
      const X = lerp(sx - 240, sx, k);
      const gy = LINE_Y(X);
      const glowCol = [[200, 110, 60], [185, 95, 53], [201, 161, 90], [200, 200, 196], [120, 200, 240], [91, 79, 196]][i];
      const gg = ctx.createRadialGradient(X, gy, 0, X, gy, sh * 0.9);
      gg.addColorStop(0, rgba(glowCol, 0.22 * k)); gg.addColorStop(1, rgba(glowCol, 0));
      ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(X, gy, sh * 0.9, sh * 0.22, 0, 0, TAU); ctx.fill();
      eraFigure(ctx, i, X, gy, sh * lerp(0.9, 1, k), PHI(t), k * (0.84 + 0.16 * i / 5), t);
    }
  }
}

// ---------------------------------------------------------------- timeline + year labels
const ERAS = [
  { y: '30,000 BC', f: '400 38px "Libre Baskerville", serif', ls: '2px', s: 0 },
  { y: '500 BC', f: '400 40px "Tenor Sans", sans-serif', ls: '6px', s: 2.5 },
  { y: '1834', f: '400 44px "Bodoni Moda", serif', ls: '3px', s: 4.5 },
  { y: '1895', f: 'italic 400 44px "Playfair Display", serif', ls: '2px', s: 6.5 },
  { y: '1951', f: '500 40px Jost, sans-serif', ls: '4px', s: 8.5 },
  { y: '1980', f: 'pixel', ls: '0px', s: 10.5 },  // drawn by pixelFont(), digits 0, 1, 8, 9 only
  { y: '2026', f: '400 38px "JetBrains Mono", monospace', ls: '2px', s: 12.5 },
];
const BOUNDS = [2.5, 4.5, 6.5, 8.5, 10.5, 12.5];
const SPAN = 2100;
const travel = t => BOUNDS.reduce((s, b) => s + io4(seg(t, b - 0.24, b + 0.26)), 0);
function labelX(i, t) { return 136 + SPAN * (i - travel(t)) - 14 * (t - ERAS[i].s); }

function drawTimeline(t) {
  const fin = io3(seg(t, 16.0, 16.45));
  const yL = lerp(996, LINE_Y(80), fin), yR = lerp(996, LINE_Y(1840), fin);
  const xL = lerp(0, 80, fin), xR = lerp(W, 1840, fin);
  const ly = x => lerp(yL, yR, (x - xL) / (xR - xL));
  const dt = 1 / 60, vel = Math.abs(travel(t) - travel(t - dt)) * SPAN / dt;
  const blur = clamp(vel / 2500);
  ctx.save();
  ctx.strokeStyle = rgba(IVORY, 0.55); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(xL, yL); ctx.lineTo(xR, yR); ctx.stroke();
  // ticks
  const pos = travel(t) * SPAN + 14 * t + (fin > 0 ? 0 : 0);
  const sp = 24;
  const ang = Math.atan2(yR - yL, xR - xL);
  ctx.strokeStyle = rgba(IVORY, 0.4 * (1 - 0.8 * blur)); ctx.lineWidth = 1.5;
  for (let k = -2; k < W / sp + 4; k++) {
    const wx = k * sp - (pos % sp) + (pos < 0 ? 0 : 0);
    const x = lerp(wx, xL + (wx / W) * (xR - xL), fin);
    if (x < xL || x > xR) continue;
    const idx = Math.round((wx + pos) / sp);
    const len = idx % 5 === 0 ? 14 : 7;
    const y = ly(x);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.sin(ang) * len * 0, y + len); ctx.stroke();
  }
  // labels
  ERAS.forEach((e, i) => {
    let x = labelX(i, t);
    let la = 1;
    if (i === 6) { const out = sstep(15.85, 15.98, t), back = sstep(16.3, 16.5, t); la = out > 0 && back < 1 ? Math.max(1 - out, back) : 1; if (out >= 1 || t > 15.98) x = 1612; }
    if (x < -420 || x > W + 60) return;
    const vxs = (labelX(i, t) - labelX(i, t - dt)) / dt;
    const fl = i === 6 && t > 15.98 ? 1 : 0;
    const yb = fl ? 960 + 12 * (1 - sstep(16.3, 16.55, t)) : 964;
    const yLine = fl ? ly(x - 22) : 996;
    // anchor tick
    ctx.globalAlpha = la; ctx.strokeStyle = rgba(IVORY, 0.95); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 22, yLine - (fl ? -4 : 26)); ctx.lineTo(x - 22, fl ? yb - 30 : yLine + 14); ctx.stroke();
    ctx.fillStyle = rgba(IVORY); ctx.beginPath(); ctx.arc(x - 22, yLine, 4.5, 0, TAU); ctx.fill();
    const ghosts = Math.abs(vxs) > 300 ? 3 : 0;
    for (let g = ghosts; g >= 0; g--) {
      const gx = x + vxs * g * 0.006;
      ctx.globalAlpha = la * (g === 0 ? 1 : 0.1 / (g * g));
      if (e.f === 'pixel') pixelFont(ctx, e.y, gx, yb - 35, 5, rgba(IVORY));
      else { ctx.font = e.f; try { ctx.letterSpacing = e.ls; } catch (_) { } ctx.fillStyle = rgba(IVORY); ctx.textBaseline = 'alphabetic'; ctx.fillText(e.y, gx, yb); }
    }
    ctx.globalAlpha = 1; try { ctx.letterSpacing = '0px'; } catch (_) { }
  });
  ctx.restore();
}

// ---------------------------------------------------------------- frame
const FGRAIN = [0, 1, 2, 3].map(k => {
  const w = 960, h = 540, c = mk(w, h), x = c.getContext('2d'), im = x.createImageData(w, h), d = im.data, r = rng(2000 + k);
  for (let i = 0; i < w * h; i++) { const v = r() + r() - 1; const on = v > 0 ? 255 : 0; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = on; d[i * 4 + 3] = Math.abs(v) * 200; }
  x.putImageData(im, 0, 0); return c;
});
function grainAndVignette(t, amt) {
  const fr = Math.floor(t * 30);
  ctx.save(); ctx.globalAlpha = amt * 0.75;
  const gi = FGRAIN[fr % 4]; const ox = (hash2(fr, 0, 5) * 200) | 0, oy = (hash2(fr, 1, 5) * 120) | 0;
  ctx.drawImage(gi, -ox, -oy, W * 1.25, H * 1.25);
  ctx.restore();
  const vg = ctx.createRadialGradient(960, 540, 420, 960, 560, 1250);
  vg.addColorStop(0, 'rgba(10,8,6,0)'); vg.addColorStop(1, 'rgba(10,8,6,0.72)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

let lastPix = null;
function draw(t) {
  t = clamp(t, 0, DUR - 1e-4);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = rgba(INK); ctx.fillRect(0, 0, W, H);
  let grain = 0.14;
  for (const k in STATE) delete STATE[k];
  STATE.noFig = false;
  if (t < 2.5) { sceneCave(t); grain = 0.16; }
  else if (t < 7.6) {
    const cam = sceneVessel(t);
    if (t >= 7.0) {
      const k = sstep(7.0, 7.45, t);
      ctx.fillStyle = rgba([10, 9, 8], k); ctx.fillRect(0, 0, W, H);
      sceneFilm(t, cam);
    }
    grain = t > 6.5 ? 0.2 : 0.12;
  }
  else if (t < 8.3) { ctx.fillStyle = 'rgb(10,9,8)'; ctx.fillRect(0, 0, W, H); sceneFilm(t, null); grain = 0.22; }
  else if (t < 10.25) {
    ctx.fillStyle = 'rgb(10,9,8)'; ctx.fillRect(0, 0, W, H);
    if (t < 8.75) sceneFilm(t, null);
    tvPush(t); sceneTV(t); ctx.setTransform(1, 0, 0, 1, 0, 0); grain = 0.14;
  }
  else if (t < 12.25) {
    // pixelate the TV, then the 8-bit world
    const k = seg(t, 10.25, 10.5);
    if (k < 1) {
      b2.setTransform(1, 0, 0, 1, 0, 0); b2.fillStyle = 'rgb(10,9,8)'; b2.fillRect(0, 0, W, H);
      const save = ctx; // render TV into BUF2 through a temporary swap
      ctx.save(); ctx.fillStyle = 'rgb(10,9,8)'; ctx.fillRect(0, 0, W, H); tvPush(t); sceneTV(t); ctx.restore();
      const b = Math.min(CELL, Math.pow(2, Math.floor(k * 4.999)));
      const sw = Math.ceil(W / b), sh = Math.ceil(H / b);
      b2.imageSmoothingEnabled = true; b2.drawImage(cv, 0, 0, sw, sh);
      ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(BUF2, 0, 0, sw, sh, 0, 0, sw * b, sh * b); ctx.restore();
      const wa = t >= 10.5 ? 1 : 0;
      if (wa > 0) { ctx.save(); ctx.globalAlpha = wa; scenePixel(t); ctx.restore(); }
    } else { lastPix = scenePixel(t); }
    grain = 0.08;
  }
  else {
    // pixel world dissolves to ink, sprite flies into the cursor
    const cells0 = spriteCells(Math.floor(PHI(12.25) * 8) / 8, SPR_H);
    if (t < 12.65) {
      pixelWorld(t);
      const k = seg(t, 12.22, 12.6);
      px.fillStyle = rgba(INK);
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (hash2(x, y, 91) < k * 1.05) px.fillRect(x, y, 1, 1);
      ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(PXC, 0, 0, GW * CELL, GH * CELL); ctx.restore();
      ctx.fillStyle = rgba(INK, sstep(12.45, 12.65, t)); ctx.fillRect(0, 0, W, H);
      sceneCodeOverlay(t, cells0);
    } else sceneCode(t, null);
    grain = 0.1;
  }

  ctx = FG; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.clearRect(0, 0, W, H);
  let punch = 0;
  for (const b of BOUNDS.concat([14.0])) { const d = t - b; if (d >= 0 && d < 0.35) punch = Math.max(punch, 1 - d / 0.35); }
  if (punch > 0) { ctx.save(); ctx.fillStyle = `rgba(255,236,210,${0.07 * punch * punch})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  grainAndVignette(t, grain);
  drawTimeline(t);
  ctx = BG;
}
function sceneCodeOverlay(t, cells) {
  const lay = codeLayout(t);
  const k = seg(t, 12.25, 12.62);
  cells.forEach(([x, y, on], i) => {
    if (!on) return;
    const sx = (SPR_COL + x) * CELL, sy = (GROUND_ROW + y) * CELL;
    const d = clamp(k * 1.5 - hash2(i, 0, 81) * 0.5);
    const e = i3(d);
    const tx = lay.x0 + 4 * lay.s, ty = lay.base - 48 * lay.s;
    const s = lerp(CELL, 14, e);
    ctx.fillStyle = rgba(IVORY, 1);
    ctx.fillRect(lerp(sx, tx + 18, e), lerp(sy, ty + 38, e), s, s);
  });
  if (t > 12.58) { ctx.fillStyle = rgba(IVORY, 0.9); ctx.fillRect(lay.x0 + 4 * lay.s, lay.base - 48 * lay.s, 34 * lay.s, 60 * lay.s); }
}

// ---------------------------------------------------------------- timeline
const tl = gsap.timeline({ paused: true });
const proxy = { t: 0 };
tl.to(proxy, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => draw(proxy.t) }, 0);
window.__timelines = window.__timelines || {};
window.__timelines['main'] = tl;
['400 40px "Libre Baskerville"', '400 40px "Tenor Sans"', '400 40px "Bodoni Moda"', 'italic 400 40px "Playfair Display"', '500 40px Jost', '400 40px "JetBrains Mono"'].forEach(f => { try { document.fonts.load(f); } catch (_) {} });
draw(0);
})();
