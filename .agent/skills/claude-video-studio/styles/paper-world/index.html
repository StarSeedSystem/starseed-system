<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f2e8d5; }
      #root { position: relative; width: 1920px; height: 1080px; }
      #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <canvas id="stage" class="clip" width="1920" height="1080" data-start="0" data-duration="14" data-track-index="0"></canvas>
    </div>
    <script>
    /*
     * Cut-paper world. 14 s, 1920x1080, one canvas drawn as a pure function of time.
     * A pop-up landscape builds sheet by sheet, the day turns to dusk, the camera pushes in on a paper boat.
     * Beat map (120 BPM, a hit every 0.5 s):
     *   0.0 to 4.0  far range, hills, sun, meadow with river cut, banks, clouds land one per beat
     *   4.0         paper boat bobs up, ripple ring, camera push starts
     *   4.6 to 9.0  light shifts morning > golden > dusk; stars 7.0 to 8.5, rose pennant 7.85
     *   10.4 to 14  slow close-in on the boat, ripple rings at 10.75, 11.0, 11.5
     * Change colours in P (palette) below. All light keys are mixed from those six tones + the rose accent.
     * No words on screen. Geometry is seeded, so changing a seed gives a new hand-cut edge.
     */
    (function () {
      const W = 1920, H = 1080, DUR = 14;
      const cv = document.getElementById('stage');
      let ctx = cv.getContext('2d');

      // ---------- deterministic helpers ----------
      function rng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function noise1(seed) { const r = rng(seed), N = 1024, v = new Float32Array(N); for (let i = 0; i < N; i++) v[i] = r() * 2 - 1; return function (x) { const i = Math.floor(x), f = x - i, a = v[((i % N) + N) % N], b = v[(((i + 1) % N) + N) % N], s = f * f * (3 - 2 * f); return a + (b - a) * s; }; }
      function hash2(x, y, s) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
      function vnoise(x, y, s, per) { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi; const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy); const m = a => ((a % per) + per) % per; const a = hash2(m(xi), m(yi), s), b = hash2(m(xi + 1), m(yi), s), c = hash2(m(xi), m(yi + 1), s), d = hash2(m(xi + 1), m(yi + 1), s); return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy; }
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const g = (x, c, w) => Math.exp(-((x - c) / w) * ((x - c) / w));
      const ss = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
      const EC = {}; const ease = n => EC[n] || (EC[n] = gsap.parseEase(n));
      function tw(t, s, d, e) { if (t <= s) return 0; if (t >= s + d) return 1; return ease(e || 'none')((t - s) / d); }

      // ---------- colour: change these six paper tones + the rose accent ----------
      const P = { cream: '#F2E8D5', sand: '#E3CBA8', sage: '#9CB49A', dsage: '#5E7F6A', teal: '#2F5D62', rose: '#D98C7A', ink: '#2B2B2B' };
      for (const k in P) { const h = P[k]; P[k] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
      const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
      const css = (c, a) => 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + (a === undefined ? 1 : a) + ')';
      let LT = 0; // 0 morning, 1 golden, 2 dusk
      const lit = k => LT <= 1 ? mix(k[0], k[1], LT) : mix(k[1], k[2], LT - 1);
      const C = {
        skyTop: [mix(P.cream, P.sage, 0.32), mix(P.rose, P.sand, 0.45), mix(P.rose, P.teal, 0.34)],
        skyMid: [mix(P.cream, P.sage, 0.16), mix(P.sand, P.cream, 0.25), mix(P.rose, P.sand, 0.12)],
        skyBot: [mix(P.cream, P.sage, 0.08), mix(P.cream, P.sand, 0.35), mix(P.cream, P.sand, 0.45)],
        far: [mix(P.sage, P.cream, 0.6), mix(P.sand, P.rose, 0.3), mix(P.rose, P.sand, 0.15)],
        back: [mix(P.sage, P.cream, 0.3), mix(P.sage, P.sand, 0.5), mix(P.rose, P.dsage, 0.5)],
        mid: [mix(P.sage, P.dsage, 0.12), mix(mix(P.sage, P.dsage, 0.25), P.sand, 0.2), mix(P.dsage, P.rose, 0.22)],
        floor: [mix(P.sage, P.dsage, 0.45), mix(P.dsage, P.sand, 0.2), mix(P.dsage, P.rose, 0.3)],
        floorFar: [mix(P.sage, P.cream, 0.12), mix(P.sage, P.sand, 0.45), mix(mix(P.rose, P.sand, 0.35), P.dsage, 0.18)],
        nearF: [mix(P.sage, P.dsage, 0.62), mix(P.dsage, P.sand, 0.12), mix(P.dsage, P.teal, 0.2)],
        nearB: [mix(P.dsage, P.teal, 0.2), mix(P.dsage, P.teal, 0.35), mix(P.teal, P.dsage, 0.3)],
        water: [mix(P.teal, P.sage, 0.3), P.teal, mix(P.teal, P.rose, 0.22)],
        waterFar: [mix(P.sage, P.cream, 0.35), mix(P.sand, P.teal, 0.25), mix(P.rose, P.sand, 0.2)],
        strip: [mix(P.cream, P.sage, 0.25), mix(P.cream, P.sand, 0.4), mix(P.rose, P.cream, 0.35)],
        bank: [P.dsage, mix(P.dsage, P.teal, 0.35), mix(P.teal, P.ink, 0.35)],
        fern: [P.teal, mix(P.teal, P.ink, 0.25), mix(P.teal, P.ink, 0.6)],
        treeBack: [mix(P.sage, P.dsage, 0.45), mix(P.dsage, P.sand, 0.2), mix(P.dsage, P.rose, 0.3)],
        treeMid: [P.dsage, mix(P.dsage, P.teal, 0.3), mix(P.teal, P.rose, 0.12)],
        treeBank: [P.teal, mix(P.teal, P.dsage, 0.2), mix(P.teal, P.ink, 0.5)],
        cloud: [P.cream, mix(P.cream, P.sand, 0.45), mix(P.rose, P.cream, 0.5)],
        sun0: [P.sand, mix(P.sand, P.rose, 0.35), P.rose],
        sun1: [mix(P.sand, P.cream, 0.5), P.sand, mix(P.rose, P.sand, 0.45)],
        sun2: [P.cream, mix(P.cream, P.sand, 0.35), mix(P.cream, P.rose, 0.3)],
        hullL: [P.cream, mix(P.cream, P.sand, 0.25), mix(P.cream, P.rose, 0.25)],
        hullD: [P.sand, mix(P.sand, P.rose, 0.2), mix(P.rose, P.sand, 0.3)],
        hullF: [mix(P.sand, P.dsage, 0.18), mix(P.sand, P.rose, 0.35), mix(P.rose, P.ink, 0.15)],
        bird: [P.ink, P.ink, mix(P.ink, P.teal, 0.2)],
        rimT: [P.cream, mix(P.cream, P.sand, 0.4), mix(P.rose, P.cream, 0.25)]
      };
      let RIMA = 0.4;

      // ---------- grain tile (procedural paper) ----------
      const GT = 768;
      const grainC = document.createElement('canvas'); grainC.width = GT; grainC.height = GT;
      (function () {
        const x = grainC.getContext('2d'); const id = x.createImageData(GT, GT); const d = id.data;
        for (let j = 0; j < GT; j++) for (let i = 0; i < GT; i++) {
          let v = (hash2(i, j, 11) - 0.5) * 0.75 + (vnoise(i / 48, j / 48, 2, GT / 48) - 0.5) * 0.3 + (vnoise(i / 12, j / 12, 3, GT / 12) - 0.5) * 0.22 + (vnoise(i / 3, j / 3, 5, GT / 3) - 0.5) * 0.3;
          const o = (j * GT + i) * 4, c = v > 0 ? 255 : 0;
          d[o] = c; d[o + 1] = c; d[o + 2] = c; d[o + 3] = Math.min(255, Math.abs(v) * 78);
        }
        x.putImageData(id, 0, 0);
        const r = rng(77);
        for (let k = 0; k < 420; k++) {
          const sx = 20 + r() * (GT - 40), sy = 20 + r() * (GT - 40), a = r() * 6.283, l = 6 + r() * 22;
          x.strokeStyle = r() < 0.6 ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.10)'; x.lineWidth = 0.6 + r() * 0.7;
          x.beginPath(); x.moveTo(sx, sy); x.quadraticCurveTo(sx + Math.cos(a + 0.6) * l * 0.6, sy + Math.sin(a + 0.6) * l * 0.6, sx + Math.cos(a) * l, sy + Math.sin(a) * l); x.stroke();
        }
      })();
      let grain = ctx.createPattern(grainC, 'repeat');

      // ---------- hand-cut geometry ----------
      function cut(pts, seed, step, amp, wob) {
        step = step || 12; amp = amp === undefined ? 1.1 : amp; wob = wob === undefined ? 2.2 : wob;
        const r = rng(seed), nz = noise1(seed + 7), n = pts.length, L = [0];
        for (let i = 1; i <= n; i++) { const a = pts[i - 1], b = pts[i % n]; L.push(L[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
        const tot = L[n], out = []; let s = 0, j = 0;
        while (s < tot) {
          while (L[j + 1] < s) j++;
          const a = pts[j], b = pts[(j + 1) % n], f = (s - L[j]) / ((L[j + 1] - L[j]) || 1);
          const dx = b[0] - a[0], dy = b[1] - a[1], dl = Math.hypot(dx, dy) || 1;
          const d = nz(s / 70) * wob + (r() - 0.5) * amp * 2;
          out.push([a[0] + dx * f - dy / dl * d, a[1] + dy * f + dx / dl * d]);
          s += step * (0.5 + r());
        }
        return out;
      }
      function toPath(pts, p) { p = p || new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
      function bbox(pts) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const q of pts) { a = Math.min(a, q[0]); b = Math.min(b, q[1]); c = Math.max(c, q[0]); d = Math.max(d, q[1]); } return [a, b, c, d]; }
      function ridge(fn, x0, x1, bot) { const p = []; for (let x = x0; x <= x1; x += 4) p.push([x, fn(x)]); p.push([x1, bot]); p.push([x0, bot]); return p; }
      function circ(cx, cy, r, n) { const p = []; n = n || 120; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return p; }
      function shadowOf(path, bb, blur, rule) {
        const S = 0.5, pad = blur * 3, w = bb[2] - bb[0] + pad * 2, h = bb[3] - bb[1] + pad * 2;
        const c = document.createElement('canvas'); c.width = Math.ceil(w * S); c.height = Math.ceil(h * S);
        const x = c.getContext('2d'); x.filter = 'blur(' + (blur * S) + 'px)';
        x.setTransform(S, 0, 0, S, (pad - bb[0]) * S, (pad - bb[1]) * S); x.fillStyle = '#000'; x.fill(path, rule || 'nonzero');
        return { c: c, x0: bb[0] - pad, y0: bb[1] - pad, w: w, h: h };
      }

      const X0 = -460, X1 = 2380, BOT = 1720;
      const farFn = x => 440 + 22 * Math.sin(x / 210 + 1) - 120 * g(x, 520, 230) - 165 * g(x, 1180, 250) - 80 * g(x, 1760, 210) - 50 * g(x, -100, 200);
      const backFn = x => 525 + 16 * Math.sin(x / 170) - 85 * g(x, 240, 290) - 55 * g(x, 960, 240) - 95 * g(x, 1620, 270);
      const midFn = x => 594 + 10 * Math.sin(x / 130 + 2) - 58 * g(x, 560, 250) - 70 * g(x, 1380, 230) - 24 * g(x, 2000, 200);
      const floorFn = x => 640 + 7 * Math.sin(x / 240) - 22 * g(x, 1720, 300) - 16 * g(x, 200, 260);
      const leftFn = x => 800 - 70 * g(x, -150, 300) + 960 * Math.pow(ss((x - 180) / 820), 1.6);
      const rightFn = x => 846 - 60 * g(x, 2160, 300) + 960 * Math.pow(ss((1840 - x) / 700), 1.6);

      function sheetLayer(pts, seed, col, par, extra) {
        const c = cut(pts, seed, 13, 1.2, 2.4); const p = toPath(c); const bb = bbox(c);
        return Object.assign({ p: p, bb: bb, col: col, par: par, s1: shadowOf(p, bb, 22), s2: shadowOf(p, bb, 5), gx: seed * 37 % GT, gy: seed * 91 % GT }, extra || {});
      }
      const L = {};
      L.far = sheetLayer(ridge(farFn, X0, X1, BOT), 101, C.far, 0.22);
      L.back = sheetLayer(ridge(backFn, X0, X1, BOT), 202, C.back, 0.36);
      L.mid = sheetLayer(ridge(midFn, X0, X1, BOT), 303, C.mid, 0.5);
      L.left = sheetLayer(ridge(leftFn, X0, 1020, BOT), 505, C.bank, 0.92, { grad: [760, 1150] });
      L.right = sheetLayer(ridge(rightFn, 1000, X1, BOT), 606, C.bank, 0.92, { grad: [780, 1150] });

      // ---------- river ----------
      const RC = [[905, 648], [938, 664], [902, 689], [822, 714], [778, 750], [826, 792], [956, 834], [1096, 878], [1168, 934], [1160, 1010], [1092, 1120], [1012, 1300], [960, 1500], [940, 1760]];
      const CL = []; // dense centreline
      for (let i = 0; i < RC.length - 1; i++) {
        const p0 = RC[Math.max(0, i - 1)], p1 = RC[i], p2 = RC[i + 1], p3 = RC[Math.min(RC.length - 1, i + 2)];
        for (let s = 0; s < 1; s += 1 / 40) {
          const s2 = s * s, s3 = s2 * s;
          const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * s + (2 * a - 5 * b + 4 * c - d) * s2 + (-a + 3 * b - 3 * c + d) * s3);
          CL.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
        }
      }
      CL.push(RC[RC.length - 1]);
      const CLs = [0]; for (let i = 1; i < CL.length; i++) CLs.push(CLs[i - 1] + Math.hypot(CL[i][0] - CL[i - 1][0], CL[i][1] - CL[i - 1][1]));
      const CLT = CLs[CLs.length - 1];
      const rw = y => Math.max(1, 0.72 * (y - 642));
      function onRiver(s) { // s = arc length
        s = clamp(s, 0, CLT - 0.01); let i = 0; while (CLs[i + 1] < s) i++;
        const a = CL[i], b = CL[i + 1], f = (s - CLs[i]) / ((CLs[i + 1] - CLs[i]) || 1);
        const dx = b[0] - a[0], dy = b[1] - a[1], dl = Math.hypot(dx, dy) || 1;
        return { x: a[0] + dx * f, y: a[1] + dy * f, tx: dx / dl, ty: dy / dl };
      }
      function arcAtY(y) { for (let i = 0; i < CL.length; i++) if (CL[i][1] >= y && i > 20) return CLs[i]; return CLT; }
      function riverOutline(extra) {
        const Lp = [], Rp = [];
        for (let s = 0; s < CLT; s += 6) {
          const q = onRiver(s), w = rw(q.y) / 2 + extra * ss((q.y - 648) / 30);
          const nx = -q.ty, ny = q.tx;
          Lp.push([q.x + nx * w, q.y + ny * w * 0.42]); Rp.push([q.x - nx * w, q.y - ny * w * 0.42]);
        }
        return Lp.concat(Rp.reverse());
      }
      const riverPts = cut(riverOutline(0), 404, 10, 1.0, 2.0);
      const waterPts = cut(riverOutline(16), 405, 14, 1.0, 2.0);
      const floorPts = cut(ridge(floorFn, X0, X1, BOT), 406, 13, 1.2, 2.4);
      const floorPath = toPath(floorPts); toPath(riverPts, floorPath);
      L.floor = { p: floorPath, rule: 'evenodd', bb: bbox(floorPts), col: C.floor, par: 0.72, gx: 300, gy: 120 };
      L.floor.s1 = shadowOf(floorPath, L.floor.bb, 22, 'evenodd'); L.floor.s2 = shadowOf(floorPath, L.floor.bb, 5, 'evenodd');
      const nearFn = x => 806 + 16 * Math.sin(x / 260 + 1) - 46 * g(x, 360, 280) - 40 * g(x, 1560, 320) + 10 * g(x, 960, 200);
      const nearPts = cut(ridge(nearFn, X0, X1, BOT), 407, 13, 1.2, 2.4);
      const nearPath = new Path2D();
      (function () { // two sheets that meet the river banks, so the hole never crosses the ridge
        const Lp = [], Rp = [];
        for (let s = 0; s < CLT; s += 6) { const q = onRiver(s), w = rw(q.y) / 2 - 2, nx = -q.ty, ny = q.tx; Lp.push([q.x + nx * w, q.y + ny * w * 0.42]); Rp.push([q.x - nx * w, q.y - ny * w * 0.42]); }
        const iL = Lp.findIndex(p => p[1] > nearFn(p[0]) + 6), iR = Rp.findIndex(p => p[1] > nearFn(p[0]) + 6);
        const left = []; for (let x = X0; x < Lp[iL][0]; x += 4) left.push([x, nearFn(x)]);
        for (let i = iL; i < Lp.length; i++) left.push(Lp[i]); left.push([X0, BOT + 80]);
        const right = []; for (let i = Rp.length - 1; i >= iR; i--) right.push(Rp[i]);
        for (let x = Rp[iR][0] + 4; x <= X1; x += 4) right.push([x, nearFn(x)]); right.push([X1, BOT + 80]);
        toPath(cut(left, 408, 13, 1.2, 2.4), nearPath); toPath(cut(right, 409, 13, 1.2, 2.4), nearPath);
      })();
      L.near = { p: nearPath, rule: 'nonzero', bb: bbox(nearPts), col: C.floor, par: 0.72, gx: 520, gy: 260 };
      L.near.s1 = shadowOf(nearPath, L.near.bb, 22); L.near.s2 = shadowOf(nearPath, L.near.bb, 5);
      const wp = toPath(waterPts);
      L.water = { p: wp, bb: bbox(waterPts), col: C.water, par: 0.72, gx: 40, gy: 500 };

      // ---------- trees ----------
      function treeShape(type, h, seed) {
        const p = new Path2D(); const r = rng(seed);
        const tw_ = Math.max(3, h * 0.07);
        toPath(cut([[-tw_ / 2, 4], [tw_ / 2, 4], [tw_ / 2, -h * 0.3], [-tw_ / 2, -h * 0.3]], seed, 6, 0.4, 0.6), p);
        if (type === 0) { // pine
          for (let i = 0; i < 3; i++) { const b = -h * (0.16 + 0.24 * i), a = b - h * 0.44, hw = h * (0.27 - 0.055 * i) * (0.9 + r() * 0.2); toPath(cut([[-hw, b], [hw, b], [r() * 2 - 1, a]], seed + i * 13, 7, 0.5, 0.8), p); }
        } else if (type === 1) { // round
          toPath(cut(circ(0, -h * 0.62, h * 0.33, 60), seed + 3, 7, 0.5, 1.0), p);
        } else { // poplar
          const e = []; for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2; e.push([Math.cos(a) * h * 0.17, -h * 0.56 + Math.sin(a) * h * 0.42]); } toPath(cut(e, seed + 5, 7, 0.5, 0.9), p);
        }
        return p;
      }
      function makeTrees(list, fn, col, seed, sink) {
        const r = rng(seed);
        return list.map((d, i) => ({ x: d[0], h: d[1], y: fn(d[0]) + d[1] * sink, p: treeShape(d[2], d[1], seed + i * 31), col: col, delay: i * 0.045 + r() * 0.04 }));
      }
      const T = {};
      T.back = makeTrees([[70, 44, 2], [130, 36, 0], [205, 50, 2], [890, 38, 1], [1000, 46, 0], [1060, 34, 2], [1540, 48, 0], [1610, 40, 2], [1690, 54, 0], [1800, 36, 1]], backFn, C.treeBack, 900, 0.14);
      T.mid = makeTrees([[360, 70, 0], [430, 92, 0], [505, 64, 2], [640, 80, 1], [1230, 74, 2], [1300, 98, 0], [1372, 70, 0], [1500, 86, 1], [1620, 66, 2], [1880, 90, 0], [1950, 72, 0]], midFn, C.treeMid, 1200, 0.12);
      T.left = makeTrees([[-90, 250, 0], [40, 300, 0], [170, 220, 2], [300, 170, 0]], leftFn, C.treeBank, 1500, 0.1);
      T.right = makeTrees([[1650, 200, 2], [1760, 260, 0], [1880, 310, 0], [2020, 230, 2]], rightFn, C.treeBank, 1600, 0.1);

      // ---------- clouds ----------
      function cloudShape(cx, base, s, circles, seed) {
        const cs = circles.map(c => [cx + c[0] * s, base - c[2] * s * 0.55 + c[1] * s, c[2] * s]);
        let xa = 1e9, xb = -1e9; for (const c of cs) { xa = Math.min(xa, c[0] - c[2]); xb = Math.max(xb, c[0] + c[2]); }
        const top = [], bot = [];
        for (let x = xa + 1; x < xb - 1; x += 3) {

          ctx.save(); ctx.clip(L.water.p);
          ctx.lineCap = 'round';
          const sc = lit(C.strip);
          // sun glint column on the water at dusk
          for (const st of STRIPS) {
            const a = (st.ph + t * st.sp) % 1;
            const s = Math.pow(a, 1.35) * CLT * 0.86;
            const q = onRiver(s); const w = rw(q.y);
            const nx = -q.ty, ny = q.tx;
            const cx = q.x + nx * w * 0.5 * st.lat, cy = q.y + ny * w * 0.5 * st.lat * 0.42;
            const hl = w * st.len, th = Math.max(1.2, w * 0.026);
            ctx.globalAlpha = Math.sin(Math.PI * a) * 0.85;
            ctx.strokeStyle = css(sc); ctx.lineWidth = th;
            ctx.beginPath(); ctx.moveTo(cx - hl, cy); ctx.quadraticCurveTo(cx, cy - th * 1.2, cx + hl, cy); ctx.stroke();
          }
          ctx.globalAlpha = 1;
          if (bs) {
            // wake: two trailing paper strips behind the boat
            for (let i = 1; i <= 6; i++) {
              const q = onRiver(bs.s - i * bs.bw * 0.32 - ((t * 40) % (bs.bw * 0.32)));
              const w = rw(q.y), nx = -q.ty, ny = q.tx, spread = bs.bw * (0.22 + i * 0.09);
              ctx.globalAlpha = bs.vel * 0.75 * (1 - i / 7) * bs.o; ctx.strokeStyle = css(sc); ctx.lineWidth = Math.max(1.2, w * 0.022);
              for (const sd of [-1, 1]) { const cx = q.x + nx * spread * sd, cy = q.y + ny * spread * sd * 0.42; ctx.beginPath(); ctx.moveTo(cx - w * 0.06, cy); ctx.lineTo(cx + w * 0.06, cy); ctx.stroke(); }
            }
            for (const rt of [4.05, 10.75, 11.0, 11.5]) {
              if (t < rt || t > rt + 1.5) continue;
              const q = (t - rt) / 1.5, e = ease('power2.out')(q);
              const rx = bs.bw * (0.5 + 0.9 * e);
              ctx.globalAlpha = (1 - q) * 0.9; ctx.strokeStyle = css(sc); ctx.lineWidth = Math.max(1.5, bs.bw * 0.022 * (1 - q * 0.6));
              ctx.beginPath(); ctx.ellipse(bs.x, bs.y + bs.bw * 0.02, rx, rx * 0.26, 0, 0, Math.PI * 2); ctx.stroke();
            }
            ctx.globalAlpha = 0.34 * bs.o;
            const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
            rg.addColorStop(0, css(P.ink, 0.9)); rg.addColorStop(1, css(P.ink, 0));
            ctx.save(); ctx.translate(bs.x + SH.dx * 0.5, bs.y + bs.bw * 0.05); ctx.scale(bs.bw * 0.62, bs.bw * 0.11); ctx.fillStyle = rg; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
            ctx.globalAlpha = 1;
          }
          ctx.restore();
          // meadow sheet with the river cut out
          setLayer(PARF, slide, (1 - tw(t, 1.95, 0.75, 'back.out(1.4)')) * -0.014);
          bigShadow(L.floor, 1, clamp((1 - fe) * 3, 0, 1));
          const fg = ctx.createLinearGradient(0, 630, 0, 1080); fg.addColorStop(0, css(lit(C.floorFar))); fg.addColorStop(0.55, css(mix(lit(C.floorFar), lit(C.floor), 0.75))); fg.addColorStop(1, css(lit(C.floor)));
          sheet(L.floor.p, lit(C.floor), { rule: 'evenodd', bb: L.floor.bb, gx: 300, gy: 120, fill: fg });
          // fields + bushes placed onto the meadow
          for (const f of FIELDS) {
            const e = tw(t, 2.45 + f.d, 0.4, 'back.out(1.6)'); if (e <= 0) continue;
            setLayer(PARF, slide); ctx.translate(0, (1 - e) * 30); ctx.globalAlpha = Math.min(1, e * 2);
            sheet(f.p, lit(f.alt ? C.field2 : C.field), { shadow: 0.2, blur: 8, so: 0.5, rim: 1.6, bb: f.bb, gx: f.bb[0] });
            { const fb = lit(f.alt ? C.field2 : C.field); ctx.save(); ctx.clip(f.p); const n = 9, fw = f.bb[2] - f.bb[0];
              for (let i = -2; i <= n + 2; i++) { const x = f.bb[0] + fw * i / n, vx = 960 + (x - 960) * 0.1;
                ctx.strokeStyle = css(mix(fb, P.ink, 0.22), 0.55); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, f.bb[3] + 4); ctx.lineTo(vx, 560); ctx.stroke();
                ctx.strokeStyle = css(mix(fb, P.cream, 0.4), 0.5); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 2, f.bb[3] + 4); ctx.lineTo(vx - 1, 560); ctx.stroke(); }
              ctx.restore(); }
            ctx.globalAlpha = 1;
          }
          const drawBush = (b) => {
            const e = tw(t, 2.55 + b.d, 0.4, 'back.out(1.8)'); if (e <= 0) return;
            setLayer(PARF, slide); ctx.translate(b.x, b.y + (1 - e) * b.r * 2);
            sheet(b.p, lit(C.bush), { shadow: 0.25, blur: 6, so: 0.4, rim: Math.max(1, b.r * 0.08), bb: [-b.r * 2, -b.r * 1.5, b.r * 2, b.r * 1.5], gx: b.x });
          };
          for (const b of BUSH) if (b.y < nearFn(b.x) - 4) drawBush(b);
          // second meadow terrace
          { const ne = tw(t, 2.15, 0.55, 'back.out(0.7)');
            if (ne > 0) {
              setLayer(PARF, slide + (1 - ne) * 700, (1 - tw(t, 2.15, 0.75, 'back.out(1.4)')) * 0.012);
              bigShadow(L.near, 1, clamp((1 - ne) * 3, 0, 1));
              const ng = ctx.createLinearGradient(0, 760, 0, 1100); ng.addColorStop(0, css(lit(C.nearF))); ng.addColorStop(1, css(lit(C.nearB)));
              sheet(L.near.p, lit(C.nearF), { rule: 'nonzero', bb: L.near.bb, gx: 520, gy: 260, fill: ng });
              for (const f of FIELDS2) {
                const e = tw(t, 2.7 + f.d, 0.4, 'back.out(1.6)'); if (e <= 0) continue;
                ctx.save(); ctx.translate(0, (1 - e) * 40); ctx.globalAlpha = Math.min(1, e * 2);
                sheet(f.p, lit(C.field2), { shadow: 0.22, blur: 8, so: 0.5, rim: 2, bb: f.bb, gx: f.bb[0] });
                const fb = lit(C.field2); ctx.clip(f.p); const n = 10, fw = f.bb[2] - f.bb[0];
                for (let i = -2; i <= n + 2; i++) { const x = f.bb[0] + fw * i / n, vx = 960 + (x - 960) * 0.1;
                  ctx.strokeStyle = css(mix(fb, P.ink, 0.22), 0.55); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, f.bb[3] + 4); ctx.lineTo(vx, 560); ctx.stroke();
                  ctx.strokeStyle = css(mix(fb, P.cream, 0.4), 0.5); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 2.5, f.bb[3] + 4); ctx.lineTo(vx - 1, 560); ctx.stroke(); }
                ctx.restore(); ctx.globalAlpha = 1;
              }
            }
          }
          for (const b of BUSH) if (b.y >= nearFn(b.x) - 4) drawBush(b);
          if (bs) { setLayer(PARF, slide); drawBoat(t, bs); }
          // reeds in front of the boat
          for (let i = 0; i < REEDS.length; i++) {
            const rd = REEDS[i]; const e = tw(t, 2.7 + i * 0.08, 0.45, 'back.out(1.6)'); if (e <= 0) continue;
            setLayer(PARF, slide); ctx.translate(rd.x, rd.y + (1 - e) * 110); ctx.rotate(Math.sin(t * 1.6 + i * 1.7) * 0.03); ctx.translate(-rd.x, -rd.y);
            sheet(rd.p, lit(C.reed), { shadow: 0.25, blur: 6, so: 0.5, rim: 1.2, bb: [rd.x - 80, rd.y - 130, rd.x + 80, rd.y + 4], gx: rd.x });
          }
        }

        useCtx('fg'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
        drawTrees(T.left, t, 3.0, 0.92, 0);
        drawTrees(T.right, t, 3.1, 0.92, 0);
        bigLayer(L.left, t, 2.5);
        bigLayer(L.right, t, 2.62);
        useCtx('main'); ctx.setTransform(1, 0, 0, 1, 0, 0);
        { const fd = 3.2 * push; if (fd > 0.15) ctx.filter = 'blur(' + fd.toFixed(2) + 'px)'; ctx.drawImage(fgC, 0, 0); ctx.filter = 'none'; }

        // drifting pollen in the golden light
        if (gl > 0.02) {
          setLayer(0.85, 0);
          ctx.fillStyle = css(lit(C.pollen));
          for (const p of POLLEN) {
            const x = p.x + Math.sin(t * 0.9 + p.ph) * 18 + t * p.sp * 0.6, y = p.y - t * p.sp + Math.sin(t * 1.3 + p.ph * 2) * 8;
            ctx.globalAlpha = Math.min(1, gl * 2) * (0.45 + 0.4 * Math.sin(t * 2 + p.ph));
            ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // foreground grass
        for (let i = 0; i < 2; i++) {
          const fz = FERN[i]; const e = tw(t, 3.0 + i * 0.1, 0.55, 'back.out(0.9)'); if (e <= 0) continue;
          setLayer(fz.par, (1 - e) * 600 + tw(t, 5.0, 0.9, 'power2.in') * 900);
          ctx.translate(fz.cx, 1160); ctx.rotate(Math.sin(t * 1.25 + i * 2) * 0.018 + (1 - e) * 0.05 * (i ? -1 : 1)); ctx.translate(-fz.cx, -1160);
          sheet(fz.p, lit(C.fern), { shadow: 0.35, blur: 22, so: 1.2, rim: 2.2, bb: [fz.cx - 420, 720, fz.cx + 420, 1180], gx: 77 * i });
        }

        // light: dusk glow from the sun + vignette
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const k = 1 + (CAM.Z - 1) * 0.18;
        const sx = SUNPOS[0] * k + F[0] * (1 - k) + V[0] * CAM.u * 0.18, sy = SUNPOS[1] * k + F[1] * (1 - k) + V[1] * CAM.u * 0.18;
        if (gl > 0.01) {
          ctx.globalCompositeOperation = 'soft-light';
          const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 1400);
          rg.addColorStop(0, css(P.rose, 0.8 * gl)); rg.addColorStop(0.45, css(P.sand, 0.35 * gl)); rg.addColorStop(1, css(P.teal, 0.25 * gl));
          ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
        }
        ctx.globalCompositeOperation = 'multiply';
        const vg = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.5, W / 2, H * 0.5, H * 1.15);
        vg.addColorStop(0, 'rgba(255,255,255,1)'); vg.addColorStop(1, css(mix(mix(P.cream, P.rose, gl * 0.5), P.ink, 0.13 + 0.1 * gl)));
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';
      }

      function drawBoat(t, bs) {
        const sc = bs.bw / 200;
        ctx.save();
        ctx.translate(bs.x, bs.y + (1 - bs.ap) * bs.bw * 0.35 + Math.sin(t * 2.6) * bs.bw * 0.012);
        ctx.rotate(Math.sin(t * 2.1) * 0.035);
        ctx.scale(sc * (0.8 + 0.2 * bs.ap), sc * (0.8 + 0.2 * bs.ap));
        ctx.globalAlpha = bs.o;
        const bb = [-110, -230, 110, 12];
        sheet(B.hull, lit(C.hullL), { shadow: 0.3, blur: 10, rim: 2, bb: bb, gx: 10, rimAmt: 0.3 });
        sheet(B.fold, lit(C.hullF), { rim: 1.6, bb: bb, gx: 30, rimAmt: 0.3 });
        sheet(B.sailR, lit(C.hullD), { shadow: 0.25, blur: 8, so: 0.5, rim: 1.8, bb: bb, gx: 60 });
        sheet(B.sailL, lit(C.hullL), { rim: 1.8, bb: bb, gx: 90, rimAmt: 0.5 });
        const fp = tw(t, 7.85, 0.5, 'back.out(2.2)');
        if (fp > 0) {
          ctx.save(); ctx.translate(0, -168); ctx.scale(1, 0.6 + 0.4 * fp); ctx.globalAlpha = bs.o * Math.min(1, fp * 2.5);
          ctx.strokeStyle = css(P.ink); ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, -58); ctx.stroke();
          ctx.translate(0, 168);
          ctx.translate(0, -217); ctx.scale(1, 1 + Math.sin(t * 7) * 0.08); ctx.translate(0, 217);
          sheet(B.flag, P.rose, { shadow: 0.25, blur: 6, rim: 1.4, bb: [-4, -230, 46, -190], gx: 5, rimAmt: 0.35 });
          ctx.restore();
        }
        ctx.globalAlpha = bs.o;
        ctx.save(); ctx.clip(B.hull);
        ctx.fillStyle = css(lit(C.water), 0.85);
        ctx.beginPath(); ctx.moveTo(-120, 2); for (let x = -120; x <= 120; x += 10) ctx.lineTo(x, -2 + Math.sin(x * 0.08 + t * 5) * 2.6); ctx.lineTo(120, 30); ctx.lineTo(-120, 30); ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.restore();
        ctx.globalAlpha = 1;
      }
      const tl = gsap.timeline({ paused: true });
      const pr = { t: 0 };
      tl.to(pr, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => draw(pr.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      draw(0);
      tl.seek(0);
    })();
    </script>
