<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cristalización 3D</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--ss-vacio-profundo); color: var(--ss-nieve); font-family: var(--ss-font-cuerpo); }
  canvas { display: block; width: 100%; height: 100%; }
  p { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); margin: 0; font-size: 14px; color: var(--ss-bruma); text-align: center; }
</style>
</head>
<body>
<canvas id="lienzo" aria-label="Retícula cristalina de nodos alrededor de un diamante que respira"></canvas>
<p>Cristalización: la malla de nodos se ordena alrededor del diamante.</p>
<script type="module">
  // Three.js (MIT), versión fijada. Retícula instanciada + octaedro de cristal; luz de tres puntos.
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
  const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const movil = matchMedia("(max-width: 640px)").matches;
  const lienzo = document.getElementById("lienzo");
  const render = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true, alpha: true });
  render.setPixelRatio(Math.min(devicePixelRatio, 2));
  const escena = new THREE.Scene();
  const camara = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camara.position.set(0, 1.2, 9); camara.lookAt(0, 0, 0); // sujeto centrado

  // Luz de tres puntos: clave cálida, relleno suave, contra del color del registro (zenith).
  escena.add(new THREE.AmbientLight(0xffffff, 0.25));
  const clave = new THREE.DirectionalLight(0xffbf00, 1.2); clave.position.set(4, 5, 6); escena.add(clave);
  const relleno = new THREE.DirectionalLight(0xf8f9fa, 0.4); relleno.position.set(-5, 2, 4); escena.add(relleno);
  const contra = new THREE.PointLight(0x007fff, 30, 20); contra.position.set(0, 2, -4); escena.add(contra);

  // Diamante: octaedro de cristal.
  const diamante = new THREE.Mesh(
    new THREE.OctahedronGeometry(1.1, 0),
    new THREE.MeshPhysicalMaterial({ color: 0xf8f9fa, metalness: 0, roughness: 0.08, transmission: 0.9, thickness: 1.2, ior: 2.4, flatShading: true })
  );
  escena.add(diamante);

  // Retícula: nodos instanciados en una red cúbica centrada; empiezan dispersos y se ordenan.
  const lado = movil ? 4 : 6, paso = 0.9, n = lado ** 3;
  const nodos = new THREE.InstancedMesh(new THREE.SphereGeometry(0.06, 12, 12), new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.4 }), n);
  escena.add(nodos);
  const destino = [], origen = [], m = new THREE.Matrix4();
  for (let x = 0; x < lado; x++) for (let y = 0; y < lado; y++) for (let z = 0; z < lado; z++) {
    const p = new THREE.Vector3((x - (lado - 1) / 2) * paso, (y - (lado - 1) / 2) * paso, (z - (lado - 1) / 2) * paso);
    destino.push(p);
    origen.push(p.clone().multiplyScalar(2.5).add(new THREE.Vector3((Math.random() - .5) * 4, (Math.random() - .5) * 4, (Math.random() - .5) * 4)));
  }
  const suave = (t) => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);

  function tamano() {
    const w = lienzo.clientWidth, h = lienzo.clientHeight;
    render.setSize(w, h, false); camara.aspect = w / h; camara.updateProjectionMatrix();
  }
  addEventListener("resize", tamano); tamano();

  const inicio = performance.now();
  function cuadro(ahora) {
    const t = reducido ? 99 : (ahora - inicio) / 1000;
    const k = suave(t / 3); // 3 s para cristalizar
    for (let i = 0; i < n; i++) {
      const p = origen[i].clone().lerp(destino[i], k);
      m.makeTranslation(p.x, p.y, p.z); nodos.setMatrixAt(i, m);
    }
    nodos.instanceMatrix.needsUpdate = true;
    const respira = 1 + 0.03 * Math.sin(t * (2 * Math.PI / 5)); // respiración de 5 s
    diamante.scale.setScalar(respira);
    if (!reducido) { escena.rotation.y = t * (2 * Math.PI / 16); diamante.rotation.y = -t * 0.3; } // órbita de 16 s
    render.render(escena, camara);
    if (!reducido) requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
</script>
</body>
</html>
