#cloud-config
# cloud-init para micro (VM.Standard.E2.1.Micro) — Ubuntu 24.04 amd64
# Fuente de verdad: architecture/oracle-nube.md §3, §5
# Regla: usuario starseed, solo llave SSH (variable), sin contraseña,
# Docker, fail2ban, unattended-upgrades, iptables abierto y persistido.

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose
  - fail2ban
  - netfilter-persistent
  - iptables-persistent
  - curl
  - vim
  - git
  - coturn

users:
  - name: starseed
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${STARSEED_PUBLIC_KEY}
    shell: /bin/bash
    lock_passwd: true
    groups: [docker]

runcmd:
  - echo "net.ipv4.ip_forward=1" >> /etc/sysctl.conf
  - sysctl -p
  # iptables: abrir 3478/tcp+udp, 5349/tcp, 49160-49200/udp (micro 1, coturn)
  - iptables -I INPUT -p tcp --dport 3478 -j ACCEPT
  - iptables -I INPUT -p udp --dport 3478 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 5349 -j ACCEPT
  - iptables -A INPUT -p udp --match multiport --dports 49160:49200 -j ACCEPT
  - netfilter-persistent save
  - dpkg-reconfigure -plow unattended-upgrades || echo "unattended-upgrades configurado"
  - systemctl enable docker --now
  - systemctl enable fail2ban --now
  - mkdir -p /etc/starseed /var/lib/starseed/volumes /opt/vigia
  - chown root:root /etc/starseed && chmod 755 /etc/starseed
  # Configuración de coturn con autenticación por secreto
  - |
    cat > /etc/turnserver.conf << 'EOF'
    listening-port=3478
    tls-listening-port=5349
    use-auth-secret
    static-auth-secret=${TURN_STATIC_AUTH_SECRET}
    realm=${TURN_REALM}
    server-name=${TURN_SERVER_NAME}
    fingerprint
    total-quota=100
    max-allocated-lifetime=3600
    relay-min-port=49160
    relay-max-port=49200
    no-cli
    EOF
  - chown root:root /etc/turnserver.conf && chmod 600 /etc/turnserver.conf
  # Script del vigía (micro 2) — sondea las URLs del A1 y escribe estado
  - |
    cat > /opt/vigia/vigia.py << 'EOF'
    #!/usr/bin/env python3
    # Vigía de la nube — sondea servicios del A1, tunnel y Supabase.
    import urllib.request, json, time, os
    ESTADO = "/var/lib/starseed/vigia_estado.json"
    URLS = [
      {"nombre":"astraura","url":"https://astraura.${STARSEED_HOST}/health"},
      {"nombre":"malla","url":"https://malla.${STARSEED_HOST}/"},
      {"nombre":"media","url":"https://media.${STARSEED_HOST}/"},
      {"nombre":"buscar","url":"https://buscar.${STARSEED_HOST}/"},
      {"nombre":"n8n","url":"https://n8n.${STARSEED_HOST}/"},
      {"nombre":"supabase","url":"https://supabase.co/rest/v1/"},
    ]
    def sondear():
      resultado = {}
      for s in URLS:
        try:
          req = urllib.request.urlopen(s["url"], timeout=10)
          resultado[s["nombre"]] = {"ok": True, "ms": 0, "status": req.status}
        except Exception as e:
          resultado[s["nombre"]] = {"ok": False, "ms": 0, "error": str(e)}
      with open(ESTADO, "w") as f:
        json.dump({"t": time.time(), "servicios": resultado}, f)
    if __name__ == "__main__":
      sondear()
    EOF
  - chmod +x /opt/vigia/vigia.py
  - (crontab -l 2>/dev/null; echo "*/5 * * * * /usr/bin/python3 /opt/vigia/vigia.py") | crontab -
