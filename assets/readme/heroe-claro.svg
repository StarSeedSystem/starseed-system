<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title-hero-light desc-hero-light">
  <title id="title-hero-light">StarSeed OS — Hero claro</title>
  <desc id="desc-hero-light">Portada de StarSeed OS con símbolo, nombre, lema y banda de cristal líquido en modo nieve</desc>
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="45%" stop-color="#EDF0F4"/>
      <stop offset="75%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EDF0F4"/>
    </linearGradient>
    <linearGradient id="crystal-band-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007FFF" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFBF00" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#DC143C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="text-gradient-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#46506A"/>
    </linearGradient>
    <filter id="glow-zenith-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-crystal-light" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="symbol-clip-light">
      <circle cx="640" cy="200" r="80"/>
    </clipPath>
  </defs>
  <rect width="1280" height="400" fill="url(#bg-light)"/>
  <g opacity="0.06" aria-hidden="true">
    <circle cx="200" cy="100" r="180" fill="#007FFF" filter="url(#glow-zenith-light)"/>
    <circle cx="1080" cy="300" r="220" fill="#10B981" filter="url(#glow-zenith-light)"/>
    <ellipse cx="640" cy="200" rx="300" ry="150" fill="url(#crystal-band-light)" opacity="0.2"/>
  </g>
  <g transform="translate(120, 80)">
    <image href="data:image/png;base64," width="160" height="160" clip-path="url(#symbol-clip-light)" filter="url(#glow-crystal-light)"/>
  </g>
  <text x="320" y="170" font-family="'Satoshi', 'Rajdhani', 'Inter', system-ui, sans-serif" font-size="48" font-weight="700" fill="url(#text-gradient-light)" letter-spacing="-0.02em">StarSeed OS</text>
  <text x="320" y="225" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="300" fill="#46506A" letter-spacing="0.01em">Sistema Operativo Social Descentralizado · Soberanía, Conciencia, Abundancia</text>
  <rect x="120" y="260" width="1040" height="60" rx="30" fill="url(#crystal-band-light)" filter="url(#glow-crystal-light)" opacity="0.95"/>
  <text x="640" y="298" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="18" font-weight="500" fill="#0A0F1D" text-anchor="middle" letter-spacing="0.05em">ZENITH · HORIZONTE · LÓGICA · ANCLA — Trinity Liquid Crystal</text>
</svg>