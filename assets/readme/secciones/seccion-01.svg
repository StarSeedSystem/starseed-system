<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80" viewBox="0 0 800 80" role="img" aria-labelledby="title-sec01 desc-sec01">
  <title id="title-sec01">Sección 1 — Descargas</title>
  <desc id="desc-sec01">Cabecera de sección numerada para Descargas: estable, pruebas y plataformas</desc>
  <defs>
    <linearGradient id="sec-bg-01" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="sec-gradient-01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007FFF"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="crystal-band-01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007FFF" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#FFBF00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DC143C" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="sec-glow-01" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crystal-glow-01" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow-01" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="80" fill="url(#sec-bg-01)"/>
  <g opacity="0.06" aria-hidden="true">
    <circle cx="150" cy="40" r="120" fill="#007FFF" filter="url(#sec-glow-01)"/>
    <circle cx="650" cy="40" r="100" fill="#10B981" filter="url(#sec-glow-01)"/>
  </g>
  <g transform="translate(30, 12)">
    <circle cx="25" cy="25" r="25" fill="url(#sec-gradient-01)" filter="url(#sec-glow-01)"/>
    <text x="25" y="31" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0A0F1D" text-anchor="middle" filter="url(#text-glow-01)">01</text>
    <text x="70" y="42" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="26" font-weight="700" fill="#F8F9FA" filter="url(#text-glow-01)">Descargas</text>
    <text x="70" y="58" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#AEB6C8">Estable · Pruebas · Plataformas</text>
  </g>
  <rect x="30" y="62" width="740" height="4" rx="2" fill="url(#crystal-band-01)" filter="url(#crystal-glow-01)" opacity="0.8"/>
</svg>