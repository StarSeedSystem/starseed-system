<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80" viewBox="0 0 800 80" role="img" aria-labelledby="title-sec05 desc-sec05">
  <title id="title-sec05">Sección 5 — Ecosistema StarSeed</title>
  <desc id="desc-sec05">Cabecera de sección numerada para Ecosistema StarSeed: OS, Nexus, Café, Audiomorphic, Fundación</desc>
  <defs>
    <linearGradient id="sec-bg-05" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="sec-gradient-05" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CD77F8"/>
      <stop offset="50%" stop-color="#25D1F4"/>
      <stop offset="100%" stop-color="#F471F4"/>
    </linearGradient>
    <linearGradient id="crystal-band-05" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CD77F8" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#25D1F4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F471F4" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D77F" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="sec-glow-05" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crystal-glow-05" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow-05" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="80" fill="url(#sec-bg-05)"/>
  <g opacity="0.06" aria-hidden="true">
    <circle cx="150" cy="40" r="120" fill="#CD77F8" filter="url(#sec-glow-05)"/>
    <circle cx="650" cy="40" r="100" fill="#25D1F4" filter="url(#sec-glow-05)"/>
  </g>
  <g transform="translate(30, 12)">
    <circle cx="25" cy="25" r="25" fill="url(#sec-gradient-05)" filter="url(#sec-glow-05)"/>
    <text x="25" y="31" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0A0F1D" text-anchor="middle" filter="url(#text-glow-05)">05</text>
    <text x="70" y="42" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="26" font-weight="700" fill="#F8F9FA" filter="url(#text-glow-05)">Ecosistema StarSeed</text>
    <text x="70" y="58" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#AEB6C8">OS · Nexus · Café · Audiomorphic · Fundación</text>
  </g>
  <rect x="30" y="62" width="740" height="4" rx="2" fill="url(#crystal-band-05)" filter="url(#crystal-glow-05)" opacity="0.8"/>
</svg>