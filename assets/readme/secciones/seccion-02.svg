<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80" viewBox="0 0 800 80" role="img" aria-labelledby="title-sec02 desc-sec02">
  <title id="title-sec02">Sección 2 — Qué incluye</title>
  <desc id="desc-sec02">Cabecera de sección numerada para Qué incluye: áreas reales, estado y tarjetas</desc>
  <defs>
    <linearGradient id="sec-bg-02" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="sec-gradient-02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#2DD29B"/>
    </linearGradient>
    <linearGradient id="crystal-band-02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#39FF14" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFBF00" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#DC143C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="sec-glow-02" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crystal-glow-02" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow-02" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="80" fill="url(#sec-bg-02)"/>
  <g opacity="0.06" aria-hidden="true">
    <circle cx="150" cy="40" r="120" fill="#10B981" filter="url(#sec-glow-02)"/>
    <circle cx="650" cy="40" r="100" fill="#39FF14" filter="url(#sec-glow-02)"/>
  </g>
  <g aria-hidden="true" transform="translate(700 40)" fill="none" stroke="#39FF14" stroke-width="1.2" opacity="0.6">
    <circle r="10"/>
    <circle cx="10" r="10"/>
    <circle cx="-10" r="10"/>
    <circle cx="5" cy="8.66" r="10"/>
    <circle cx="-5" cy="8.66" r="10"/>
    <circle cx="5" cy="-8.66" r="10"/>
    <circle cx="-5" cy="-8.66" r="10"/>
    <circle r="2.2" fill="#10B981" stroke="none"/>
  </g>
  <g transform="translate(30, 12)">
    <circle cx="25" cy="25" r="25" fill="url(#sec-gradient-02)" filter="url(#sec-glow-02)"/>
    <text x="25" y="31" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0A0F1D" text-anchor="middle" filter="url(#text-glow-02)">02</text>
    <text x="70" y="42" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="26" font-weight="700" fill="#F8F9FA" filter="url(#text-glow-02)">Qué incluye</text>
    <text x="70" y="58" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#AEB6C8">Áreas reales · Estado · Tarjetas</text>
  </g>
  <rect x="30" y="62" width="740" height="4" rx="2" fill="url(#crystal-band-02)" filter="url(#crystal-glow-02)" opacity="0.8"/>
</svg>