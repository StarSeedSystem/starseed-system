    <text x="360" y="35" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#F8F9FA" text-anchor="middle" filter="url(#text-glow)">CAPA 1 — LA RED Y LOS NODOS</text>
    <text x="360" y="58" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#AEB6C8" text-anchor="middle">Infraestructura física descentralizada · Federación de topologías · Transporte adaptativo</text>
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="200" height="90" rx="10" fill="#0A0F1D" stroke="#007FFF" stroke-width="1" opacity="0.8"/>
      <text x="100" y="22" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#00F0FF" text-anchor="middle">Mesh LoRa</text>
      <text x="100" y="45" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#AEB6C8" text-anchor="middle">Meshtastic · Duty cycle</text>
      <text x="100" y="62" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#AEB6C8" text-anchor="middle">P2P pasivo · Cola P0–P3</text>
      <circle cx="100" cy="80" r="4" fill="#00F0FF" opacity="0.6"/>
    </g>
    <g transform="translate(260, 75)">
