  <g transform="translate(40, 690)">
    <text x="360" y="0" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#46506A" text-anchor="middle">Flujo: Física (Cuerpo) → Red (Sistema Nervioso) → Mente Digital → Apps (Expresión) · φ = 1.618 · tokens.json · Sin scripts · Seguro en GitHub</text>
