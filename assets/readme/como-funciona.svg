      <text x="100" y="22" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#10B981" text-anchor="middle">Wi-Fi / TCP</text>
      <text x="100" y="45" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#AEB6C8" text-anchor="middle">Daemon · Serial · BLE</text>
      <text x="100" y="62" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#AEB6C8" text-anchor="middle">connectWifiNode · Simulador</text>
      <circle cx="100" cy="80" r="4" fill="#10B981" opacity="0.6"/>
    </g>
    <g transform="translate(490, 75)">
      <rect x="0" y="0" width="200" height="90" rx="10" fill="#0A0F1D" stroke="#10B981" stroke-width="1" opacity="0.8"/>
      <text x="100" y="22" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#39FF14" text-anchor="middle">Syncthing / P2P</text>
      <text x="100" y="45" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#AEB6C8" text-anchor="middle">Cifrado extremo a extremo</text>
      <text x="100" y="62" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#AEB6C8" text-anchor="middle">Archivos · Cerebros · Memoria</text>
      <circle cx="100" cy="80" r="4" fill="#39FF14" opacity="0.6"/>
    </g>
  </g>
