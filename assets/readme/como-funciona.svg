      <ellipse cx="100" cy="30" rx="22" ry="16" fill="none" stroke="#FFBF00" stroke-width="2" opacity="0.6"/>
      <ellipse cx="100" cy="30" rx="14" ry="10" fill="url(#astraura-orb)" opacity="0.4"/>
      <text x="100" y="60" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFBF00" text-anchor="middle">Exocórtex</text>
      <text x="100" y="80" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">Propiedad del usuario</text>
      <text x="100" y="95" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">Lealtad al usuario</text>
      <text x="100" y="110" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">Privacidad ↔ Transparencia</text>
    </g>
    <g transform="translate(490, 75)">
