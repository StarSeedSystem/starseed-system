      <g fill="none" stroke="#DC143C" stroke-width="1.5" opacity="0.7">
        <circle cx="100" cy="30" r="20"/>
        <circle cx="70" cy="30" r="6"/>
        <circle cx="130" cy="30" r="6"/>
        <circle cx="100" cy="6" r="6"/>
        <circle cx="100" cy="54" r="6"/>
        <line x1="100" y1="30" x2="70" y2="30"/>
        <line x1="100" y1="30" x2="130" y2="30"/>
        <line x1="100" y1="30" x2="100" y2="6"/>
        <line x1="100" y1="30" x2="100" y2="54"/>
        <line x1="70" y1="30" x2="100" y2="6"/>
        <line x1="130" y1="30" x2="100" y2="6"/>
        <line x1="70" y1="30" x2="100" y2="54"/>
        <line x1="130" y1="30" x2="100" y2="54"/>
      </g>
      <text x="100" y="60" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#DC143C" text-anchor="middle">Malla Neural</text>
      <text x="100" y="80" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">Auto-vínculo WebRTC</text>
      <text x="100" y="95" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">≥2 neuronas online</text>
      <text x="100" y="110" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">Faros · Relay · Federación</text>
    </g>
