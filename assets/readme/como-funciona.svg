<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title-como-funciona desc-como-funciona">
  <title id="title-como-funciona">Cómo funciona StarSeed OS — Diagrama de capas</title>
  <desc id="desc-como-funciona">Diagrama de tres capas: 1) Red y nodos (mesh LoRa, Wi-Fi, Syncthing), 2) Mente digital (Astraura 1.58-bit, exocórtex, malla neural), 3) Apps (StarSeed OS, Nexus, Café)</desc>
  <defs>
    <linearGradient id="bg-como" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#001F3F"/>
    </linearGradient>
    <linearGradient id="layer-red-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007FFF"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="layer-mente-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#FFBF00"/>
      <stop offset="100%" stop-color="#DC143C"/>
    </linearGradient>
    <linearGradient id="layer-apps-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFBF00"/>
      <stop offset="50%" stop-color="#DC143C"/>
      <stop offset="100%" stop-color="#F5B91A"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B2E"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
    <filter id="layer-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#layer-red-gradient)"/>
    </marker>
    <marker id="arrow-head-2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#layer-mente-gradient)"/>
    </marker>
    <marker id="arrow-head-3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#layer-apps-gradient)"/>
    </marker>
  </defs>
  <rect width="800" height="720" fill="url(#bg-como)"/>
  <g opacity="0.04" aria-hidden="true">
    <circle cx="200" cy="100" r="150" fill="#007FFF" filter="url(#layer-glow)"/>
    <circle cx="600" cy="620" r="180" fill="#10B981" filter="url(#layer-glow)"/>
    <path d="M 100 360 Q 400 200 700 360 Q 400 520 100 360" stroke="url(#layer-mente-gradient)" stroke-width="2" fill="none" opacity="0.3"/>
  </g>
  <g transform="translate(40, 30)">
