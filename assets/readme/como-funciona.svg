    <text x="360" y="58" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#AEB6C8" text-anchor="middle">Inteligencia soberana 1.58-bit · Exocórtex personal · Malla neural auto-vinculante</text>
    <g transform="translate(30, 75)">
