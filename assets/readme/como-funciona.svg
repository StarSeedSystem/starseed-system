      <circle cx="100" cy="30" r="18" fill="url(#astraura-orb)" filter="url(#layer-glow)"/>
      <text x="100" y="60" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#00F0FF" text-anchor="middle">Astraura 1.58-bit</text>
      <text x="100" y="80" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">Motor ternario · Needle 3</text>
      <text x="100" y="95" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">Router económico · Jev</text>
      <text x="100" y="110" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#AEB6C8" text-anchor="middle">22–127 MB · 0,12 s</text>
