    <text x="360" y="35" font-family="'Rajdhani', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#F8F9FA" text-anchor="middle" filter="url(#text-glow)">CAPA 3 — LAS APPS DEL ECOSISTEMA</text>
    <text x="360" y="58" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#AEB6C8" text-anchor="middle">Tres aplicaciones nativas · Instalables · PWA · Código abierto absoluto</text>
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="200" height="100" rx="10" fill="#0A0F1D" stroke="#007FFF" stroke-width="1.5" opacity="0.9"/>
